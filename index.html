// Guesses which voice pool ("m" / "f" / null-for-neutral) a character
// name leans toward. Checks the curated lists first, then falls back to
// a couple of very soft common name-ending patterns, and finally gives
// up cleanly (returns null) rather than guessing wildly — an
// unrecognized/ambiguous name just draws from the full neutral pool.
function guessNameGenderPool(rawName){
  if(!rawName) return null;
  const first = String(rawName).trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g, "");
  if(!first) return null;
  if(MALE_NAME_HINTS.has(first)) return "m";
  if(FEMALE_NAME_HINTS.has(first)) return "f";
  // Soft fallback pattern (Filipino/Spanish/English names ending in
  // "a" skew female, e.g. Maria/Rosa/Liza; ending in "o" skew male,
  // e.g. Marco/Paulo/Romeo) — deliberately conservative, so anything
  // that doesn't fit either pattern just returns null (neutral).
  if(/a$/.test(first)) return "f";
  if(/o$/.test(first)) return "m";
  return null;
}

// Picks a voice for `name` out of `pool` using a hash of the NAME
// itself (not the character's array position), so:
//   1) the same name always lands on the same voice, read after read
//   2) short stories with only 1-2 characters stop always landing on
//      voice[0]/voice[1] — the old bug, since index was just "which
//      speaker happened to appear first" — and instead spread out
//      across the whole gender-matched pool.
// If the hashed voice is already taken by another character in this
// same story, linearly probes forward to the next free slot in the
// pool so two different characters don't end up sounding identical.
function pickVoiceForName(name, pool, usedVoices){
  const h = hashStoryText(String(name).toLowerCase());
  const hNum = parseInt(h.split("_")[0], 36) || 0;
  const idx = hNum % pool.length;
  for(let tries=0; tries<pool.length; tries++){
    const candidate = pool[(idx + tries) % pool.length];
    if(!usedVoices.has(candidate)){
      usedVoices.add(candidate);
      return candidate;
    }
  }
  return pool[idx]; // every voice in this pool already used (big cast) — reuse is unavoidable
}

// Normalizes whatever a person typed in the story JSON's "genders" map
// ("boy", "girl", "male", "female", "m", "f", mixed case, etc.) down to
// "m" / "f" / null. Anything unrecognized returns null so it falls
// through to the name-guess heuristic instead of erroring out.
function normalizeGenderValue(raw){
  if(!raw) return null;
  const v = String(raw).trim().toLowerCase();
  if(v === "boy" || v === "male" || v === "m" || v === "man") return "m";
  if(v === "girl" || v === "female" || v === "f" || v === "woman") return "f";
  return null;
}

// `genderOverrides` is an optional {characterName: "boy"|"girl"|...} map,
// straight from the story JSON's "genders" field — see STORY_JSON_SAMPLE.
// An explicit override always wins over the name-guess heuristic, so a
// name the guesser would get wrong (nicknames, invented character names,
// names outside the curated lists, etc.) can just be stated directly.
function assignGeminiVoices(segments, genderOverrides){
  const names = Array.from(new Set(segments.map(s=>s.speaker || "Narrator")));
  const map = {};
  const usedVoices = new Set();
  // Case-insensitive lookup, since a hand-typed or LLM-written "genders"
  // map won't always match a speaker's capitalization exactly (e.g.
  // "maya" in genders vs "Maya" as the speaker name).
  const overridesLower = {};
  if(genderOverrides){
    Object.keys(genderOverrides).forEach(k => { overridesLower[k.trim().toLowerCase()] = genderOverrides[k]; });
  }
  names.forEach((name, i)=>{
    if(name === "Narrator"){
      // The narrator's voice can be steered the same way a character's
      // can — via a "Narrator" entry in the genders map — so a specific
      // male/female voice pool is used instead of the full neutral pool.
      // No override -> unchanged old behavior (draws from every voice).
      const narratorGender = normalizeGenderValue(overridesLower["narrator"]);
      const narratorPool = narratorGender === "f" ? GEMINI_VOICES_FEMALE_LEANING
        : narratorGender === "m" ? GEMINI_VOICES_MALE_LEANING
        : GEMINI_TTS_VOICES;
      map[name] = {
        voice: pickVoiceForName(name, narratorPool, usedVoices),
        style: "calm and gentle storyteller"
      };
      return;
    }
    const overrideGender = normalizeGenderValue(overridesLower[name.trim().toLowerCase()]);
    const genderPool = overrideGender || guessNameGenderPool(name);
    const pool = genderPool === "f" ? GEMINI_VOICES_FEMALE_LEANING
      : genderPool === "m" ? GEMINI_VOICES_MALE_LEANING
      : GEMINI_TTS_VOICES; // unrecognized/ambiguous name -> safe neutral fallback (full pool)
    map[name] = {
      voice: pickVoiceForName(name, pool, usedVoices),
      style: GEMINI_VOICE_STYLES[i % GEMINI_VOICE_STYLES.length]
    };
  });
  return map;
}

// Splits a story's segments into parts of at most 2 distinct speakers
// and at most 6 lines each. A new part starts as soon as either limit
// would be exceeded by the next line.
function chunkStoryForGemini(segments){
  const parts = [];
  let current = null;
  segments.forEach(seg=>{
    const label = seg.speaker || "Narrator";
    if(current){
      const speakerCountAfter = current.speakerSet.size + (current.speakerSet.has(label) ? 0 : 1);
      if(current.lines.length >= 6 || speakerCountAfter > 2){
        parts.push(current);
        current = null;
      }
    }
    if(!current) current = { speakerSet: new Set(), lines: [] };
    current.speakerSet.add(label);
    current.lines.push({ label, text: seg.text });
  });
  if(current && current.lines.length) parts.push(current);
  return parts;
}

// Raw PCM (16-bit, mono, 24kHz — Gemini TTS's output format) needs a
// 44-byte WAV header wrapped around it before <audio>/Audio() will
// play it directly from a Blob URL.
// Accepts an array of base64 PCM chunks (one per story "part", in
// order) and wraps them behind a SINGLE WAV header, so many API
// responses become one seamless full-story audio file — this is the
// file that gets cached and replayed later.
function base64PcmChunksToWavBlob(base64Chunks, sampleRate, channels){
  sampleRate = sampleRate || 24000;
  channels = channels || 1;
  const byteArrays = base64Chunks.map(b64 => {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  });
  const len = byteArrays.reduce((sum, a) => sum + a.length, 0);
  const blockAlign = channels * 2;
  const byteRate = sampleRate * blockAlign;
  const buffer = new ArrayBuffer(44 + len);
  const view = new DataView(buffer);
  function writeStr(offset, str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }
  writeStr(0, "RIFF"); view.setUint32(4, 36+len, true); writeStr(8, "WAVE");
  writeStr(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, channels, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true); view.setUint16(32, blockAlign, true); view.setUint16(34, 16, true);
  writeStr(36, "data"); view.setUint32(40, len, true);
  const out = new Uint8Array(buffer, 44);
  let offset = 0;
  byteArrays.forEach(a => { out.set(a, offset); offset += a.length; });
  return new Blob([buffer], { type: "audio/wav" });
}
function pcm16ToWavBlob(base64Pcm, sampleRate, channels){
  return base64PcmChunksToWavBlob([base64Pcm], sampleRate, channels);
}

// One network call per "part" (see chunkStoryForGemini). Throws on
// failure so the caller can skip just this part instead of losing the
// whole story.
async function callGeminiTTS(apiKey, part, voiceMap){
  const speakers = Array.from(part.speakerSet);
  const isMulti = speakers.length > 1;
  // IMPORTANT: single-speaker parts used to get a differently-worded
  // prompt with the speaker label stripped out entirely (just the raw
  // line text). Since each "part" is its own separate, stateless Gemini
  // TTS call, that meant the SAME character could be fed two genuinely
  // different prompt shapes depending on which other lines happened to
  // land in the same chunk — and Gemini would render the same voiceName
  // with a noticeably different performance as a result. Always using
  // the exact same "Label: text" line format, and always repeating that
  // character's fixed style phrase (from assignGeminiVoices), gives the
  // model identical steering input for that character every single time,
  // regardless of chunk boundaries.
  const linesText = part.lines.map(l => `${l.label}: ${l.text}`).join("\n");
  const styleNotes = speakers
    .map(s => `${s} speaks in a ${(voiceMap[s] && voiceMap[s].style) || "warm and gentle"} voice.`)
    .join(" ");
  const promptText = `TTS the following story for young children, in a warm, natural, gentle storytelling voice. ${styleNotes}\n${linesText}`;
  // Multi-speaker mode needs each speaker's name in speechConfig to
  // exactly match the name used in the prompt text above.
  const speechConfig = isMulti
    ? { multiSpeakerVoiceConfig: { speakerVoiceConfigs: speakers.map(s => ({
        speaker: s,
        voiceConfig: { prebuiltVoiceConfig: { voiceName: (voiceMap[s] && voiceMap[s].voice) || voiceMap[s] } }
      })) } }
    : { voiceConfig: { prebuiltVoiceConfig: { voiceName: (voiceMap[speakers[0]] && voiceMap[speakers[0]].voice) || voiceMap[speakers[0]] } } };

  const res = await fetch(`${GEMINI_TTS_URL}?key=${encodeURIComponent(apiKey)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: { responseModalities: ["AUDIO"], speechConfig }
    })
  });
  if(!res.ok){
    let detail = "";
    try{ detail = (await res.text()).slice(0, 200); }catch(e){}
    const err = new Error(`Gemini TTS request failed (${res.status})${detail ? ": " + detail : ""}`);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  const inlineData = data && data.candidates && data.candidates[0]
    && data.candidates[0].content && data.candidates[0].content.parts
    && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].inlineData;
  const b64 = inlineData && inlineData.data;
  if(!b64) throw new Error("Gemini TTS returned no audio");
  return b64;
}

// Plays a story using Gemini TTS, one <Audio> per part, parts in
// sequence. Falls back to the free browser voice (playStory) if no key
// is set — that's the ONLY point where it can fall back; once Gemini
// playback has started, a part that fails is skipped (via onPartError),
// never swapped mid-story to the browser voice, so a story is always
// either fully Gemini or fully browser, never a mix of the two.
// onProgress({part, total, phase}) fires per part — phase is "loading"
// while the API call is in flight, then "playing" once audio starts —
// so the UI can show "generating part 2 of 5" / "playing part 2 of 5".
// onPartError(err, partIdx) fires when a part fails after its one
// immediate retry and playback skips ahead. onPartRecovered(partIdx)
// fires later if a background retry (after the story ends) succeeds in
// filling that gap — useful for clearing an earlier warning in the UI.
// noteId lets the cache tell two different story cards apart even if
// their text briefly matches; text is still the real cache key driver
// (edit a story and it's treated as new).
function playStoryWithGemini(text, {onSegment, onEnd, onPartError, onPartRecovered, onDownloadComplete, onProgress, onFallback, noteId, forceRegenerate, genders} = {}){
  const apiKey = loadGeminiApiKey();
  const segments = parseStorySegments(text);
  if(!apiKey || !segments.length){
    if(onFallback) onFallback();
    return playStory(text, {onSegment, onEnd});
  }
  const cacheKey = storyAudioCacheKey(noteId, text, genders);
  let stopped = false;
  let audioEl = null;
  let timeupdateHandler = null;

  function playWholeBlob(blob, fromCache){
    if(stopped) return;
    const url = URL.createObjectURL(blob);
    audioEl = new Audio(url);
    // Fixed 95% speed — only applies to already-downloaded/cached audio
    // (this is the sole call site for playWholeBlob). Live part-by-part
    // generation below is untouched, so speed here never affects a story
    // that's still being generated. playbackRate is applied at playback
    // time only, so it doesn't touch what's stored in IndexedDB.
    audioEl.playbackRate = 0.95;
    audioEl.addEventListener("loadedmetadata", () => {
      const realStarts = estimateSegmentStarts(segments, audioEl.duration || 0);
      timeupdateHandler = () => {
        let idx = 0;
        for(let i=0;i<realStarts.length;i++){ if(audioEl.currentTime >= realStarts[i]) idx = i; }
        if(onSegment) onSegment(idx);
      };
      audioEl.addEventListener("timeupdate", timeupdateHandler);
    });
    if(onProgress) onProgress({ part: 1, total: 1, phase: fromCache ? "cached" : "playing" });
    audioEl.onended = () => { URL.revokeObjectURL(url); if(onEnd) onEnd(); };
    audioEl.onerror = () => { URL.revokeObjectURL(url); if(onEnd) onEnd(); };
    audioEl.play().catch(()=>{ if(onEnd) onEnd(); });
  }

  (async () => {
    if(!forceRegenerate){
      const cached = await getCachedStoryAudio(cacheKey);
      if(cached && !stopped){ playWholeBlob(cached, true); return; }
    }
    // No cached full-story audio yet (or a fresh version was requested) —
    // generate every part now, playing progressively. Each part's raw
    // audio is saved to IndexedDB the moment it downloads (under its own
    // sub-key), independent of the other parts, so partial progress is
    // never lost. A part that fails gets one immediate retry; if that
    // also fails, playback skips ahead (never blocks the story) but the
    // part is queued and retried again in the background after the
    // story finishes, filling the gap and re-saving as it goes, until
    // every part is present and the full stitched file can be cached.
    const parts = chunkStoryForGemini(segments);
    const voiceMap = assignGeminiVoices(segments, genders);
    const collected = new Array(parts.length).fill(null);
    let failedParts = [];
    let globalIdx = 0;

    async function fetchPartWithRetry(part){
      // Up to 3 attempts total (1 initial + 2 retries) with growing
      // pauses in between. This matters most for part 0: the very
      // first Gemini call in a session is the most likely to hit a
      // transient cold-start error (timeout / 503 / momentary hiccup)
      // before the API "warms up" — later parts rarely see this, since
      // by then a call has already succeeded once. A single quick
      // retry wasn't enough to reliably survive that window, so part 1
      // kept getting marked failed and skipped while parts 2+ played
      // fine. More attempts with longer backoff fixes that without
      // slowing down the common case (first try usually just works).
      const delays = [800, 3000];
      let lastErr;
      for(let attempt = 0; attempt <= delays.length; attempt++){
        try{
          return await callGeminiTTS(apiKey, part, voiceMap);
        }catch(e){
          lastErr = e;
          if(stopped) throw e;
          if(attempt === delays.length) break; // out of retries
          // Rate limits (429) need a much longer pause than a plain
          // network hiccup/cold-start, or the retry just gets rate
          // limited again.
          await new Promise(r => setTimeout(r, e.status === 429 ? 6000 : delays[attempt]));
        }
      }
      throw lastErr;
    }

    async function finalizeAndCacheFullStory(){
      if(onProgress) onProgress({ part: parts.length, total: parts.length, phase: "saving" });
      try{
        const fullBlob = base64PcmChunksToWavBlob(collected);
        await setCachedStoryAudio(cacheKey, fullBlob);
        // Full story is saved now — the per-part entries are redundant.
        for(let i=0;i<parts.length;i++){
          deleteCachedStoryAudio(storyPartCacheKey(cacheKey, i)).catch(()=>{});
        }
      }catch(e){ console.warn("Could not save story audio to device storage:", e); }
    }

    async function retryFailedPartsInBackground(){
      // Keeps making passes over whatever's still failing — spaced
      // further apart each round — instead of trying once and giving
      // up. This is what lets a part recover later once a rate limit
      // window clears, rather than staying skipped forever.
      const maxRounds = 8;
      const roundDelays = [5000, 10000, 20000, 30000, 40000, 50000, 60000, 85000]; // sums to ~5 min
      for(let round = 0; round < maxRounds && failedParts.length; round++){
        for(const idx of failedParts.slice()){
          if(stopped) return;
          await new Promise(r => setTimeout(r, roundDelays[round]));
          try{
            const part = parts[idx];
            const b64 = await callGeminiTTS(apiKey, part, voiceMap);
            collected[idx] = b64;
            try{ await setCachedStoryAudio(storyPartCacheKey(cacheKey, idx), b64); }catch(e){}
            failedParts = failedParts.filter(i => i !== idx);
            if(onPartRecovered) onPartRecovered(idx);
          }catch(e){
            console.warn(`Background retry (round ${round+1}/${maxRounds}) still failing for part`, idx, e.message);
          }
        }
      }
      if(stopped) return;
      if(failedParts.length === 0 && collected.every(c => c)){
        await finalizeAndCacheFullStory();
        if(onDownloadComplete) onDownloadComplete({ success: true });
      }else if(onDownloadComplete){
        // Ran out of rounds and some part(s) never came through — tell
        // the UI so it can stop saying "retrying" and show something
        // the person can act on (e.g. try again later, or replay to
        // re-trigger background retry from scratch).
        onDownloadComplete({ success: false, missingParts: failedParts.length });
      }
    }

    async function playPart(partIdx){
      if(stopped) return;
      if(partIdx >= parts.length){
        if(failedParts.length === 0 && collected.every(c => c)){
          await finalizeAndCacheFullStory();
        }else if(failedParts.length){
          retryFailedPartsInBackground(); // runs after onEnd, doesn't block playback
        }
        if(onEnd) onEnd();
        return;
      }
      const part = parts[partIdx];
      if(onSegment) onSegment(globalIdx);
      if(onProgress) onProgress({ part: partIdx+1, total: parts.length, phase: "loading" });
      function advance(){ globalIdx += part.lines.length; playPart(partIdx+1); }
      try{
        // Reuse a part saved by an earlier attempt (this session or a
        // prior background retry) instead of re-downloading it.
        let b64 = await getCachedStoryAudio(storyPartCacheKey(cacheKey, partIdx));
        if(!b64){
          b64 = await fetchPartWithRetry(part);
          if(stopped) return;
          try{ await setCachedStoryAudio(storyPartCacheKey(cacheKey, partIdx), b64); }catch(e){}
        }
        collected[partIdx] = b64;
        const blob = pcm16ToWavBlob(b64);
        const url = URL.createObjectURL(blob);
        audioEl = new Audio(url);
        if(onProgress) onProgress({ part: partIdx+1, total: parts.length, phase: "playing" });
        audioEl.onended = () => { URL.revokeObjectURL(url); advance(); };
        audioEl.onerror = () => { URL.revokeObjectURL(url); advance(); };
        audioEl.play().catch(advance);
      }catch(e){
        console.warn("Gemini TTS part failed, skipping:", e.message);
        failedParts.push(partIdx);
        if(onPartError) onPartError(e, partIdx);
        advance();
      }
    }
    playPart(0);
  })();

  return {
    stop(){
      stopped = true;
      if(audioEl){
        if(timeupdateHandler) audioEl.removeEventListener("timeupdate", timeupdateHandler);
        audioEl.pause();
        audioEl = null;
      }
    },
    // Pause/resume are meant for the already-downloaded/cached playback
    // path (playWholeBlob) — pausing there just pauses the one <audio>
    // element already holding the full story. Calling these while a part
    // is still being generated (audioEl not yet created for that part,
    // or between parts) is a harmless no-op rather than an error, but the
    // UI only shows the Pause button when phase === "cached" so this
    // realistically only fires against the cached-audio element.
    pause(){ if(audioEl) audioEl.pause(); },
    resume(){ if(audioEl) audioEl.play().catch(()=>{}); }
  };
}

// Small hook so any StoryCard reflects the current Gemini key without a
// full remount — see saveGeminiApiKey()'s broadcast above.
function useGeminiApiKey(){
  const [key, setKey] = useState(()=>loadGeminiApiKey());
  useEffect(()=>{
    function refresh(){ setKey(loadGeminiApiKey()); }
    window.addEventListener("gemini-key-changed", refresh);
    return ()=> window.removeEventListener("gemini-key-changed", refresh);
  }, []);
  return key;
}

// Converts the {name, lines:[{speaker,text}]} / bare-array JSON format (the
// format handed to ChatGPT/Claude so it can write a story as JSON) into the
// plain "Name: text" convention the story textarea and playStory() use.
function storyLinesToText(lines){
  return lines.map(l=>{
    const text = String((l && l.text) || "").trim();
    const speaker = l && l.speaker ? String(l.speaker).trim() : "";
    return speaker ? (speaker + ": " + text) : text;
  }).filter(Boolean).join("\n\n");
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
// Picks n questions from pool, preferring ones NOT in avoidSet (the previous
// session's questions) so replaying doesn't just re-serve the same set.
// Falls back to repeats only if there aren't enough fresh questions to fill n.
function pickAvoidingRepeats(pool, n, avoidSet){
  const fresh = [];
  const repeats = [];
  pool.forEach(q=>{ (avoidSet.has(q.q) ? repeats : fresh).push(q); });
  const chosen = shuffle(fresh).slice(0, n);
  if(chosen.length < n){
    chosen.push(...shuffle(repeats).slice(0, n - chosen.length));
  }
  return chosen;
}
function allLessons(quarter){
  return quarter.chapters.flatMap(c => c.lessons.map(l => ({...l, chapterTitle:c.title, chapterId:c.id, homeQuarterId:quarter.id})));
}
// Teacher-added topics (per subject+quarter) live in the `customLessons` array
// (persisted separately from the built-in curriculum). Each one can either be
// dropped into a real existing chapter (so it shows up alongside that chapter's
// built-in lessons) or, if no chapter was chosen, folded into a virtual
// "✨ My Topics" chapter — either way, Learn/Quiz/Question Bank all key off
// the same lesson.id like any other lesson.
function customLessonsForQuarter(subject, quarter, customLessons){
  return (customLessons || [])
    .filter(c => c.subjectId === subject.id && c.quarterId === quarter.id)
    .map(c => {
      const targetChapter = c.chapterId ? quarter.chapters.find(ch=>ch.id === c.chapterId) : null;
      return {
        id: c.id,
        title: c.title,
        sub: c.sub || "",
        learn: [],
        chapterTitle: targetChapter ? targetChapter.title : "✨ My Topics",
        chapterId: targetChapter ? targetChapter.id : "custom",
        homeQuarterId: quarter.id,
        isCustom: true
      };
    });
}
function allSubjectLessons(subject, customLessons){
  const built = subject.quarters.flatMap(q => allLessons(q));
  const custom = subject.quarters.flatMap(q => customLessonsForQuarter(subject, q, customLessons));
  return built.concat(custom);
}
function lessonQuarterId(lesson, moves){
  const mv = moves[lesson.id];
  return (mv && mv.quarterId) ? mv.quarterId : lesson.homeQuarterId;
}
function quarterLessons(subject, quarter, moves, customLessons){
  return allSubjectLessons(subject, customLessons).filter(l => lessonQuarterId(l, moves) === quarter.id);
}
function quarterLessonCount(subject, quarter, moves, customLessons){
  return quarterLessons(subject, quarter, moves, customLessons).length;
}
function quarterLearnedCount(subject, quarter, moves, progress, customLessons){
  return quarterLessons(subject, quarter, moves, customLessons).filter(l => progress.lessons[l.id] && progress.lessons[l.id].learned).length;
}
function isQuarterComplete(subject, quarter, moves, progress, customLessons){
  const lessons = quarterLessons(subject, quarter, moves, customLessons);
  const allPassed = lessons.length>0 && lessons.every(l => {
    const rec = progress.lessons[l.id];
    return rec && rec.best && (rec.best.correct/rec.best.total) >= 0.7;
  });
  const lq = progress.longQuiz[quarter.id];
  const lqPassed = lq && lq.best && (lq.best.correct/lq.best.total) >= 0.7;
  return allPassed && lqPassed;
}

/* =========================================================
   SOUND ENGINE — tiny synthesized sound effects (Web Audio API).
   No external audio files needed, works offline, respects a mute setting.
   ========================================================= */
let _audioCtx = null;
let _soundOn = true;
function setSoundEnabled(v){ _soundOn = v; }
function getAudioCtx(){
  if(!_audioCtx){
    try{ _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(_audioCtx.state === "suspended"){ _audioCtx.resume().catch(()=>{}); }
  return _audioCtx;
}
function _tone(ctx, {freq, start, dur, type="sine", peak=0.15, attack=0.01}){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start+attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, start+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(start);
  osc.stop(start+dur+0.03);
}
const Sound = {
  tap(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    _tone(ctx, {freq:540, start:ctx.currentTime, dur:0.07, type:"sine", peak:0.08});
  },
  nav(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    const t = ctx.currentTime;
    _tone(ctx, {freq:420, start:t, dur:0.08, type:"triangle", peak:0.09});
    _tone(ctx, {freq:640, start:t+0.045, dur:0.1, type:"triangle", peak:0.08});
  },
  back(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    const t = ctx.currentTime;
    _tone(ctx, {freq:520, start:t, dur:0.08, type:"triangle", peak:0.08});
    _tone(ctx, {freq:360, start:t+0.05, dur:0.1, type:"triangle", peak:0.08});
  },
  select(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    _tone(ctx, {freq:700, start:ctx.currentTime, dur:0.06, type:"sine", peak:0.07});
  },
  correct(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    const t = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((f,i)=> _tone(ctx, {freq:f, start:t+i*0.085, dur:0.22, type:"sine", peak:0.15}));
  },
  incorrect(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    const t = ctx.currentTime;
    _tone(ctx, {freq:233, start:t, dur:0.16, type:"sine", peak:0.13});
    _tone(ctx, {freq:196, start:t+0.1, dur:0.24, type:"sine", peak:0.11});
  },
  pass(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    const t = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=> _tone(ctx, {freq:f, start:t+i*0.1, dur:0.32, type:"triangle", peak:0.15}));
  },
  perfect(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    const t = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f,i)=> _tone(ctx, {freq:f, start:t+i*0.09, dur:0.3, type:"triangle", peak:0.16}));
    [1046.5, 1318.51, 1567.98].forEach((f,i)=> _tone(ctx, {freq:f, start:t+0.55, dur:0.55, type:"sine", peak:0.11}));
  },
  tryAgain(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    const t = ctx.currentTime;
    [392, 349.23].forEach((f,i)=> _tone(ctx, {freq:f, start:t+i*0.12, dur:0.26, type:"sine", peak:0.11}));
  },
  save(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    const t = ctx.currentTime;
    _tone(ctx, {freq:660, start:t, dur:0.12, type:"sine", peak:0.12});
    _tone(ctx, {freq:880, start:t+0.08, dur:0.2, type:"sine", peak:0.12});
  },
  unlock(){
    if(!_soundOn) return; const ctx = getAudioCtx(); if(!ctx) return;
    const t = ctx.currentTime;
    [392, 523.25, 659.25, 987.77].forEach((f,i)=> _tone(ctx, {freq:f, start:t+i*0.075, dur:0.28, type:"triangle", peak:0.14}));
  }
};

/* =========================================================
   QUIZ RUNNER (shared by lesson quiz + long quiz)
   ========================================================= */
function matchesFillAnswer(typed, acceptable){
  const norm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
  const t = norm(typed);
  if(!t) return false;
  return acceptable.some(a => norm(a) === t);
}

// ---- Helpers for the new interactive question types ----
function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  return shuffle(arr);
}
function arraysEqual(a,b){
  if(a.length !== b.length) return false;
  for(let i=0;i<a.length;i++){ if(a[i] !== b[i]) return false; }
  return true;
}

// A friendly, distinct color for each connector line in a matching question (cycled by left index).
const MATCH_LINE_COLORS = ["var(--match1)","var(--match2)","var(--match3)","var(--match4)","var(--match5)","var(--match6)","var(--match7)","var(--match8)"];
function matchLineColor(li){ return MATCH_LINE_COLORS[li % MATCH_LINE_COLORS.length]; }

function QuizRunner({questions, accent, onFinish, tagLabel, onStop, showStopInline=true}){
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [fillText, setFillText] = useState("");
  const [fillChecked, setFillChecked] = useState(false);
  const [answers, setAnswers] = useState([]);
  // The furthest question index reached "for real" (as opposed to via the Back button).
  // Answers are committed to the `answers` array the instant a question is checked, so we can't
  // use answers.length anymore to tell "currently being answered" apart from "already reviewed" —
  // this does that job instead.
  const [furthestIdx, setFurthestIdx] = useState(0);

  // Matching (left = fixed descriptions, right = draggable answers reordered to align by row)
  const [matchRightOrder, setMatchRightOrder] = useState([]);
  const [matchChecked, setMatchChecked] = useState(false);
  const [matchDragPos, setMatchDragPos] = useState(null); // position currently being dragged (for styling)
  const matchDragPosRef = useRef(null); // position currently being dragged (for logic, avoids stale closures)
  const [zoomedImage, setZoomedImage] = useState(null); // url currently shown full-size (Label the Parts / Image Matching)

  // Drag & drop (sort into categories)
  const [ddAssign, setDdAssign] = useState({}); // itemIdx -> category name
  const [ddActiveItem, setDdActiveItem] = useState(null);
  const [ddChecked, setDdChecked] = useState(false);
  const [dragOverCat, setDragOverCat] = useState(null);
  const [dragOverBank, setDragOverBank] = useState(false);
  const [ddDragging, setDdDragging] = useState(null); // {ii, x, y, label} while a chip is being pointer-dragged
  const ddDragRef = useRef(null); // {ii, startX, startY, moved} for the in-progress pointer drag

  // Ordering / sequencing
  const [orderList, setOrderList] = useState([]); // array of original indices, in current display order
  const [orderChecked, setOrderChecked] = useState(false);
  const [orderDragPos, setOrderDragPos] = useState(null); // position currently being dragged (for styling)
  const orderDragPosRef = useRef(null); // position currently being dragged (for logic, avoids stale closures)

  // Label the Parts (tap a word, then tap the pin it names)
  const [labelWordOrder, setLabelWordOrder] = useState([]); // shuffled indices into q.points
  const [labelAssign, setLabelAssign] = useState({}); // pointIdx -> position in labelWordOrder
  const [labelActiveWord, setLabelActiveWord] = useState(null); // position in labelWordOrder currently selected
  const [labelChecked, setLabelChecked] = useState(false);

  // Number Pattern (type the missing numbers)
  const [patternValues, setPatternValues] = useState({}); // itemIdx -> typed string
  const [patternChecked, setPatternChecked] = useState(false);

  const q = questions[idx];
  // Only a genuinely-reviewed past question (idx < furthestIdx) renders as read-only.
  // The current, still-in-progress question keeps its live interactive/feedback view even
  // though its answer has already been committed into `answers` behind the scenes.
  const record = idx < furthestIdx ? answers[idx] : undefined;
  const isLast = idx === questions.length - 1;
  const qType = q.type || "mcq";
  const isFill = qType === "fill";
  const isMatch = qType === "match" || qType === "matchimg";
  const isDragDrop = qType === "dragdrop";
  const isOrder = qType === "order";
  const isLabel = qType === "label";
  const isPattern = qType === "pattern";
  const isEmoji = qType === "emoji";
  const acceptable = isFill ? String(q.answer||"").split("|").map(a=>a.trim()).filter(Boolean) : [];
  const fillIsCorrect = isFill && matchesFillAnswer(fillText, acceptable);

  // Reset per-question mcq/fill state whenever we land on a question that hasn't been answered yet
  // (i.e. we're not reviewing it via the Back button). Keeps forward/back navigation in sync.
  useEffect(()=>{
    if(answers[idx] !== undefined) return; // already-answered question — never rebuild/clear its state once committed
    setSelected(null);
    setFillText("");
    setFillChecked(false);
  }, [idx]);

  // Reset/initialize per-question state whenever the question changes
  useEffect(()=>{
    if(answers[idx] !== undefined) return; // already-answered question — never rebuild/clear its state once committed
    if(isMatch){
      setMatchRightOrder(shuffledIndices((q.pairs||[]).length));
      setMatchChecked(false);
      setMatchDragPos(null);
      matchDragPosRef.current = null;
    } else if(isDragDrop){
      setDdAssign({});
      setDdActiveItem(null);
      setDdChecked(false);
      setDragOverCat(null);
    } else if(isOrder){
      setOrderList(shuffledIndices((q.items||[]).length));
      setOrderChecked(false);
    } else if(isLabel){
      setLabelWordOrder(shuffledIndices((q.points||[]).length));
      setLabelAssign({});
      setLabelActiveWord(null);
      setLabelChecked(false);
    } else if(isPattern){
      setPatternValues({});
      setPatternChecked(false);
    }
  }, [idx]);

  const matchIsCorrect = isMatch && matchChecked && (q.pairs||[]).every((_,pos)=> matchRightOrder[pos] === pos);

  const ddAllAssigned = isDragDrop && (q.items||[]).length>0 && Object.keys(ddAssign).length === (q.items||[]).length;
  const ddIsCorrect = isDragDrop && ddChecked && (q.items||[]).every((it,ii)=> ddAssign[ii] === it.category);

  const orderIsCorrect = isOrder && orderChecked && arraysEqual(orderList, (q.items||[]).map((_,i)=>i));

  const labelAllAssigned = isLabel && (q.points||[]).length>0 && Object.keys(labelAssign).length === (q.points||[]).length;
  const labelIsCorrect = isLabel && labelChecked && (q.points||[]).every((p,pi)=> labelWordOrder[labelAssign[pi]] === pi);

  const patternBlankIdxs = isPattern ? (q.items||[]).map((it,ii)=> it.kind==="blank" ? ii : null).filter(x=>x!==null) : [];
  const patternAllFilled = isPattern && patternBlankIdxs.length>0 && patternBlankIdxs.every(ii => String(patternValues[ii]||"").trim() !== "");
  const patternIsCorrect = isPattern && patternChecked && patternBlankIdxs.every(ii => matchesFillAnswer(patternValues[ii], String((q.items[ii]||{}).answer||"").split("|").map(a=>a.trim())));

  const answered = isFill ? fillChecked
    : isMatch ? matchChecked
    : isDragDrop ? ddChecked
    : isOrder ? orderChecked
    : isLabel ? labelChecked
    : isPattern ? patternChecked
    : selected !== null;

  function commitAnswer(record){
    setAnswers(prev=>{
      const next = prev.slice();
      next[idx] = record;
      return next;
    });
  }
  function handleSelect(optIdx){
    if(selected !== null) return;
    setSelected(optIdx);
    if(optIdx === q.correct) Sound.correct(); else Sound.incorrect();
    commitAnswer({type:qType, question:q.q, options:q.options, correct:q.correct, chosen:optIdx, isCorrect: optIdx===q.correct, tag:q.tag || null});
  }
  function handleFillCheck(){
    if(fillChecked || !fillText.trim()) return;
    setFillChecked(true);
    const correct = matchesFillAnswer(fillText, acceptable);
    if(correct) Sound.correct(); else Sound.incorrect();
    commitAnswer({type:"fill", question:q.q, answer:q.answer, chosen:fillText.trim(), isCorrect:correct, tag:q.tag || null});
  }

  // ---- Matching handlers (drag the right-column answer up/down to align with its
  // description on the left — same reorder-drag mechanic as Ordering) ----
  function handleMatchPointerDown(e, pos){
    if(matchChecked) return;
    e.preventDefault();
    matchDragPosRef.current = pos;
    setMatchDragPos(pos);
    document.addEventListener('pointermove', handleMatchPointerMove, {passive:false});
    document.addEventListener('pointerup', handleMatchPointerUp, {passive:false});
    document.addEventListener('pointercancel', handleMatchPointerUp, {passive:false});
  }
  function handleMatchPointerMove(e){
    if(matchDragPosRef.current === null) return;
    e.preventDefault();
    const x = e.clientX, y = e.clientY;
    const el = document.elementFromPoint(x, y);
    const itemEl = el && el.closest && el.closest('.match-right-item');
    if(!itemEl || !itemEl.dataset || itemEl.dataset.pos === undefined) return;
    const overPos = Number(itemEl.dataset.pos);
    const curPos = matchDragPosRef.current;
    if(Number.isNaN(overPos) || overPos === curPos) return;
    setMatchRightOrder(prev=>{
      const next = prev.slice();
      const [moved] = next.splice(curPos, 1);
      next.splice(overPos, 0, moved);
      return next;
    });
    matchDragPosRef.current = overPos;
    setMatchDragPos(overPos);
  }
  function handleMatchPointerUp(){
    matchDragPosRef.current = null;
    setMatchDragPos(null);
    document.removeEventListener('pointermove', handleMatchPointerMove);
    document.removeEventListener('pointerup', handleMatchPointerUp);
    document.removeEventListener('pointercancel', handleMatchPointerUp);
  }
  function handleMatchCheck(){
    if(matchChecked) return;
    setMatchChecked(true);
    const allCorrect = (q.pairs||[]).every((_,pos)=> matchRightOrder[pos] === pos);
    if(allCorrect) Sound.correct(); else Sound.incorrect();
    const chosenPairs = (q.pairs||[]).map((p,pos)=>({left:p.left, right: q.pairs[matchRightOrder[pos]].right}));
    commitAnswer({type:qType, question:q.q, pairs:q.pairs, chosen:chosenPairs, isCorrect:allCorrect, tag:q.tag || null});
  }

  // ---- Drag & drop handlers ----
  function assignItem(ii, cat){
    if(ddChecked) return;
    setDdAssign(prev=>({...prev, [ii]:cat}));
    setDdActiveItem(null);
  }
  function unassignItem(ii){
    if(ddChecked) return;
    setDdAssign(prev=>{
      const next = {...prev};
      delete next[ii];
      return next;
    });
    setDdActiveItem(null);
  }
  function handleDdItemClick(ii){
    if(ddChecked) return;
    setDdActiveItem(prev => prev===ii ? null : ii);
  }
  function handleDdCategoryClick(cat){
    if(ddChecked || ddActiveItem===null) return;
    assignItem(ddActiveItem, cat);
  }
  // Pointer-based dragging: works the same for touch, mouse, and stylus, and lets
  // a placed answer be dragged straight to a different category or back to the word bank.
  // A tap with no real movement still falls back to the tap-to-select flow above.
  function handleDdPointerDown(e, ii){
    if(ddChecked) return;
    ddDragRef.current = {ii, startX:e.clientX, startY:e.clientY, moved:false};
    document.addEventListener('pointermove', handleDdPointerMove, {passive:false});
    document.addEventListener('pointerup', handleDdPointerUp, {passive:false});
    document.addEventListener('pointercancel', handleDdPointerCancel, {passive:false});
  }
  function handleDdPointerMove(e){
    const drag = ddDragRef.current;
    if(!drag) return;
    if(!drag.moved){
      const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      if(Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      setDdActiveItem(null);
    }
    e.preventDefault();
    setDdDragging({ii:drag.ii, x:e.clientX, y:e.clientY, label:(q.items[drag.ii]||{}).label || ""});
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const catEl = el && el.closest && el.closest('.dd-category');
    const bankEl = el && el.closest && el.closest('.dd-items');
    setDragOverCat(catEl ? catEl.dataset.cat : null);
    setDragOverBank(!!bankEl && !catEl);
  }
  function finishDdDrag(e, cancelled){
    const drag = ddDragRef.current;
    document.removeEventListener('pointermove', handleDdPointerMove);
    document.removeEventListener('pointerup', handleDdPointerUp);
    document.removeEventListener('pointercancel', handleDdPointerCancel);
    ddDragRef.current = null;
    setDdDragging(null);
    setDragOverCat(null);
    setDragOverBank(false);
    if(!drag || ddChecked) return;
    if(!drag.moved){
      handleDdItemClick(drag.ii); // plain tap — toggle tap-to-select instead
      return;
    }
    if(cancelled) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const catEl = el && el.closest && el.closest('.dd-category');
    const bankEl = el && el.closest && el.closest('.dd-items');
    if(catEl && catEl.dataset.cat) assignItem(drag.ii, catEl.dataset.cat);
    else if(bankEl) unassignItem(drag.ii);
  }
  function handleDdPointerUp(e){ finishDdDrag(e, false); }
  function handleDdPointerCancel(e){ finishDdDrag(e, true); }
  function handleDdCheck(){
    if(ddChecked || !ddAllAssigned) return;
    setDdChecked(true);
    const allCorrect = (q.items||[]).every((it,ii)=> ddAssign[ii] === it.category);
    if(allCorrect) Sound.correct(); else Sound.incorrect();
    commitAnswer({type:"dragdrop", question:q.q, items:q.items, categories:q.categories, chosen:{...ddAssign}, isCorrect:allCorrect, tag:q.tag || null});
  }

  // ---- Ordering handlers (drag & drop, mouse + touch via Pointer Events) ----
  function handleOrderPointerDown(e, pos){
    if(orderChecked) return;
    e.preventDefault();
    orderDragPosRef.current = pos;
    setOrderDragPos(pos);
    document.addEventListener('pointermove', handleOrderPointerMove, {passive:false});
    document.addEventListener('pointerup', handleOrderPointerUp, {passive:false});
    document.addEventListener('pointercancel', handleOrderPointerUp, {passive:false});
  }
  function handleOrderPointerMove(e){
    if(orderDragPosRef.current === null) return;
    e.preventDefault();
    const x = e.clientX, y = e.clientY;
    const el = document.elementFromPoint(x, y);
    const itemEl = el && el.closest && el.closest('.order-item');
    if(!itemEl || !itemEl.dataset || itemEl.dataset.pos === undefined) return;
    const overPos = Number(itemEl.dataset.pos);
    const curPos = orderDragPosRef.current;
    if(Number.isNaN(overPos) || overPos === curPos) return;
    setOrderList(prev=>{
      const next = prev.slice();
      const [moved] = next.splice(curPos, 1);
      next.splice(overPos, 0, moved);
      return next;
    });
    orderDragPosRef.current = overPos;
    setOrderDragPos(overPos);
  }
  function handleOrderPointerUp(){
    orderDragPosRef.current = null;
    setOrderDragPos(null);
    document.removeEventListener('pointermove', handleOrderPointerMove);
    document.removeEventListener('pointerup', handleOrderPointerUp);
    document.removeEventListener('pointercancel', handleOrderPointerUp);
  }
  function handleOrderCheck(){
    if(orderChecked) return;
    setOrderChecked(true);
    const correctOrder = (q.items||[]).map((_,i)=>i);
    const allCorrect = arraysEqual(orderList, correctOrder);
    if(allCorrect) Sound.correct(); else Sound.incorrect();
    commitAnswer({type:"order", question:q.q, items:q.items, chosen:orderList.map(i=>q.items[i]), isCorrect:allCorrect, tag:q.tag || null});
  }

  // ---- Label the Parts handlers (tap a word, then tap the pin it names) ----
  function handleLabelWordClick(wordPos){
    if(labelChecked) return;
    setLabelActiveWord(prev => prev===wordPos ? null : wordPos);
  }
  function handleLabelPinClick(pi){
    if(labelChecked) return;
    if(labelActiveWord === null){
      if(labelAssign[pi] !== undefined){
        setLabelAssign(prev=>{ const next = {...prev}; delete next[pi]; return next; });
      }
      return;
    }
    setLabelAssign(prev=>{
      const next = {...prev};
      Object.keys(next).forEach(k=>{ if(next[k]===labelActiveWord) delete next[k]; });
      next[pi] = labelActiveWord;
      return next;
    });
    setLabelActiveWord(null);
  }
  function handleLabelCheck(){
    if(labelChecked || !labelAllAssigned) return;
    setLabelChecked(true);
    const allCorrect = (q.points||[]).every((p,pi)=> labelWordOrder[labelAssign[pi]] === pi);
    if(allCorrect) Sound.correct(); else Sound.incorrect();
    const chosen = (q.points||[]).map((p,pi)=> labelAssign[pi]!==undefined ? q.points[labelWordOrder[labelAssign[pi]]].label : null);
    commitAnswer({type:"label", question:q.q, image:q.image, points:q.points, chosen, isCorrect:allCorrect, tag:q.tag || null});
  }

  // ---- Number Pattern handlers ----
  function handlePatternChange(ii, value){
    if(patternChecked) return;
    setPatternValues(prev=>({...prev, [ii]: value}));
  }
  function handlePatternCheck(){
    if(patternChecked || !patternAllFilled) return;
    setPatternChecked(true);
    const allCorrect = patternBlankIdxs.every(ii => matchesFillAnswer(patternValues[ii], String((q.items[ii]||{}).answer||"").split("|").map(a=>a.trim())));
    if(allCorrect) Sound.correct(); else Sound.incorrect();
    commitAnswer({type:"pattern", question:q.q, items:q.items, chosen:{...patternValues}, isCorrect:allCorrect, tag:q.tag || null});
  }

  // The current question's answer is already written into the `answers` array (see commitAnswer,
  // called the moment the question was checked/selected) — so Next just needs to advance, or
  // finish the quiz using the answers we already have. Nothing here can be re-triggered to
  // change an answer that's already been locked in.
  function handleNext(){
    Sound.tap();
    if(isLast){
      // Fallback safety net: build the record here too, in case commitAnswer's state update
      // hasn't flushed yet for some reason, so a finished quiz never loses its last answer.
      const already = answers[idx];
      const record = already || (
        isFill ? {type:"fill", question:q.q, answer:q.answer, chosen:fillText.trim(), isCorrect:fillIsCorrect, tag:q.tag || null}
        : isMatch ? {type:qType, question:q.q, pairs:q.pairs, chosen:(q.pairs||[]).map((p,pos)=>({left:p.left, right: q.pairs[matchRightOrder[pos]].right})), isCorrect:matchIsCorrect, tag:q.tag || null}
        : isDragDrop ? {type:"dragdrop", question:q.q, items:q.items, categories:q.categories, chosen:{...ddAssign}, isCorrect:ddIsCorrect, tag:q.tag || null}
        : isOrder ? {type:"order", question:q.q, items:q.items, chosen:orderList.map(i=>q.items[i]), isCorrect:orderIsCorrect, tag:q.tag || null}
        : isLabel ? {type:"label", question:q.q, image:q.image, points:q.points, chosen:(q.points||[]).map((p,pi)=> labelAssign[pi]!==undefined ? q.points[labelWordOrder[labelAssign[pi]]].label : null), isCorrect:labelIsCorrect, tag:q.tag || null}
        : isPattern ? {type:"pattern", question:q.q, items:q.items, chosen:{...patternValues}, isCorrect:patternIsCorrect, tag:q.tag || null}
        : {type:qType, question:q.q, options:q.options, correct:q.correct, chosen:selected, isCorrect: selected===q.correct, tag:q.tag || null}
      );
      const finalAnswers = answers.slice();
      finalAnswers[idx] = record;
      onFinish(finalAnswers);
    } else {
      setFurthestIdx(f=>Math.max(f, idx+1));
      setIdx(idx+1);
    }
  }
  // Step back to the previous question to review your answer and the correct one.
  // Doesn't touch the answers array — stepping forward again just re-displays what was already
  // recorded, and can never undo or overwrite an answer that's already been locked in.
  function handleBack(){
    if(idx===0) return;
    Sound.back();
    setIdx(idx-1);
  }

  return (
    <div style={{width:"110%", marginLeft:"-5%"}}>
      <div className="quiz-progress">
        <span>QUESTION {idx+1} / {questions.length}</span>
        <div className="quiz-dots">
          {questions.map((_,i) => (
            <div key={i} className={"quiz-dot" + (i<=idx ? " filled":"")}></div>
          ))}
        </div>
        <div style={{display:"flex", alignItems:"center", gap:8, marginLeft:10}}>
          {idx>0 && (
            <button className="btn btn-ghost btn-sm" title="Back to previous question" onClick={handleBack}>← Back</button>
          )}
          {showStopInline && onStop && (
            <button
              className="btn btn-ghost btn-sm"
              title="Stop this quiz"
              onClick={()=>{
                if(window.confirm("Stop this quiz? Your progress on this attempt won't be saved.")){
                  Sound.back();
                  onStop();
                }
              }}
            >✕ Stop Quiz</button>
          )}
          {record ? (
            <button className="btn btn-primary btn-sm" style={{background:accent}} onClick={()=>{ Sound.tap(); setIdx(idx+1); }}>
              Next →
            </button>
          ) : answered && (
            <button className="btn btn-primary btn-sm" style={{background:accent}} onClick={handleNext}>
              {isLast ? "See Results →" : "Next →"}
            </button>
          )}
        </div>
      </div>
      <div className="quiz-card" key={idx}>
        {q.tag && <div className="quiz-tag">{q.tag}</div>}
        <div className="quiz-q">{q.q}</div>

        {record ? (
          <AnswerReviewBody a={record} />
        ) : (
        <React.Fragment>
        {!isFill && !isMatch && !isDragDrop && !isOrder && !isLabel && !isPattern && !isEmoji && q.options.map((opt, i) => {
          let cls = "quiz-opt";
          if(selected !== null){
            if(i === q.correct) cls += " correct";
            else if(i === selected) cls += " incorrect";
            else cls += " dimmed";
          }
          return (
            <button key={i} className={cls} disabled={selected!==null} onClick={()=>handleSelect(i)}>
              {opt}
            </button>
          );
        })}

        {isEmoji && (
          <div className="emoji-opt-row">
            {[0,1].map(i=>{
              let cls = "emoji-opt";
              if(selected !== null){
                if(i === q.correct) cls += " correct";
                else if(i === selected) cls += " incorrect";
                else cls += " dimmed";
              }
              return (
                <button key={i} className={cls} disabled={selected!==null} onClick={()=>handleSelect(i)}>
                  <span className="emoji-opt-face">{i===0 ? "😊" : "😢"}</span>
                  <span className="emoji-opt-label">{i===0 ? "Happy" : "Sad"}</span>
                </button>
              );
            })}
          </div>
        )}

        {isFill && (
          <React.Fragment>
            <input
              className={"quiz-fill-input" + (fillChecked ? (fillIsCorrect ? " correct" : " incorrect") : "")}
              type="text"
              value={fillText}
              disabled={fillChecked}
              placeholder="Type your answer..."
              onChange={e=>setFillText(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") handleFillCheck(); }}
            />
            {!fillChecked && (
              <div className="quiz-footer" style={{justifyContent:"flex-start", marginTop:-6, marginBottom:10}}>
                <button className="btn btn-ghost btn-sm" onClick={handleFillCheck} disabled={!fillText.trim()}>✓ Check Answer</button>
              </div>
            )}
          </React.Fragment>
        )}

        {isMatch && (
          <React.Fragment>
            <p className="fill-hint">Drag the whole answer card on the right up or down to line it up with the description it matches on the left.</p>
            <div className="match-dragwrap">
              {(q.pairs||[]).map((p,pos)=>{
                const origIdx = matchRightOrder[pos];
                const isRightSpot = matchChecked && origIdx === pos;
                let cls = "match-right-item";
                if(matchChecked) cls += isRightSpot ? " correct" : " incorrect";
                if(matchDragPos === pos) cls += " dragging";
                return (
                  <div key={pos} className="match-row-pair">
                    <div className="match-left-item">
                      {qType==="matchimg"
                        ? <img src={p.left} alt="" className="match-left-img" onClick={()=>setZoomedImage(p.left)} />
                        : <span>{p.left}</span>}
                    </div>
                    <div
                      className={cls}
                      data-pos={pos}
                      onPointerDown={!matchChecked ? (e=>handleMatchPointerDown(e, pos)) : undefined}
                    >
                      <span className="match-right-label">{origIdx!==undefined ? q.pairs[origIdx].right : ""}</span>
                      {!matchChecked && <span className="match-right-handle" aria-hidden="true">⠿</span>}
                    </div>
                  </div>
                );
              })}
            </div>
            {!matchChecked && (
              <div className="quiz-footer" style={{justifyContent:"flex-start", marginTop:6, marginBottom:10}}>
                <button className="btn btn-ghost btn-sm" onClick={handleMatchCheck}>✓ Check Matches</button>
              </div>
            )}
          </React.Fragment>
        )}
        {zoomedImage && ReactDOM.createPortal(
          <div
            onClick={()=>setZoomedImage(null)}
            style={{
              position:"fixed", inset:0, zIndex:9999, background:"rgba(20,18,30,0.85)",
              display:"flex", alignItems:"center", justifyContent:"center", padding:24, cursor:"zoom-out"
            }}
          >
            <img src={zoomedImage} alt="" style={{maxWidth:"92vw", maxHeight:"88vh", borderRadius:12, boxShadow:"0 8px 40px rgba(0,0,0,0.5)"}} />
            <button
              onClick={()=>setZoomedImage(null)}
              style={{
                position:"fixed", top:18, right:18, width:40, height:40, borderRadius:"50%",
                background:"rgba(255,255,255,0.95)", border:"none", fontSize:18, fontWeight:800, cursor:"pointer"
              }}
            >✕</button>
          </div>,
          document.body
        )}

        {isDragDrop && (
          <React.Fragment>
            <p className="fill-hint">Drag each item into its category — or back to the word bank to change your mind. (Or tap an item, then tap where it goes.)</p>
            <div
              className={"dd-items" + (dragOverBank ? " drag-over" : "")}
              onClick={()=>{ if(ddActiveItem!==null && ddAssign[ddActiveItem]!==undefined) unassignItem(ddActiveItem); }}
            >
              {(q.items||[]).map((it,ii)=>{
                if(ddAssign[ii] !== undefined) return null;
                return (
                  <div
                    key={ii}
                    className={"dd-chip" + (ddActiveItem===ii ? " active" : "") + (ddDragging && ddDragging.ii===ii ? " dragging" : "")}
                    onPointerDown={e=>handleDdPointerDown(e, ii)}
                    onClick={e=>e.stopPropagation()}
                  >{it.label}</div>
                );
              })}
              {(q.items||[]).every((it,ii)=>ddAssign[ii]!==undefined) && !ddChecked && (
                <div className="fill-hint" style={{margin:0}}>All items placed — drag a chip here to return it to the word bank, or check your answers below.</div>
              )}
            </div>
            <div className="dd-categories">
              {(q.categories||[]).map((cat,ci)=>{
                const itemsHere = (q.items||[]).map((it,ii)=>({it,ii})).filter(x=>ddAssign[x.ii]===cat);
                return (
                  <div
                    key={cat}
                    className={"dd-category dd-cat-" + (ci % 8) + (dragOverCat===cat ? " drag-over" : "")}
                    data-cat={cat}
                    onClick={()=>handleDdCategoryClick(cat)}
                  >
                    <div className="dd-category-title">{cat}</div>
                    {itemsHere.map(x=>{
                      const isRightAnswer = ddChecked && x.it.category===cat;
                      let cls = "dd-chip dd-chip-placed" + (ddActiveItem===x.ii ? " active" : "") + (ddDragging && ddDragging.ii===x.ii ? " dragging" : "");
                      if(ddChecked) cls += isRightAnswer ? " correct" : " incorrect";
                      return (
                        <div
                          key={x.ii}
                          className={cls}
                          onPointerDown={e=>{ e.stopPropagation(); handleDdPointerDown(e, x.ii); }}
                          onClick={e=>e.stopPropagation()}
                        >{x.it.label}</div>
                      );
                    })}
                    {itemsHere.length===0 && <div className="dd-empty">Drop here</div>}
                  </div>
                );
              })}
            </div>
            {ddDragging && ReactDOM.createPortal(
              <div
                className="dd-ghost"
                style={{
                  transform:`translate(${Math.min(Math.max(ddDragging.x, 10), window.innerWidth-10)}px, ${Math.min(Math.max(ddDragging.y, 10), window.innerHeight-10)}px) translate(-50%,-130%)`
                }}
              >
                {ddDragging.label}
              </div>,
              document.body
            )}
            {!ddChecked && (
              <div className="quiz-footer" style={{justifyContent:"flex-start", marginTop:6, marginBottom:10}}>
                <button className="btn btn-ghost btn-sm" onClick={handleDdCheck} disabled={!ddAllAssigned}>✓ Check Answers</button>
              </div>
            )}
          </React.Fragment>
        )}

        {isOrder && (
          <React.Fragment>
            <p className="fill-hint">Drag the items into the correct order.</p>
            <div className="order-list">
              {orderList.map((origIdx, pos)=>{
                const isRightSpot = orderChecked && origIdx === pos;
                let cls = "order-item";
                if(orderChecked) cls += isRightSpot ? " correct" : " incorrect";
                if(orderDragPos === pos) cls += " dragging";
                return (
                  <div key={origIdx} className={cls} data-pos={pos}>
                    <span className="order-num">{pos+1}</span>
                    <span className="order-label">{q.items[origIdx]}</span>
                    {!orderChecked && (
                      <span
                        className="order-handle"
                        onPointerDown={e=>handleOrderPointerDown(e, pos)}
                        aria-label="Drag to reorder"
                      >⠿</span>
                    )}
                  </div>
                );
              })}
            </div>
            {!orderChecked && (
              <div className="quiz-footer" style={{justifyContent:"flex-start", marginTop:6, marginBottom:10}}>
                <button className="btn btn-ghost btn-sm" onClick={handleOrderCheck}>✓ Check Order</button>
              </div>
            )}
          </React.Fragment>
        )}

        {isLabel && (
          <React.Fragment>
            <p className="fill-hint">Tap a word below, then tap the pin it names.</p>
            <div className="label-image-wrap">
              <img src={q.image} alt="" className="label-image" />
              {(q.points||[]).map((p,pi)=>{
                const wp = labelAssign[pi];
                const hasWord = wp !== undefined;
                const isRightAnswer = labelChecked && hasWord && labelWordOrder[wp] === pi;
                let cls = "label-pin";
                if(hasWord) cls += " filled";
                if(labelChecked) cls += isRightAnswer ? " correct" : " incorrect";
                return (
                  <button key={pi} type="button" className={cls} style={{left:p.x+"%", top:p.y+"%"}} disabled={labelChecked} onClick={()=>handleLabelPinClick(pi)}>
                    <span className="label-pin-num">{pi+1}</span>
                    {hasWord && <span className="label-pin-text">{q.points[labelWordOrder[wp]].label}</span>}
                  </button>
                );
              })}
            </div>
            <div className="label-wordbank">
              {labelWordOrder.map((origIdx, wp)=>{
                const isUsed = Object.values(labelAssign).includes(wp);
                if(isUsed) return null;
                return (
                  <button key={wp} type="button" className={"dd-chip" + (labelActiveWord===wp ? " active" : "")} disabled={labelChecked} onClick={()=>handleLabelWordClick(wp)}>
                    {q.points[origIdx].label}
                  </button>
                );
              })}
              {labelAllAssigned && !labelChecked && (
                <div className="fill-hint" style={{margin:0}}>All parts labeled — check your answers below.</div>
              )}
            </div>
            {!labelChecked && (
              <div className="quiz-footer" style={{justifyContent:"flex-start", marginTop:6, marginBottom:10}}>
                <button className="btn btn-ghost btn-sm" onClick={handleLabelCheck} disabled={!labelAllAssigned}>✓ Check Labels</button>
              </div>
            )}
          </React.Fragment>
        )}

        {isPattern && (
          <React.Fragment>
            <p className="fill-hint">Type the missing numbers in the pattern.</p>
            <div className="pattern-row">
              {(q.items||[]).map((it,ii)=>{
                if(it.kind !== "blank"){
                  return <div key={ii} className="pattern-chip">{it.value}</div>;
                }
                const val = patternValues[ii] !== undefined ? patternValues[ii] : "";
                const acceptableBlank = String(it.answer||"").split("|").map(a=>a.trim());
                const isRight = patternChecked && matchesFillAnswer(val, acceptableBlank);
                let cls = "pattern-blank";
                if(patternChecked) cls += isRight ? " correct" : " incorrect";
                return (
                  <input
                    key={ii}
                    type="text"
                    inputMode="numeric"
                    className={cls}
                    value={val}
                    disabled={patternChecked}
                    placeholder="?"
                    onChange={e=>handlePatternChange(ii, e.target.value)}
                  />
                );
              })}
            </div>
            {!patternChecked && (
              <div className="quiz-footer" style={{justifyContent:"flex-start", marginTop:6, marginBottom:10}}>
                <button className="btn btn-ghost btn-sm" onClick={handlePatternCheck} disabled={!patternAllFilled}>✓ Check Answers</button>
              </div>
            )}
          </React.Fragment>
        )}

        {answered && (
          <div className={"feedback-box " + ((isFill ? fillIsCorrect : isMatch ? matchIsCorrect : isDragDrop ? ddIsCorrect : isOrder ? orderIsCorrect : isLabel ? labelIsCorrect : isPattern ? patternIsCorrect : selected===q.correct) ? "good":"bad")}>
            {(isFill ? fillIsCorrect : isMatch ? matchIsCorrect : isDragDrop ? ddIsCorrect : isOrder ? orderIsCorrect : isLabel ? labelIsCorrect : isPattern ? patternIsCorrect : selected===q.correct) ? "✅ Correct! " : "❌ Not quite. "}
            {isFill && !fillIsCorrect && ("Correct answer: " + acceptable[0] + ". ")}
            {isOrder && !orderIsCorrect && ("Correct order: " + q.items.join(" → ") + ". ")}
            {isLabel && !labelIsCorrect && ("Correct labels: " + (q.points||[]).map(p=>p.label).join(", ") + ". ")}
            {isPattern && !patternIsCorrect && ("Correct numbers: " + (q.items||[]).map(it=> it.kind==="blank" ? String(it.answer||"").split("|")[0].trim() : it.value).join(", ") + ". ")}
            {q.explain}
          </div>
        )}
        </React.Fragment>
        )}
      </div>
    </div>
  );
}

const CONFETTI_COLORS = ["var(--q1)","var(--q2)","var(--q3)","var(--q4)","var(--gold)"];
const REWARD_CONFETTI_COLORS = ["var(--aw-cyan)","var(--aw-magenta)","var(--aw-purple)","var(--gold)","#ffffff"];
const PERFECT_CONFETTI_COLORS = ["var(--aw-cyan)","var(--aw-magenta)","var(--aw-purple)","var(--gold)","#ffffff","var(--q1)","var(--q2)","var(--q3)"];
// warm soft glow tones used for the dark-mode "fireflies" celebration instead of falling confetti
const FIREFLY_COLORS = ["#FFE066","#B4FF6B","#7CFFCB","#FFD37C","#FFF3B0"];
/* Subtle twinkling starfield shown behind everything while dark mode is on. */
function Starfield(){
  const stars = React.useMemo(()=>Array.from({length:70}, (_,i)=>{
    const size = 1 + Math.random()*2.2;
    return {
      top: Math.random()*100,
      left: Math.random()*100,
      size,
      dur: (2.2 + Math.random()*3.5)+"s",
      delay: (Math.random()*4)+"s",
      min: (0.05 + Math.random()*0.2).toFixed(2),
      max: (0.55 + Math.random()*0.45).toFixed(2)
    };
  }), []);
  return (
    <div className="starfield" aria-hidden="true">
      {stars.map((s,i)=>(
        <div key={i} className="starfield-star" style={{
          top:s.top+"%", left:s.left+"%", width:s.size+"px", height:s.size+"px",
          animationDuration:s.dur, animationDelay:s.delay,
          "--star-min":s.min, "--star-max":s.max
        }}/>
      ))}
    </div>
  );
}
function Confetti({variant, big}){
  const dark = typeof document !== "undefined" && document.body.classList.contains("dark-mode");
  const palette = variant === "perfect" ? PERFECT_CONFETTI_COLORS : variant === "reward" ? REWARD_CONFETTI_COLORS : CONFETTI_COLORS;
  const count = dark ? (big ? 55 : 14) : (big ? 90 : 18);

  const items = React.useMemo(()=>{
    if(dark){
      const rand = (min,max)=> min + Math.random()*(max-min);
      return Array.from({length:count}, (_,i)=>({
        left: big ? Math.random()*100 : 6 + Math.random()*88,
        size: (big ? rand(6,10) : rand(5,8)).toFixed(1)+"px",
        dx1: rand(-16,16)+"px", dx2: rand(-22,22)+"px", dx3: rand(-18,18)+"px",
        dx4: rand(-24,24)+"px", dx5: rand(-14,14)+"px",
        delay: (Math.random()*(big?3.2:1.4))+"s",
        dur: (big ? rand(4.2,7.4) : rand(3.2,5.6))+"s",
        color: FIREFLY_COLORS[i % FIREFLY_COLORS.length]
      }));
    }
    const dir0 = ()=> Math.random()>0.5 ? 1 : -1;
    const spread = big ? 220 : 60;
    return Array.from({length:count}, (_,i)=>{
      const dir = dir0();
      return {
        left: big ? Math.random()*100 : 4 + Math.random()*92,
        dxMid: (dir * (10 + Math.random()*spread*0.6))+"px",
        dx: (dir * (Math.random()*spread))+"px",
        rotMid: (Math.random()*260+120)+"deg",
        rot: (Math.random()*680+260)+"deg",
        delay: (Math.random()*(big?0.6:0.25))+"s",
        dur: (big ? 1.8+Math.random()*1.1 : 1.1+Math.random()*0.6)+"s",
        color: palette[i % palette.length],
        round: Math.random()>0.5
      };
    });
  }, [variant, big, count, dark]);

  if(dark){
    return (
      <div className={"confetti-wrap firefly-wrap" + (big ? " big" : "")} aria-hidden="true">
        {items.map((f,i)=>(
          <div key={i} className="firefly-piece" style={{
            left:f.left+"%", width:f.size, height:f.size, background:f.color,
            boxShadow: "0 0 6px 2px "+f.color+", 0 0 16px 6px "+f.color+"66",
            animationDelay:f.delay, animationDuration:f.dur,
            "--dx1":f.dx1, "--dx2":f.dx2, "--dx3":f.dx3, "--dx4":f.dx4, "--dx5":f.dx5
          }}/>
        ))}
      </div>
    );
  }
  return (
    <div className={"confetti-wrap" + (big ? " big" : "")} aria-hidden="true">
      {items.map((p,i)=>(
        <div key={i} className="confetti-piece" style={{
          left:p.left+"%", background:p.color,
          borderRadius: p.round ? "50%" : "2px",
          animationDelay:p.delay, animationDuration:p.dur,
          "--dx":p.dx, "--dxMid":p.dxMid, "--rot":p.rot, "--rotMid":p.rotMid
        }}/>
      ))}
    </div>
  );
}
// Shared "your answer / correct answer" block for one answered question — used both by the
