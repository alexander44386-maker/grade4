-family:'Baloo 2', sans-serif;\n    font-weight:800;\n    font-size:22px;\n    color:#fff;\n    text-shadow:0 1px 2px rgba(0,0,0,0.3);\n    will-change:transform;\n    transition:filter 0.15s ease;\n    animation: racer-pop-in 0.3s cubic-bezier(.34,1.56,.64,1) both, racer-bounce 0.5s ease-in-out 0.3s infinite;\n  }\n  .racer .headlight{\n    position:absolute;\n    left:-3px; top:8px;\n    width:8px;height:8px;\n    background:#FFF6C4;\n    border-radius:50%;\n    box-shadow:0 0 6px #FFF6C4, 0 20px 0 #FFF6C4;\n  }\n  .racer .letter-txt{ margin-left:8px; z-index:1; }\n  .racer .feature{ position:absolute; pointer-events:none; }\n\n  @keyframes racer-pop-in{\n    0%{ transform: scale(0.3) translateX(20px); opacity:0; }\n    70%{ transform: scale(1.12) translateX(-3px); opacity:1; }\n    100%{ transform: scale(1) translateX(0); opacity:1; }\n  }\n  @keyframes racer-bounce{\n    0%,100%{ transform: translateY(0) rotate(0deg); }\n    50%{ transform: translateY(-3px) rotate(-1.2deg); }\n  }\n  .racer.pop{ animation: racer-pop 0.32s cubic-bezier(.36,.07,.19,.97) forwards; }\n  @keyframes racer-pop{\n    0%{ transform: scale(1) rotate(0deg); opacity:1; }\n    35%{ transform: scale(1.25,0.85) rotate(-6deg); opacity:1; }\n    100%{ transform: scale(0.2) rotate(20deg) translateY(-18px); opacity:0; }\n  }\n  .racer.miss{ animation: racer-spinout 0.55s ease-in forwards; }\n  @keyframes racer-spinout{\n    0%{ opacity:1; transform: translateY(0) rotate(0deg) scale(1); }\n    50%{ opacity:0.9; transform: translateY(4px) rotate(-160deg) scale(0.9); }\n    100%{ opacity:0; transform: translateY(10px) rotate(-320deg) scale(0.6); }\n  }\n\n  #view-race .diff-btn{ background:#2B2D36; color:#FFF6E8; border-color:#4A4E5C; }\n  #view-race .diff-btn.selected{\n    background:linear-gradient(135deg, #FFD23F, #FF9F1C);\n    color:#402600;\n    border-color:#E88A00;\n    box-shadow:0 4px 0 #C46F00;\n  }\n  #view-race .start-btn{\n    background:linear-gradient(135deg, #FF3B3B, #C4232B);\n    box-shadow:0 6px 0 #8E1A1F, 0 10px 20px rgba(255,59,59,0.35);\n  }\n  #view-race .start-btn:active{ box-shadow:0 2px 0 #8E1A1F; }\n  #view-race .intro{ background:rgba(30,20,18,0.94); color:#FFF6E8; }\n  #view-race .intro h2{ color:#FFF6E8; }\n  #view-race .intro p{ color:#E8D4C4; }\n  #view-race .diff-label{ color:#E8D4C4; }\n  #view-race .cancel-btn{ background:linear-gradient(135deg, #FF7A5C, #C4232B); color:#FFF6E8; }\n  #view-race.playing #diff-chip-rc,\n  #view-race.playing #streak-chip-rc,\n  #view-race.playing #score-chip-rc{ display:none; }\n  #view-race .keyboard-wrap{ background:rgba(30,26,26,0.75); border-top:2px solid #FF9F1C44; }\n  #view-race .key{ background:linear-gradient(180deg, #3A3C44, #24262C); border:1px solid #4A4E5C; box-shadow:0 3px 0 #16171C; color:#8C8F99; }\n  #view-race .key.target{\n    background:linear-gradient(180deg, #FFE58A, #FFD23F);\n    color:#402600;\n    border-color:#E8B93F;\n    box-shadow:0 3px 0 #C4900F, 0 0 0 4px #FFD23F55;\n  }\n  #view-race .toast{ color:#FFD23F; text-shadow:0 0 12px rgba(255,210,63,0.8), 0 3px 10px rgba(0,0,0,0.5); }\n  #view-race .level-popup{ background:rgba(30,20,18,0.65); }\n  #view-race .level-popup-card{ background:#2B2D36; box-shadow:0 14px 40px rgba(0,0,0,0.55), 0 4px 0 #ffffff11 inset; }\n  #view-race .level-popup-title{ color:#FFD23F; text-shadow:0 0 16px rgba(255,210,63,0.5); }\n  #view-race .level-popup-sub{ color:#E8D4C4; }\n\n  .demo-racer{\n    width:66px;height:44px;\n    border-radius:14px 22px 10px 10px;\n    position:relative;\n    box-shadow:0 8px 18px rgba(0,0,0,0.3);\n  }\n\n  @media (max-width:640px){\n    .sidebar{ width:72px; padding:12px 4px; }\n    .sidebar.collapsed{ width:40px; }\n    .nav-btn .nav-icon{ font-size:22px; }\n    .nav-btn{ font-size:9px; padding:8px 2px; }\n    header{ padding:6px 10px; gap:5px; }\n    .stat{ padding:4px 8px; font-size:11px; gap:3px; }\n    .stat span.label{ font-size:8px; }\n    .key{ height:20px; font-size:8px; min-width:16px;}\n    .critter, .invader{ width:52px; height:52px; font-size:20px;}\n    .racer{ width:54px; height:36px; font-size:17px;}\n    .player-car{ width:48px; height:48px; left:40px; }\n    .car-body{ font-size:34px; }\n  }\n</style>\n<style>\n  html,body{overflow:hidden;}\n</style>\n</head>\n<body>\n<div class=\"main-area\">\n    <div class=\"game-view active\" id=\"view-space\">\n      <div class=\"planet\"></div>\n      <div class=\"star-tw\" style=\"width:3px;height:3px;top:10%;left:8%;animation-delay:0s;\"></div>\n      <div class=\"star-tw\" style=\"width:2px;height:2px;top:22%;left:20%;animation-delay:0.6s;\"></div>\n      <div class=\"star-tw\" style=\"width:4px;height:4px;top:15%;left:45%;animation-delay:1.2s;\"></div>\n      <div class=\"star-tw\" style=\"width:2px;height:2px;top:32%;left:60%;animation-delay:1.8s;\"></div>\n      <div class=\"star-tw\" style=\"width:3px;height:3px;top:8%;left:75%;animation-delay:0.3s;\"></div>\n      <div class=\"star-tw\" style=\"width:2px;height:2px;top:45%;left:12%;animation-delay:1s;\"></div>\n      <div class=\"star-tw\" style=\"width:3px;height:3px;top:52%;left:88%;animation-delay:1.5s;\"></div>\n      <div class=\"star-tw\" style=\"width:2px;height:2px;top:18%;left:92%;animation-delay:0.9s;\"></div>\n      <div class=\"shooting-star\"></div>\n\n      <header>\n        <h1><span class=\"rocket-badge\">\ud83d\ude80</span>Galaxy Blaster</h1>\n        <div class=\"stat-row\">\n          <div class=\"stat level-chip\"><span class=\"label\">LEVEL</span><span id=\"level-val-sp\">1</span></div>\n          <div class=\"stat diff-chip\"><span class=\"label\">MODE</span><span id=\"diff-val-sp\">Medium</span></div>\n          <div class=\"stat best-chip\"><span class=\"label\">BEST</span><span id=\"best-val-sp\">1</span></div>\n          <div class=\"stat hearts-chip\"><span class=\"label\">LIVES</span><span id=\"hearts-val-sp\"></span></div>\n          <div class=\"stat streak-chip\"><span class=\"label\">STREAK</span><span id=\"streak-val-sp\">0</span></div>\n          <div class=\"stat score-chip\"><span class=\"label\">SCORE</span><span id=\"score-val-sp\">0</span></div>\n          <button class=\"cancel-btn\" title=\"Quit game\" id=\"cancel-btn-sp\">\u2715</button>\n        </div>\n      </header>\n\n      <div class=\"game-box\" id=\"game-space\">\n        <div class=\"cannon\"><div class=\"base\"></div><div class=\"barrel\"></div></div>\n        <div class=\"intro\" id=\"intro-sp\">\n          <div class=\"demo-row\" id=\"demo-row-sp\"></div>\n          <h2>Blast the Alien Invaders!</h2>\n          <p>Alien invaders are dropping in from deep space, each one carrying a letter. Zap it with your laser cannon by pressing the matching key before it lands! Type 10 in a row to charge your ship's power, then press SPACE to unleash it whenever you want.</p>\n          <div class=\"diff-label\">Choose your ship</div>\n          <div class=\"char-row\" id=\"char-row-sp\">\n            <button class=\"char-btn selected\" data-char=\"rocket\"><span class=\"char-emoji\">\ud83d\ude80</span>Rocket</button>\n            <button class=\"char-btn locked-char uncommon-char\" data-char=\"ufo\" data-cost=\"50\" data-name=\"Saucer\">\n              <span class=\"char-emoji\">\ud83d\udef8</span>Saucer\n              <span class=\"char-lock\">\ud83d\udd12 50</span>\n            </button>\n            <button class=\"char-btn locked-char uncommon-char\" data-char=\"robot\" data-cost=\"50\" data-name=\"Titan Mech\">\n              <span class=\"char-emoji\">\ud83e\udd16</span>Titan Mech\n              <span class=\"char-lock\">\ud83d\udd12 50</span>\n            </button>\n            <button class=\"char-btn locked-char uncommon-char\" data-char=\"comet\" data-cost=\"50\" data-name=\"Comet\">\n              <span class=\"char-emoji\">\ud83d\uddfd</span>Comet\n              <span class=\"char-lock\">\ud83d\udd12 50</span>\n            </button>\n            <button class=\"char-btn locked-char rare-char\" data-char=\"blaze\" data-cost=\"100\" data-name=\"Blaze Fighter\">\n              <span class=\"char-emoji\">\ud83d\udd25</span>Blaze Fighter\n              <span class=\"char-power\">\u2744\ufe0f Freeze Blast</span>\n              <span class=\"char-lock\">\ud83d\udd12 100</span>\n            </button>\n            <button class=\"char-btn locked-char rare-char\" data-char=\"ice\" data-cost=\"100\" data-name=\"Glacier Reaper\">\n              <span class=\"char-emoji\">\ud83e\udd76</span>Glacier Reaper\n              <span class=\"char-power\">\u2744\ufe0f Freeze Blast</span>\n              <span class=\"char-lock\">\ud83d\udd12 100</span>\n            </button>\n            <button class=\"char-btn locked-char rare-char\" data-char=\"star\" data-cost=\"100\" data-name=\"Meteor Striker\">\n              <span class=\"char-emoji\">\ud83c\udf20</span>Meteor Striker\n              <span class=\"char-power\">\u2744\ufe0f Freeze Blast</span>\n              <span class=\"char-lock\">\ud83d\udd12 100</span>\n            </button>\n            <button class=\"char-btn locked-char epic-char\" data-char=\"volt\" data-cost=\"200\" data-name=\"Thunder Talon\">\n              <span class=\"char-emoji\">\ud83e\udd3d</span>Thunder Talon\n              <span class=\"char-power\">\ud83d\udc0c Slow Field</span>\n              <span class=\"char-lock\">\ud83d\udd12 200</span>\n            </button>\n            <button class=\"char-btn locked-char epic-char\" data-char=\"terra\" data-cost=\"200\" data-name=\"Quake Crusher\">\n              <span class=\"char-emoji\">\ud83c\udf0b</span>Quake Crusher\n              <span class=\"char-power\">\ud83d\udc0c Slow Field</span>\n              <span class=\"char-lock\">\ud83d\udd12 200</span>\n            </button>\n            <button class=\"char-btn locked-char epic-char\" data-char=\"alien\" data-cost=\"200\" data-name=\"Nebula Phantom\">\n              <span class=\"char-emoji\">\ud83e\udd8e</span>Nebula Phantom\n              <span class=\"char-power\">\ud83d\udc0c Slow Field</span>\n              <span class=\"char-lock\">\ud83d\udd12 200</span>\n            </button>\n            <button class=\"char-btn locked-char legendary-char\" data-char=\"dragon\" data-cost=\"300\" data-name=\"Dragon Ace\">\n              <span class=\"char-emoji\">\ud83d\udc09</span>Dragon Ace\n              <span class=\"char-power\">\ud83d\udca5 Meteor Bomb</span>\n              <span class=\"char-lock\">\ud83d\udd12 300</span>\n            </button>\n            <button class=\"char-btn locked-char legendary-char\" data-char=\"shadow\" data-cost=\"300\" data-name=\"Void Stalker\">\n              <span class=\"char-emoji\">\ud83e\udd8d</span>Void Stalker\n              <span class=\"char-power\">\ud83d\udca5 Meteor Bomb</span>\n              <span class=\"char-lock\">\ud83d\udd12 300</span>\n            </button>\n            <button class=\"char-btn locked-char legendary-char\" data-char=\"storm\" data-cost=\"300\" data-name=\"Tempest Raider\">\n              <span class=\"char-emoji\">\ud83d\udc1e</span>Tempest Raider\n              <span class=\"char-power\">\ud83d\udca5 Meteor Bomb</span>\n              <span class=\"char-lock\">\ud83d\udd12 300</span>\n            </button>\n            <button class=\"char-btn locked-char mythic-char\" data-char=\"cosmic\" data-cost=\"500\" data-name=\"Galaxy Sovereign\">\n              <span class=\"char-emoji\">\ud83d\udc7e</span>Galaxy Sovereign\n              <span class=\"char-power\">\ud83c\udf1f Nova Blast</span>\n              <span class=\"char-lock\">\ud83d\udd12 500</span>\n            </button>\n          </div>\n          <div class=\"diff-label\">Choose your difficulty</div>\n          <div class=\"diff-row\" id=\"diff-row-sp\">\n            <button class=\"diff-btn\" data-diff=\"easy\">\ud83c\udf31 Easy</button>\n            <button class=\"diff-btn selected\" data-diff=\"medium\">\u2b50 Medium</button>\n            <button class=\"diff-btn\" data-diff=\"hard\">\ud83d\udd25 Hard</button>\n          </div>\n          <div class=\"diff-label\">Choose which keys to practice</div>\n          <div class=\"kf-preset-row\" id=\"kf-presets-sp\"></div>\n          <div class=\"keyfilter-board\" id=\"kf-board-sp\"></div>\n          <button class=\"start-btn\" id=\"start-btn-sp\">Launch!</button>\n        </div>\n      </div>\n\n      <div class=\"keyboard-wrap\" id=\"keyboard-wrap-sp\">\n        <div class=\"kb-row\" id=\"row-num-sp\"></div>\n        <div class=\"kb-row\" id=\"row1-sp\"></div>\n        <div class=\"kb-row\" id=\"row2-sp\"></div>\n        <div class=\"kb-row\" id=\"row3-sp\"></div>\n      </div>\n    </div>\n\n</div>\n<div class=\"confirm-overlay\" id=\"confirm-overlay\">\n  <div class=\"confirm-card\">\n    <p id=\"confirm-message\">Are you sure?</p>\n    <div class=\"confirm-btn-row\">\n      <button class=\"confirm-btn no\" id=\"confirm-btn-no\">Keep Playing</button>\n      <button class=\"confirm-btn yes\" id=\"confirm-btn-yes\">Yes, Quit</button>\n    </div>\n  </div>\n</div>\n<script>\n// ============================================================\n// Shared level builder used by ALL games (same typing curriculum).\n// The set of keys in play is now chosen up front by the player on the\n// key-filter screen and stays FIXED for the whole session \u2014 levels no\n// longer drip-feed new letters. Instead, each level just ramps speed\n// and shrinks the pops needed to advance, so leveling up happens fast.\n// ============================================================\nfunction buildLevels(selectedKeys){\n  const letters = (selectedKeys && selectedKeys.length) ? selectedKeys : KEY_PRESETS.home.keys;\n  const NUM_LEVELS = 40;\n  const LEVELS = [];\n  for(let levelIdx=0; levelIdx<NUM_LEVELS; levelIdx++){\n    LEVELS.push({\n      letters: letters,\n      // Levels 1-10 (idx 0-9) ramp UP from 5 pops to 20 pops so the game eases\n      // the player in; levels 11+ keep climbing gradually (capped at 30) so\n      // later levels stay meaningfully longer, not shorter.\n      popsToLevel: levelIdx < 10\n        ? Math.round(5 + levelIdx*(15/9))\n        : Math.min(30, 20 + Math.ceil((levelIdx-9)/2)),\n      speed: Math.min(1.5, 0.55 + levelIdx*0.065),\n      spawnMs: Math.max(650, 1900 - levelIdx*95)\n    });\n  }\n  return LEVELS;\n}\n\n// ============================================================\n// Shared key-filter picker: lets the player choose which keys will be\n// used for the ENTIRE game session before it starts. Presets cover\n// common practice sets, and any individual key can be toggled too.\n// ============================================================\nconst KB_LAYOUT = {\n  num: '1234567890'.split(''),\n  row1: 'qwertyuiop'.split(''),\n  row2: 'asdfghjkl;'.split(''),\n  row3: 'zxcvbnm,.'.split('')\n};\nconst ALL_KEYS = [].concat(KB_LAYOUT.num, KB_LAYOUT.row1, KB_LAYOUT.row2, KB_LAYOUT.row3);\nconst KEY_PRESETS = {\n  all:     { label:'\u2328\ufe0f All Keys',     keys: ALL_KEYS },\n  home:    { label:'\ud83c\udfe0 Home Row',     keys: KB_LAYOUT.row2 },\n  top:     { label:'\ud83d\udd3c Top Row',      keys: KB_LAYOUT.row1 },\n  bottom:  { label:'\ud83d\udd3d Bottom Row',   keys: KB_LAYOUT.row3 },\n  letters: { label:'\ud83d\udd24 Letters Only', keys: KB_LAYOUT.row1.concat(KB_LAYOUT.row2, KB_LAYOUT.row3) },\n  numbers: { label:'\ud83d\udd22 Numbers Only', keys: KB_LAYOUT.num }\n};\n\nfunction createKeyFilter(boardEl, presetEl, onChange){\n  // Presets are now MULTI-SELECT and additive: tapping a preset toggles all of\n  // its keys on (or off, if every one of its keys is already selected), so a\n  // player can combine e.g. \"Top Row\" + \"Home Row\" instead of one replacing\n  // the other. Individual keys can still be toggled directly on the board.\n  let selected = new Set();\n  const keyEls = {};\n  const presetBtns = {};\n\n  function syncBoard(){\n    Object.keys(keyEls).forEach(ch=> keyEls[ch].classList.toggle('selected', selected.has(ch)));\n  }\n  function syncPresets(){\n    Object.keys(KEY_PRESETS).forEach(pid=>{\n      const allOn = KEY_PRESETS[pid].keys.every(ch=>selected.has(ch));\n      presetBtns[pid].classList.toggle('selected', allOn);\n    });\n  }\n\n  presetEl.innerHTML = '';\n  Object.keys(KEY_PRESETS).forEach(pid=>{\n    const btn = document.createElement('button');\n    btn.className = 'kf-preset-btn';\n    btn.textContent = KEY_PRESETS[pid].label;\n    btn.dataset.preset = pid;\n    btn.addEventListener('click', ()=>{\n      const keys = KEY_PRESETS[pid].keys;\n      const allOn = keys.every(ch=>selected.has(ch));\n      if(allOn){\n        keys.forEach(ch=>selected.delete(ch));\n      } else {\n        keys.forEach(ch=>selected.add(ch));\n      }\n      syncBoard();\n      syncPresets();\n      if(onChange) onChange(selected.size);\n    });\n    presetEl.appendChild(btn);\n    presetBtns[pid] = btn;\n  });\n\n  boardEl.innerHTML = '';\n  ['num','row1','row2','row3'].forEach(rowId=>{\n    const rowWrap = document.createElement('div');\n    rowWrap.className = 'kf-row';\n    KB_LAYOUT[rowId].forEach(ch=>{\n      const k = document.createElement('div');\n      k.className = 'kf-key';\n      k.textContent = ch === ';' ? ';' : ch.toUpperCase();\n      k.dataset.key = ch;\n      k.addEventListener('click', ()=>{\n        if(selected.has(ch)){ selected.delete(ch); } else { selected.add(ch); }\n        k.classList.toggle('selected', selected.has(ch));\n        syncPresets();\n        if(onChange) onChange(selected.size);\n      });\n      rowWrap.appendChild(k);\n      keyEls[ch] = k;\n    });\n    boardEl.appendChild(rowWrap);\n  });\n\n  syncPresets();\n  if(onChange) onChange(selected.size);\n\n  return {\n    getSelected(){\n      return selected.size > 0 ? Array.from(selected) : KEY_PRESETS.home.keys.slice();\n    }\n  };\n}\n\nconst DIFFICULTIES = {\n  easy:   { label:'Easy',   speedMult:0.7,  spawnMult:1.4 },\n  medium: { label:'Medium', speedMult:1.0,  spawnMult:1.0 },\n  hard:   { label:'Hard',   speedMult:1.4,  spawnMult:0.68 },\n};\n\n// ============================================================\n// Shared level-up popup: pauses the game briefly and shows a\n// \"Level X!\" card before resuming (used by all games).\n// ============================================================\n// ============================================================\n// Shared celebration system: coins persist across sessions\n// (localStorage). Every level-complete moment across all four games\n// calls buildCelebrationContent() to get the same big stars / stats /\n// coins card, just dropped into whatever container each game already\n// uses to show it.\n// ============================================================\nconst CELEBRATION_LINES = ['Amazing!','Fantastic!',\"You're on fire!\",'Incredible!','Super star!','Way to go!','Awesome work!','You crushed it!','Wow, nice job!'];\n\nfunction getCoins(){\n  try { return parseInt(localStorage.getItem('ta-coins')||'0', 10) || 0; } catch(e){ return 0; }\n}\nfunction addCoins(n){\n  const total = getCoins() + n;\n  try { localStorage.setItem('ta-coins', String(total)); } catch(e){}\n  return total;\n}\nfunction trySpendCoins(n){\n  const total = getCoins();\n  if(total < n) return false;\n  try { localStorage.setItem('ta-coins', String(total - n)); } catch(e){}\n  return true;\n}\nfunction getBestLevel(){\n  try { return parseInt(localStorage.getItem('ta-best-level')||'1', 10) || 1; } catch(e){ return 1; }\n}\nfunction saveBestLevel(n){\n  const cur = getBestLevel();\n  if(n > cur){ try { localStorage.setItem('ta-best-level', String(n)); } catch(e){} }\n  return Math.max(cur, n);\n}\nfunction getUnlockedShips(){\n  try { return JSON.parse(localStorage.getItem('ta-unlocked-ships') || '[]'); } catch(e){ return []; }\n}\nfunction unlockShip(key){\n  const owned = getUnlockedShips();\n  if(!owned.includes(key)){\n    owned.push(key);\n    try { localStorage.setItem('ta-unlocked-ships', JSON.stringify(owned)); } catch(e){}\n  }\n}\nfunction updateCoinBadge(){\n  const el = document.getElementById('coin-badge-total');\n  if(!el) return;\n  el.textContent = getCoins();\n  const badge = document.getElementById('coin-badge');\n  if(badge){\n    badge.classList.remove('bump');\n    void badge.offsetWidth;\n    badge.classList.add('bump');\n  }\n}\nfunction calcAccuracy(hits, misses){\n  const total = hits + misses;\n  return total > 0 ? (hits/total)*100 : 100;\n}\n\n// Builds the celebration markup from level stats. Returns separate\n// title/body HTML so callers with a single card (level-popup) or a\n// split title+list layout (race leaderboard) can both use it.\nfunction buildCelebrationContent(stats){\n  const lettersTyped = (stats && stats.lettersTyped) || 0;\n  const accuracy = stats && typeof stats.accuracy === 'number' ? stats.accuracy : 100;\n  const stars = accuracy >= 95 ? 3 : accuracy >= 80 ? 2 : 1;\n  const phrase = CELEBRATION_LINES[Math.floor(Math.random()*CELEBRATION_LINES.length)];\n  const starsHTML = '\u2b50'.repeat(stars) + '\u2606'.repeat(3-stars);\n  const titleHTML = `<div class=\"celebration-stars\">${starsHTML}</div><div class=\"level-popup-title\">${phrase}</div>`;\n  const bodyHTML = `\n    <div class=\"celebration-stats\">\n      <div class=\"celebration-stat\"><span class=\"celebration-stat-num\">${lettersTyped}</span><span class=\"celebration-stat-label\">letters</span></div>\n      <div class=\"celebration-stat\"><span class=\"celebration-stat-num\">${Math.round(accuracy)}%</span><span class=\"celebration-stat-label\">accuracy</span></div>\n    </div>\n  `;\n  return { titleHTML, bodyHTML };\n}\n\nfunction showLevelPopup(gameEl, levelNumber, stats, callback){\n  const overlay = document.createElement('div');\n  overlay.className = 'level-popup';\n  const card = document.createElement('div');\n  card.className = 'level-popup-card';\n  const { titleHTML, bodyHTML } = buildCelebrationContent(stats);\n  card.innerHTML = titleHTML + `<div class=\"celebration-sub\">Level ${levelNumber-1} complete!</div>` + bodyHTML;\n  overlay.appendChild(card);\n  gameEl.appendChild(overlay);\n  setTimeout(()=>{\n    overlay.classList.add('leaving');\n    setTimeout(()=>{\n      overlay.remove();\n      if(callback) callback();\n    }, 300);\n  }, 2400);\n}\n\n// ============================================================\n// End-of-game coin bonus: awarded once, when a play session actually\n// ends (the player quits back out to the intro screen). Bigger reward\n// for reaching a higher level, and harder difficulties pay out more\n// for the same level range. Brackets of 5 levels:\n//   levels 1-5 -> 10 base coins, levels 6-10 -> 20, 11-15 -> 30, etc.\n// Difficulty then multiplies that base: easy x1, medium x1.5, hard x2.\n// e.g. Easy, level 1-5 = 10 coins (as requested); Hard, level 1-5 = 20.\n// ============================================================\nconst DIFFICULTY_COIN_MULT = { easy: 1, medium: 1.5, hard: 2 };\n\nfunction calcEndOfGameCoins(difficultyKey, levelReached){\n  if(levelReached <= 3) return 0;\n  const bracket = Math.max(1, Math.ceil(levelReached / 5));\n  const base = bracket * 10;\n  const mult = DIFFICULTY_COIN_MULT[difficultyKey] || 1;\n  return Math.round(base * mult);\n}\n\nfunction showEndOfGameCoins(gameEl, difficultyKey, levelReached, callback){\n  const coins = calcEndOfGameCoins(difficultyKey, levelReached);\n  if(coins <= 0){ if(callback) callback(); return; }\n  addCoins(coins);\n  updateCoinBadge();\n  const diffLabel = DIFFICULTIES[difficultyKey] ? DIFFICULTIES[difficultyKey].label : difficultyKey;\n  const overlay = document.createElement('div');\n  overlay.className = 'level-popup';\n  const card = document.createElement('div');\n  card.className = 'level-popup-card';\n  card.innerHTML = `\n    <div class=\"level-popup-badge\">\ud83e\ude99</div>\n    <div class=\"level-popup-title\">+${coins} Coins!</div>\n    <div class=\"level-popup-sub\">Reached Level ${levelReached} on ${diffLabel}</div>\n  `;\n  overlay.appendChild(card);\n  gameEl.appendChild(overlay);\n  setTimeout(()=>{\n    overlay.classList.add('leaving');\n    setTimeout(()=>{\n      overlay.remove();\n      if(callback) callback();\n    }, 300);\n  }, 2200);\n}\n\n// ============================================================\n// Shared confirm modal: used for \"quit this game?\" (X button) and\n// \"switch games?\" (sidebar nav while a game is in progress).\n// ============================================================\nconst confirmOverlay = document.getElementById('confirm-overlay');\nconst confirmMessage = document.getElementById('confirm-message');\nconst confirmBtnYes = document.getElementById('confirm-btn-yes');\nconst confirmBtnNo = document.getElementById('confirm-btn-no');\n\nfunction showConfirm(message, onConfirm){\n  confirmMessage.textContent = message;\n  confirmOverlay.classList.add('show');\n  function cleanup(){\n    confirmOverlay.classList.remove('show');\n    confirmBtnYes.removeEventListener('click', onYes);\n    confirmBtnNo.removeEventListener('click', onNo);\n  }\n  function onYes(){ cleanup(); onConfirm(); }\n  function onNo(){ cleanup(); }\n  confirmBtnYes.addEventListener('click', onYes);\n  confirmBtnNo.addEventListener('click', onNo);\n}\n\n// ============================================================\n// Shared screen-shake utility: a quick punchy shake applied to any\n// game element (boss hits, big combo milestones). Used across games.\n// ============================================================\nfunction screenShake(el, intensity){\n  if(!el) return;\n  var cls = intensity === 'heavy' ? 'screen-shake-heavy' : 'screen-shake-light';\n  el.classList.remove('screen-shake-heavy','screen-shake-light');\n  void el.offsetWidth;\n  el.classList.add(cls);\n  setTimeout(function(){ el.classList.remove(cls); }, 400);\n}\n\n// ============================================================\n// Shared voice encouragement (browser speech synthesis).\n// Every correct hit says a cheerful phrase; every 5-in-a-row says\n// \"Super!\". Used by all four games. Can be muted from the sidebar.\n// ============================================================\nlet voiceEnabled = true;\ntry { voiceEnabled = localStorage.getItem('ta-voice-enabled') !== '0'; } catch(e){}\n\nlet cachedVoice = null;\nfunction pickVoice(){\n  if(cachedVoice) return cachedVoice;\n  if(!('speechSynthesis' in window)) return null;\n  const voices = speechSynthesis.getVoices();\n  if(!voices || !voices.length) return null;\n  cachedVoice =\n    voices.find(v=>/child|kid/i.test(v.name)) ||\n    voices.find(v=>/en/i.test(v.lang) && /female|samantha|victoria|karen|zira|fiona|moira/i.test(v.name)) ||\n    voices.find(v=>/en/i.test(v.lang)) ||\n    voices[0];\n  return cachedVoice;\n}\nif('speechSynthesis' in window){\n  speechSynthesis.onvoiceschanged = ()=>{ cachedVoice = null; };\n}\n\nfunction speak(text){\n  if(!voiceEnabled) return;\n  if(!('speechSynthesis' in window)) return;\n  // Don't stack utterances on top of each other during fast typing bursts.\n  if(speechSynthesis.speaking) return;\n  try{\n    const u = new SpeechSynthesisUtterance(text);\n    u.rate = 1.05;\n    u.pitch = 1.3;\n    u.volume = 0.9;\n    const v = pickVoice();\n    if(v) u.voice = v;\n    speechSynthesis.speak(u);\n  }catch(e){}\n}\n\nconst SUCCESS_PHRASES = [\"Awesome!\",\"Great job!\",\"Fantastic!\",\"You're getting faster!\"];\n\n// Call this on every correct letter, passing the current in-a-row streak count.\nfunction speakSuccess(streakCount){\n  if(streakCount > 0 && streakCount % 5 === 0){\n    speak(\"SUPER!\");\n  } else {\n    speak(SUCCESS_PHRASES[Math.floor(Math.random()*SUCCESS_PHRASES.length)]);\n  }\n}\n\n(function(){\n  const voiceBtn = document.getElementById('voice-toggle');\n  const voiceIcon = document.getElementById('voice-icon');\n  if(!voiceBtn || !voiceIcon) return; // standalone Galaxy Blaster page has no sidebar voice toggle\n  function refreshVoiceIcon(){\n    voiceIcon.textContent = voiceEnabled ? '\ud83d\udd0a' : '\ud83d\udd07';\n    voiceBtn.title = voiceEnabled ? 'Voice praise: on (tap to mute)' : 'Voice praise: off (tap to unmute)';\n  }\n  refreshVoiceIcon();\n  voiceBtn.addEventListener('click', ()=>{\n    voiceEnabled = !voiceEnabled;\n    if(!voiceEnabled && 'speechSynthesis' in window) speechSynthesis.cancel();\n    try { localStorage.setItem('ta-voice-enabled', voiceEnabled ? '1' : '0'); } catch(e){}\n    refreshVoiceIcon();\n  });\n})();\n\n// ============================================================\n// Shared \"boss battle\" system. Every 5th level (5, 10, 15...) a\n// giant monster appears and, instead of single letters, the kid\n// has to type a whole word to defeat it \u2014 one hit of damage per\n// correct letter, in order. Used by all four games.\n// ============================================================\nconst BOSS_WORDS = {\n  3: [\"cat\",\"dog\",\"sun\",\"hat\",\"red\",\"big\",\"run\",\"sit\",\"hop\",\"top\"],\n  4: [\"frog\",\"tree\",\"star\",\"gift\",\"kind\",\"leaf\",\"fish\",\"bird\",\"jump\",\"blue\"],\n  5: [\"apple\",\"eagle\",\"tiger\",\"brave\",\"happy\",\"storm\",\"light\",\"magic\",\"house\",\"plant\"],\n  6: [\"banana\",\"dragon\",\"wizard\",\"castle\",\"planet\",\"rocket\",\"garden\",\"forest\",\"purple\",\"yellow\"],\n  7: [\"dolphin\",\"penguin\",\"volcano\",\"diamond\",\"monster\",\"rainbow\",\"chicken\",\"elegant\"],\n  8: [\"elephant\",\"treasure\",\"mountain\",\"dinosaur\",\"surprise\",\"sandwich\"],\n  9: [\"chocolate\",\"adventure\",\"butterfly\",\"xylophone\"]\n};\nconst BOSS_EMOJIS = ['\ud83d\udc79','\ud83d\udc09','\ud83d\udc7a','\ud83d\udc7e','\ud83e\udd96','\ud83d\udc32','\ud83e\uddcc'];\nconst BOSS_TARGET_LENGTHS = [5,6,7,8,9];\n// Seconds allowed per letter of the boss word, by difficulty \u2014 plus a flat\n// grace bonus below, since this is built for grade 2 & grade 4 students.\nconst BOSS_TIME_PER_LETTER = { easy: 3.4, medium: 2.6, hard: 2.0 };\nconst BOSS_TIME_GRACE = 6; // extra flat seconds of grace time for young typists\n\n// Picks a word made only of letters the kid has already unlocked,\n// as close as possible to the target length for this boss number.\nfunction pickBossWord(unlockedLetters, targetLen){\n  const set = new Set(unlockedLetters);\n  function fits(w){ return w.split('').every(c=>set.has(c)); }\n  const lens = Object.keys(BOSS_WORDS).map(Number).sort((a,b)=>Math.abs(a-targetLen)-Math.abs(b-targetLen));\n  for(const len of lens){\n    const candidates = BOSS_WORDS[len].filter(fits);\n    if(candidates.length) return candidates[Math.floor(Math.random()*candidates.length)];\n  }\n  const letters = unlockedLetters.filter(c=>/^[a-z]$/.test(c));\n  if(!letters.length) return 'key';\n  const len = Math.max(3, Math.min(6, letters.length));\n  let w = '';\n  for(let i=0;i<len;i++) w += letters[Math.floor(Math.random()*letters.length)];\n  return w;\n}\n\n// ============================================================\n// Regular-level \"word invaders\" (level 26+): instead of a single letter,\n// the invader shows a short real word and the kid has to type it letter by\n// letter in order \u2014 reusing the same sequential-typing mechanic as shielded\n// invaders. Level 26-30 uses 2-letter words, level 31+ uses 3-letter words\n// (the same short-word list the level-3 boss already uses).\n// ============================================================\nconst WORD_INVADER_WORDS_2 = [\"at\",\"in\",\"on\",\"up\",\"no\",\"go\",\"hi\",\"me\",\"we\",\"it\",\"is\",\"am\",\"an\",\"as\",\"or\",\"if\",\"so\",\"to\",\"be\",\"he\",\"by\",\"my\",\"do\",\"us\"];\nfunction pickWordInvaderWord(unlockedLetters, len){\n  const set = new Set(unlockedLetters);\n  function fits(w){ return w.split('').every(c=>set.has(c)); }\n  const pool = len <= 2 ? WORD_INVADER_WORDS_2 : (BOSS_WORDS[len] || BOSS_WORDS[3]);\n  const candidates = pool.filter(fits);\n  if(candidates.length) return candidates[Math.floor(Math.random()*candidates.length)];\n  // Fallback if the chosen practice keys can't spell any real word in the\n  // list (e.g. a numbers-only key set) \u2014 keeps the level playable by just\n  // chaining random letters from the active set instead.\n  const letters = unlockedLetters.filter(c=>/^[a-z]$/.test(c));\n  const pickFrom = letters.length ? letters : unlockedLetters;\n  let w = '';\n  for(let i=0;i<len;i++) w += pickFrom[Math.floor(Math.random()*pickFrom.length)];\n  return w;\n}\n\n// Shows the boss overlay inside gameEl and captures keystrokes until the word\n// is fully typed (calls onDefeat()), or until the countdown timer runs out\n// first (calls onTimeout() instead) \u2014 the timer is sized by difficulty plus a\n// flat grace bonus so it stays fair for grade 2 & grade 4 students.\nfunction startBossFight(gameEl, bossNumber, unlockedLetters, difficulty, onDefeat, onTimeout){\n  const targetLen = BOSS_TARGET_LENGTHS[Math.min(bossNumber-1, BOSS_TARGET_LENGTHS.length-1)];\n  const word = pickBossWord(unlockedLetters, targetLen);\n  const bossEmoji = BOSS_EMOJIS[(bossNumber-1) % BOSS_EMOJIS.length];\n  let pointer = 0;\n  let finished = false;\n  const perLetter = BOSS_TIME_PER_LETTER[difficulty] || BOSS_TIME_PER_LETTER.medium;\n  let timeLeft = Math.round(word.length * perLetter + BOSS_TIME_GRACE);\n\n  const overlay = document.createElement('div');\n  overlay.className = 'boss-overlay';\n  overlay.innerHTML =\n    '<div class=\"boss-intro\">BOSS BATTLE!</div>' +\n    '<div class=\"boss-figure\">' + bossEmoji + '</div>' +\n    '<div class=\"boss-hpbar\"><div class=\"boss-hpfill\"></div></div>' +\n    '<div class=\"boss-word\"></div>' +\n    '<div class=\"boss-timer\"></div>' +\n    '<div class=\"boss-hint\">Type the word to defeat it!</div>';\n  gameEl.appendChild(overlay);\n\n  const introEl = overlay.querySelector('.boss-intro');\n  const wordEl = overlay.querySelector('.boss-word');\n  const hpFill = overlay.querySelector('.boss-hpfill');\n  const bossFigure = overlay.querySelector('.boss-figure');\n  const timerEl = overlay.querySelector('.boss-timer');\n  const letterEls = word.split('').map((ch, i)=>{\n    const s = document.createElement('span');\n    s.className = 'boss-letter' + (i===0 ? ' active' : '');\n    s.textContent = ch.toUpperCase();\n    wordEl.appendChild(s);\n    return s;\n  });\n\n  function renderTimer(){\n    timerEl.textContent = '\u23f1 ' + Math.max(0, timeLeft) + 's';\n    timerEl.classList.toggle('boss-timer-low', timeLeft <= 5);\n  }\n  renderTimer();\n  const timerId = setInterval(()=>{\n    timeLeft -= 1;\n    renderTimer();\n    if(timeLeft <= 0) finish(false);\n  }, 1000);\n\n  speak('Boss battle!');\n\n  function finish(won){\n    if(finished) return;\n    finished = true;\n    clearInterval(timerId);\n    document.removeEventListener('keydown', onKey);\n    if(won){\n      bossFigure.classList.add('boss-defeated');\n      introEl.textContent = 'BOSS DEFEATED!';\n      screenShake(gameEl, 'heavy');\n      speak('Boss defeated!');\n      setTimeout(()=>{\n        overlay.classList.add('leaving');\n        setTimeout(()=>{ overlay.remove(); onDefeat(); }, 350);\n      }, 900);\n    } else {\n      introEl.textContent = \"TIME'S UP!\";\n      bossFigure.classList.remove('boss-shake');\n      void bossFigure.offsetWidth;\n      bossFigure.classList.add('boss-shake');\n      speak('Out of time!');\n      setTimeout(()=>{\n        overlay.classList.add('leaving');\n        setTimeout(()=>{ overlay.remove(); onTimeout(); }, 350);\n      }, 900);\n    }\n  }\n\n  function onKey(e){\n    let ch = e.key.toLowerCase();\n    if(ch.length !== 1) return;\n    if(ch !== word[pointer]){\n      bossFigure.classList.remove('boss-shake');\n      void bossFigure.offsetWidth;\n      bossFigure.classList.add('boss-shake');\n      return;\n    }\n    letterEls[pointer].classList.remove('active');\n    letterEls[pointer].classList.add('hit');\n    pointer += 1;\n    hpFill.style.width = Math.max(0, 100 - Math.round((pointer/word.length)*100)) + '%';\n    bossFigure.classList.remove('boss-hit');\n    void bossFigure.offsetWidth;\n    bossFigure.classList.add('boss-hit');\n    screenShake(gameEl, 'light');\n    if(pointer < word.length){\n      letterEls[pointer].classList.add('active');\n    } else {\n      finish(true);\n    }\n  }\n  document.addEventListener('keydown', onKey);\n}\n\n// GAME 2: Galaxy Blaster (same typing mechanic, space theme)\n// ============================================================\nconst pauseSpace = (function(){\n  const view = document.getElementById('view-space');\n  const game = document.getElementById('game-space');\n  const levelVal = document.getElementById('level-val-sp');\n  const diffVal = document.getElementById('diff-val-sp');\n  const bestVal = document.getElementById('best-val-sp');\n  const heartsVal = document.getElementById('hearts-val-sp');\n  const streakVal = document.getElementById('streak-val-sp');\n  const scoreVal = document.getElementById('score-val-sp');\n  const startBtn = document.getElementById('start-btn-sp');\n  const intro = document.getElementById('intro-sp');\n  const cancelBtn = document.getElementById('cancel-btn-sp');\n  const diffRow = document.getElementById('diff-row-sp');\n  const keyboardWrap = document.getElementById('keyboard-wrap-sp');\n  // The on-screen keyboard hint is a training-wheels aid for while a game\n  // is actually running (see startGame(), which un-hides it unless hard\n  // mode is picked) \u2014 it stays hidden on the setup/intro screen so it\n  // doesn't visually clutter the character/difficulty/key picker.\n  if(keyboardWrap) keyboardWrap.style.display = 'none';\n  const demoRow = document.getElementById('demo-row-sp');\n  const charRow = document.getElementById('char-row-sp');\n  const cannonBase = document.querySelector('#game-space .cannon .base');\n  const cannonBarrel = document.querySelector('#game-space .cannon .barrel');\n  const cannonEl = document.querySelector('#game-space .cannon');\n  let cannonReturnTimer = null;\n  function moveCannonTo(targetX){\n    if(!cannonEl) return;\n    const gw = game.clientWidth;\n    const clampedX = Math.max(28, Math.min(gw-28, targetX));\n    cannonEl.style.transition = 'left 0.28s cubic-bezier(.34,1.56,.64,1)';\n    cannonEl.style.left = clampedX + 'px';\n    clearTimeout(cannonReturnTimer);\n    cannonReturnTimer = setTimeout(()=>{\n      cannonEl.style.transition = 'left 0.6s ease';\n      cannonEl.style.left = '50%';\n    }, 1500);\n  }\n  function resetCannonPosition(){\n    clearTimeout(cannonReturnTimer);\n    if(!cannonEl) return;\n    cannonEl.style.transition = 'none';\n    cannonEl.style.left = '50%';\n  }\n\n  // \"power\" marks which streak-of-10 ability a ship carries:\n  //  - 'freeze'  (100-coin ships): freezes every invader on screen so the\n  //    player can safely type all of them without losing hearts.\n  //  - 'explode' (200-coin ships): instantly clears every invader on screen.\n  //  - 'nova'    (500-coin ship): freezes AND explodes everything for bonus\n  //    score, then grants a few seconds of shield \u2014 strictly stronger than\n  //    either 100- or 200-coin power alone.\n  const CHAR_DEFS = {\n    rocket: { emoji:'\ud83d\ude80', color:'#4DE8FF', rotate:-45, tier:'common' },\n    ufo:    { emoji:'\ud83d\udef8', color:'#5CFF8F', rotate:0, tier:'uncommon' },\n    robot:  { emoji:'\ud83e\udd16', color:'#C0C0C0', rotate:0, tier:'uncommon' },\n    comet:  { emoji:'\ud83d\uddfd', color:'#FFE066', rotate:-45, tier:'uncommon' },\n    blaze:  { emoji:'\ud83d\udd25', color:'#FF5E3A', rotate:-45, legendary:false, power:'freeze', tier:'rare' },\n    ice:    { emoji:'\ud83e\udd76', color:'#7BE8FF', rotate:0, legendary:false, power:'freeze', tier:'rare' },\n    star:   { emoji:'\ud83c\udf20', color:'#FFD966', rotate:0, legendary:false, power:'freeze', tier:'rare' },\n    volt:   { emoji:'\ud83e\udd3d', color:'#FFE93B', rotate:0, legendary:false, power:'slow', tier:'epic' },\n    terra:  { emoji:'\ud83c\udf0b', color:'#FF7043', rotate:0, legendary:false, power:'slow', tier:'epic' },\n    alien:  { emoji:'\ud83e\udd8e', color:'#9B5DE5', rotate:0, legendary:false, power:'slow', tier:'epic' },\n    dragon: { emoji:'\ud83d\udc09', color:'#FF4DE0', rotate:0, legendary:true, power:'explode', tier:'legendary' },\n    shadow: { emoji:'\ud83e\udd8d', color:'#7A3FD1', rotate:0, legendary:true, power:'explode', tier:'legendary' },\n    storm:  { emoji:'\ud83d\udc1e', color:'#5C7CFA', rotate:0, legendary:true, power:'explode', tier:'legendary' },\n    cosmic: { emoji:'\ud83d\udc7e', color:'#B84DFF', rotate:0, legendary:false, mythic:true, power:'nova', tier:'mythic' },\n  };\n  let selectedChar = 'rocket';\n  function applyShipVisual(){\n    const def = CHAR_DEFS[selectedChar];\n    cannonBarrel.textContent = def.emoji;\n    cannonBarrel.style.background = 'none';\n    cannonBarrel.style.fontSize = '30px';\n    cannonBarrel.style.lineHeight = '1';\n    cannonBarrel.style.boxShadow = 'none';\n    cannonBarrel.style.filter = `drop-shadow(0 0 8px ${def.color})`;\n    cannonBarrel.style.transform = `translateX(-50%) rotate(${def.rotate}deg)`;\n    // 100/200/500-coin ships get a distinct glowing launch pad (see\n    // .tier-rare/.tier-legendary/.tier-mythic CSS); everything else\n    // just gets the plain color-tinted glow it always had.\n    cannonBase.classList.remove('tier-rare','tier-epic','tier-legendary','tier-mythic');\n    if(def.tier === 'rare' || def.tier === 'epic' || def.tier === 'legendary' || def.tier === 'mythic'){\n      cannonBase.classList.add('tier-' + def.tier);\n      cannonBase.style.boxShadow = '';\n    } else {\n      cannonBase.style.boxShadow = `0 0 10px ${def.color}88`;\n    }\n    cannonBarrel.classList.toggle('legendary-ship', !!def.legendary);\n    cannonBarrel.classList.toggle('mythic-ship', !!def.mythic);\n  }\n  function selectShip(btn){\n    charRow.querySelectorAll('.char-btn').forEach(b=>b.classList.remove('selected'));\n    btn.classList.add('selected');\n    selectedChar = btn.dataset.char;\n    applyShipVisual();\n    updateStreakBadge();\n    updateShipGlow();\n  }\n  // Reflect any ships already unlocked in a previous session.\n  const unlockedShips = getUnlockedShips();\n  charRow.querySelectorAll('.char-btn[data-cost]').forEach(btn=>{\n    if(unlockedShips.includes(btn.dataset.char)){\n      btn.classList.remove('locked-char');\n      const lockEl = btn.querySelector('.char-lock');\n      if(lockEl) lockEl.remove();\n    }\n  });\n  charRow.querySelectorAll('.char-btn').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      if(btn.classList.contains('locked-char')){\n        const cost = parseInt(btn.dataset.cost || '0', 10);\n        const coins = getCoins();\n        if(coins < cost){\n          showToast(`Need ${cost - coins} more coins!`);\n          return;\n        }\n        showConfirm(`Unlock ${btn.dataset.name} for ${cost} coins?`, ()=>{\n          if(!trySpendCoins(cost)) return;\n          updateCoinBadge();\n          unlockShip(btn.dataset.char);\n          btn.classList.remove('locked-char');\n          const lockEl = btn.querySelector('.char-lock');\n          if(lockEl) lockEl.remove();\n          selectShip(btn);\n        });\n        return;\n      }\n      selectShip(btn);\n    });\n  });\n  applyShipVisual();\n\n  const ITYPES = [\n    { key:'zorp',  name:'Zorp',     color:'#5CFF8F' },\n    { key:'blip',  name:'Blipnoid', color:'#4DE8FF' },\n    { key:'volt',  name:'Voltrix',  color:'#FFE066' },\n    { key:'magno', name:'Magnoid',  color:'#FF4DE0' },\n    { key:'crag',  name:'Cragoid',  color:'#FF9F45' },\n    { key:'nebu',  name:'Nebulon',  color:'#B8A6FF' },\n  ];\n\n  // Level 16+ (level index 15+) swap in these armored \"elite\" invaders \u2014\n  // same letter mechanic, but a jagged visor-eyed look (see .invader.elite\n  // CSS) so the game visually steps up once it gets to boss-5 territory,\n  // matching the punchier look the level-5 boss already has.\n  const ELITE_ITYPES = [\n    { key:'grym',  name:'Grymlord', color:'#FF3B3B' },\n    { key:'obsi',  name:'Obsidian', color:'#C79BFF' },\n    { key:'ferro', name:'Ferrox',   color:'#B8C4D6' },\n    { key:'venx',  name:'Venox',    color:'#5CFF8F' },\n    { key:'scorc', name:'Scorch',   color:'#FF9F1C' },\n    { key:'nyx',   name:'Nyxar',    color:'#4DE8FF' },\n  ];\n\n  function buildInvaderFeature(el, type){\n    const f = document.createElement('div');\n    f.className = 'feature';\n    switch(type.key){\n      case 'zorp': // twin antennae with ball tips\n        f.style.cssText = `width:34px;height:16px;top:-14px;left:13px;`;\n        f.innerHTML = `<div style=\"position:absolute;left:2px;top:2px;width:3px;height:14px;background:${type.color};transform:rotate(-20deg);border-radius:2px;\"></div>\n          <div style=\"position:absolute;left:-2px;top:-4px;width:8px;height:8px;background:${type.color};border-radius:50%;box-shadow:0 0 6px ${type.color};\"></div>\n          <div style=\"position:absolute;right:2px;top:2px;width:3px;height:14px;background:${type.color};transform:rotate(20deg);border-radius:2px;\"></div>\n          <div style=\"position:absolute;right:-2px;top:-4px;width:8px;height:8px;background:${type.color};border-radius:50%;box-shadow:0 0 6px ${type.color};\"></div>`;\n        break;\n      case 'blip': // dorsal fin\n        f.style.cssText = `width:18px;height:16px;top:-10px;left:21px;background:${type.color};clip-path:polygon(50% 0%, 100% 100%, 0% 100%);border-radius:3px;box-shadow:0 0 6px ${type.color};`;\n        break;\n      case 'volt': // lightning spike\n        f.style.cssText = `width:16px;height:20px;top:-12px;left:22px;background:${type.color};clip-path:polygon(45% 0%, 20% 45%, 40% 45%, 15% 100%, 65% 40%, 42% 40%, 65% 0%);box-shadow:0 0 6px ${type.color};`;\n        break;\n      case 'magno': // halo ring\n        f.style.cssText = `width:36px;height:14px;top:-10px;left:12px;border:3px solid ${type.color};border-radius:50%;opacity:0.85;box-shadow:0 0 8px ${type.color};transform:rotate(-8deg);`;\n        break;\n      case 'crag': // crystal horn\n        f.style.cssText = `width:14px;height:16px;top:-9px;left:23px;background:${type.color};transform:rotate(45deg);border-radius:3px;box-shadow:0 0 6px ${type.color}aa;`;\n        break;\n      case 'nebu': // soft cloud puff\n        f.style.cssText = `width:26px;height:12px;top:-7px;left:17px;background:${type.color};border-radius:50%;opacity:0.6;filter:blur(1.5px);`;\n        break;\n      // ---- Elite (level 16+) armored spike crests ----\n      case 'grym': case 'obsi': case 'ferro':\n      case 'venx': case 'scorc': case 'nyx':\n        f.style.cssText = `width:0;height:0;top:-13px;left:22px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid ${type.color};filter:drop-shadow(0 0 6px ${type.color});`;\n        break;\n    }\n    el.appendChild(f);\n  }\n\n  ITYPES.slice(0,4).forEach(t=>{\n    const d = document.createElement('div');\n    d.className = 'demo-invader';\n    d.style.color = t.color;\n    d.style.background = `radial-gradient(circle at 32% 30%, #ffffff33, transparent 45%), ${t.color}`;\n    const eye = document.createElement('div'); eye.style.cssText='position:absolute;top:16px;left:50%;transform:translateX(-50%);width:20px;height:20px;background:#0B1740;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,0.5) inset;';\n    const pup = document.createElement('div'); pup.style.cssText='position:absolute;top:6px;left:6px;width:8px;height:8px;background:#fff;border-radius:50%;';\n    eye.appendChild(pup);\n    d.appendChild(eye);\n    buildInvaderFeature(d, t);\n    demoRow.appendChild(d);\n  });\n\n  let difficulty = 'medium';\n  diffRow.querySelectorAll('.diff-btn').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      diffRow.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('selected'));\n      btn.classList.add('selected');\n      difficulty = btn.dataset.diff;\n    });\n  });\n\n  // No keys are pre-selected \u2014 the player must actively choose which\n  // keys to practice (a preset like \"Home Row\" or individual keys)\n  // before Launch! becomes clickable.\n  const keyFilter = createKeyFilter(\n    document.getElementById('kf-board-sp'),\n    document.getElementById('kf-presets-sp'),\n    (count)=>{\n      startBtn.disabled = count === 0;\n      startBtn.textContent = count === 0 ? 'Pick your keys first!' : 'Launch!';\n    }\n  );\n  let LEVELS = buildLevels(keyFilter.getSelected());\n\n  let level = 0;\n  let score = 0;\n  let streak = 0;\n  let popsThisLevel = 0;\n  let missesThisLevel = 0;\n  let running = false;\n  let paused = false;\n  const MAX_HEARTS = 3;\n  let hearts = MAX_HEARTS;\n  let invaders = [];\n  let spawnTimer = null;\n  let rafId = null;\n  let idCounter = 0;\n  // Ship-power state: freezeActive pauses invader movement (and skips the\n  // usual heart-loss-on-landing check) while a Freeze/Nova power is active;\n  // shieldActive (Nova only) skips heart loss for a few extra seconds after.\n  let freezeActive = false;\n  let shieldActive = false;\n  // slowActive (200-coin Slow Field ships) slows every invader on screen by\n  // 70% for a few seconds instead of fully freezing them.\n  let slowActive = false;\n  // Ship power is now BANKED instead of firing instantly: every streak of 10\n  // adds a charge, and the player presses SPACE whenever they want to use one\n  // (so it can be saved for a tricky moment instead of always going off right\n  // when it's earned).\n  let powerCharges = 0;\n\n  // ---- Combo scaling: streak drives a rising score multiplier, and\n  // crossing into a new combo tier awards bonus coins immediately. ----\n  const COMBO_TIERS = [{min:0,mult:1},{min:5,mult:1.5},{min:10,mult:2},{min:20,mult:2.5},{min:30,mult:3}];\n  function getComboTierIndex(s){\n    var idx = 0;\n    for(var i=0;i<COMBO_TIERS.length;i++){ if(s >= COMBO_TIERS[i].min) idx = i; }\n    return idx;\n  }\n\n  // ---- Sound variety: pitch nudges by invader type + streak length. ----\n  const TYPE_TONE_KEYS = ['zorp','blip','volt','magno','crag','nebu','grym','obsi','ferro','venx','scorc','nyx'];\n  function toneForType(typeKey){\n    var idx = TYPE_TONE_KEYS.indexOf(typeKey);\n    return idx >= 0 ? idx*18 : 0;\n  }\n\n  // ---- Adaptive spawn weighting: track per-letter hit/miss/reaction stats\n  // this run, and bias which letters spawn toward ones the player struggles\n  // with, plus power the end-of-run key report. ----\n  let letterStats = {};\n  function recordLetterOutcome(ch, hit, reactionMs){\n    if(!letterStats[ch]) letterStats[ch] = {hits:0, misses:0, totalReactionMs:0};\n    if(hit){\n      letterStats[ch].hits += 1;\n      if(typeof reactionMs === 'number') letterStats[ch].totalReactionMs += reactionMs;\n    } else {\n      letterStats[ch].misses += 1;\n    }\n  }\n  function weightedPickLetter(pool){\n    const weights = pool.map(function(ch){\n      var s = letterStats[ch];\n      if(!s) return 1;\n      var total = s.hits + s.misses;\n      if(total < 2) return 1;\n      var missRate = s.misses / total;\n      return 1 + missRate*3;\n    });\n    var sum = weights.reduce(function(a,b){ return a+b; }, 0);\n    var r = Math.random()*sum;\n    for(var i=0;i<pool.length;i++){\n      r -= weights[i];\n      if(r <= 0) return pool[i];\n    }\n    return pool[pool.length-1];\n  }\n  function formatKeyLabel(ch){ return ch===';' ? ';' : ch.toUpperCase(); }\n  function buildKeyReport(){\n    const entries = Object.keys(letterStats).map(function(ch){\n      var s = letterStats[ch];\n      var avg = s.hits > 0 ? s.totalReactionMs / s.hits : null;\n      var total = s.hits + s.misses;\n      var missRate = total > 0 ? s.misses/total : 0;\n      return {ch:ch, avg:avg, missRate:missRate, total:total};\n    }).filter(function(e){ return e.total >= 2; });\n    const bySlow = entries.filter(function(e){ return e.avg!==null; }).sort(function(a,b){ return b.avg-a.avg; }).slice(0,3);\n    const byMissed = entries.filter(function(e){ return e.missRate>0; }).sort(function(a,b){ return b.missRate-a.missRate; }).slice(0,3);\n    return {bySlow:bySlow, byMissed:byMissed};\n  }\n  function showKeyReport(gameEl, callback){\n    const report = buildKeyReport();\n    if(!report.bySlow.length && !report.byMissed.length){ if(callback) callback(); return; }\n    const overlay = document.createElement('div');\n    overlay.className = 'level-popup';\n    const card = document.createElement('div');\n    card.className = 'level-popup-card';\n    var html = '<div class=\"level-popup-badge\">\ud83d\udcca</div><div class=\"level-popup-title\" style=\"font-size:20px;\">Key Report</div>';\n    if(report.bySlow.length){\n      html += '<div class=\"celebration-sub\">Your slowest keys this round: ' + report.bySlow.map(function(e){ return formatKeyLabel(e.ch); }).join(', ') + '</div>';\n    }\n    if(report.byMissed.length){\n      html += '<div class=\"celebration-sub\">Keys to practice next time: ' + report.byMissed.map(function(e){ return formatKeyLabel(e.ch); }).join(', ') + '</div>';\n    }\n    card.innerHTML = html;\n    overlay.appendChild(card);\n    gameEl.appendChild(overlay);\n    setTimeout(function(){\n      overlay.classList.add('leaving');\n      setTimeout(function(){ overlay.remove(); if(callback) callback(); }, 300);\n    }, 2600);\n  }\n\n  // ---- Ship glow + trail: visual intensity ramps with the current combo tier. ----\n  function updateShipGlow(){\n    const def = CHAR_DEFS[selectedChar];\n    var color = def ? def.color : '#4DE8FF';\n    var tier = getComboTierIndex(streak);\n    var blur = 8 + tier*6;\n    cannonBarrel.style.filter = 'drop-shadow(0 0 ' + blur + 'px ' + color + ')';\n    cannonBase.style.boxShadow = '0 0 ' + (10+tier*6) + 'px ' + color + (tier>=2?'cc':'88');\n  }\n  function spawnShipTrail(){\n    if(!cannonEl || !cannonBarrel) return;\n    const rect = cannonBarrel.getBoundingClientRect();\n    const gameRect = game.getBoundingClientRect();\n    const ghost = document.createElement('div');\n    ghost.textContent = cannonBarrel.textContent;\n    ghost.style.cssText = 'position:absolute; left:' + (rect.left-gameRect.left) + 'px; top:' + (rect.top-gameRect.top) + 'px; font-size:' + rect.height + 'px; line-height:1; pointer-events:none; opacity:0.5; filter:blur(1px); animation: ship-trail-fade 0.4s ease-out forwards; z-index:1;';\n    game.appendChild(ghost);\n    setTimeout(function(){ ghost.remove(); }, 420);\n  }\n  function punchScore(){\n    if(!scoreVal || !scoreVal.parentElement) return;\n    scoreVal.parentElement.classList.remove('score-punch');\n    void scoreVal.parentElement.offsetWidth;\n    scoreVal.parentElement.classList.add('score-punch');\n  }\n\n  const rowsLayout = {\n    'row-num-sp': '1234567890'.split(''),\n    'row1-sp': 'qwertyuiop'.split(''),\n    'row2-sp': 'asdfghjkl;'.split(''),\n    'row3-sp': 'zxcvbnm,.'.split('')\n  };\n  const keyEls = {};\n  Object.keys(rowsLayout).forEach(rowId=>{\n    const rowEl = document.getElementById(rowId);\n    rowsLayout[rowId].forEach(ch=>{\n      const k = document.createElement('div');\n      k.className = 'key locked';\n      k.textContent = ch === ';' ? ';' : ch.toUpperCase();\n      k.dataset.key = ch;\n      rowEl.appendChild(k);\n      keyEls[ch] = k;\n    });\n  });\n\n  function refreshKeyboardLocks(){\n    const active = new Set(LEVELS[level].letters);\n    Object.keys(keyEls).forEach(ch=>{\n      keyEls[ch].classList.toggle('locked', !active.has(ch));\n    });\n  }\n\n  function highlightTargets(){\n    Object.values(keyEls).forEach(k=>k.classList.remove('target'));\n    // Only hint keys for invaders that have actually entered the visible\n    // game area (y >= 0) \u2014 invaders spawn off-screen above the top edge\n    // (y starts at -70) and it's confusing for a kid to see a key light up\n    // before there's anything on screen to shoot at.\n    const onScreen = new Set(invaders.filter(c=>c.y >= 0).map(c=> c.shielded ? c.letters[c.shieldIndex] : c.letter));\n    onScreen.forEach(ch=>{\n      if(keyEls[ch]) keyEls[ch].classList.add('target');\n    });\n  }\n\n  function flashKeyPress(ch){\n    const k = keyEls[ch];\n    if(!k) return;\n    k.classList.add('pressed');\n    setTimeout(()=>k.classList.remove('pressed'), 120);\n  }\n\n  let audioCtx = null;\n  function ensureAudio(){\n    if(!audioCtx){\n      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}\n    }\n  }\n  function playZap(freq){\n    if(!audioCtx) return;\n    const o = audioCtx.createOscillator();\n    const g = audioCtx.createGain();\n    o.type = 'sawtooth';\n    o.frequency.setValueAtTime(freq*1.6, audioCtx.currentTime);\n    o.frequency.exponentialRampToValueAtTime(freq*0.6, audioCtx.currentTime+0.1);\n    g.gain.setValueAtTime(0.14, audioCtx.currentTime);\n    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.16);\n    o.connect(g); g.connect(audioCtx.destination);\n    o.start(); o.stop(audioCtx.currentTime+0.18);\n  }\n\n  function burstExplosion(x,y,color){\n    const ring = document.createElement('div');\n    ring.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:6px;height:6px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px ${color};transform:translate(-50%,-50%);animation:explosion-ring 0.4s ease-out forwards;`;\n    game.appendChild(ring);\n    setTimeout(()=>ring.remove(), 420);\n    const shapes = ['shape-circle','shape-star','shape-diamond'];\n    for(let i=0;i<16;i++){\n      const p = document.createElement('div');\n      p.className = 'confetti-piece ' + shapes[Math.floor(Math.random()*shapes.length)];\n      const sz = 5 + Math.random()*6;\n      p.style.width = sz+'px'; p.style.height = sz+'px';\n      p.style.left = x+'px';\n      p.style.top = y+'px';\n      p.style.background = color;\n      p.style.boxShadow = `0 0 8px ${color}`;\n      const angle = Math.random()*Math.PI*2;\n      const dist = 40 + Math.random()*55;\n      const fx = Math.cos(angle)*dist;\n      const fy = Math.sin(angle)*dist - 20;\n      p.style.setProperty('--fx', fx+'px');\n      p.style.setProperty('--fy', fy+'px');\n      p.style.setProperty('--spin', (Math.random()<0.5?-1:1)*(280+Math.random()*260)+'deg');\n      p.style.setProperty('--fly', `translate(${fx}px, ${fy}px)`);\n      game.appendChild(p);\n      setTimeout(()=>p.remove(), 780);\n    }\n  }\n\n  function fireLaser(targetX, targetY, color){\n    const beam = document.createElement('div');\n    beam.className = 'laser-beam';\n    // Origin = the tip of whichever ship is currently selected, read\n    // straight from its live position so every character (rocket, UFO,\n    // robot, etc.) fires from the right spot instead of a fixed guess.\n    const gameRect = game.getBoundingClientRect();\n    const shipRect = cannonBarrel.getBoundingClientRect();\n    const originX = shipRect.left + shipRect.width/2 - gameRect.left;\n    const originY = shipRect.top - gameRect.top + shipRect.height*0.18;\n    const dx = targetX - originX;\n    const dy = targetY - originY;\n    const length = Math.max(Math.sqrt(dx*dx + dy*dy), 10);\n    // Angle from \"straight up\" (0deg) toward the target, clockwise positive\n    const angleDeg = Math.atan2(dx, -dy) * (180/Math.PI);\n    beam.style.left = (originX-2)+'px';\n    beam.style.top = (originY-length)+'px';\n    beam.style.height = length+'px';\n    beam.style.transformOrigin = '50% 100%';\n    beam.style.transform = `rotate(${angleDeg}deg)`;\n    beam.style.background = `linear-gradient(180deg, #fff, ${color} 40%, transparent)`;\n    beam.style.width = '6px';\n    beam.style.color = color;\n\n    // The two premium unlockable ships (Blaze Fighter, Dragon Ace) get\n    // a signature laser look instead of the plain colored beam.\n    const isBlazeShip = selectedChar === 'blaze';\n    const isDragonShip = selectedChar === 'dragon';\n    const isIceShip = selectedChar === 'ice';\n    const isStarShip = selectedChar === 'star';\n    const isVoltShip = selectedChar === 'volt';\n    const isTerraShip = selectedChar === 'terra';\n    const isAlienShip = selectedChar === 'alien';\n    const isShadowShip = selectedChar === 'shadow';\n    const isStormShip = selectedChar === 'storm';\n    const isCosmicShip = selectedChar === 'cosmic';\n    if(isBlazeShip) beam.classList.add('laser-fire');\n    if(isDragonShip) beam.classList.add('laser-rainbow');\n    if(isIceShip) beam.classList.add('laser-ice');\n    if(isStarShip) beam.classList.add('laser-meteor');\n    if(isVoltShip) beam.classList.add('laser-electric');\n    if(isTerraShip) beam.classList.add('laser-earth');\n    if(isAlienShip) beam.classList.add('laser-toxic');\n    if(isShadowShip) beam.classList.add('laser-shadow');\n    if(isStormShip) beam.classList.add('laser-storm');\n    if(isCosmicShip) beam.classList.add('laser-cosmic');\n\n    game.appendChild(beam);\n    setTimeout(()=>beam.remove(), 160);\n\n    const flash = document.createElement('div');\n    flash.style.cssText = `position:absolute;left:${originX}px;top:${originY}px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff,${color},transparent);transform:translate(-50%,-50%);pointer-events:none;animation:laser-fade 0.18s ease-out forwards;box-shadow:0 0 14px ${color};`;\n    game.appendChild(flash);\n    setTimeout(()=>flash.remove(), 200);\n\n    if(isBlazeShip){\n      // Trailing embers along the beam path\n      for(let i=0;i<5;i++){\n        const t = (i+1)/6;\n        const px = originX + dx*t + (Math.random()*10-5);\n        const py = originY + dy*t + (Math.random()*10-5);\n        const ember = document.createElement('div');\n        ember.className = 'laser-ember';\n        const sz = 4 + Math.random()*4;\n        ember.style.width = sz+'px';\n        ember.style.height = sz+'px';\n        ember.style.left = px+'px';\n        ember.style.top = py+'px';\n        ember.style.setProperty('--ex', (Math.random()*16-8)+'px');\n        ember.style.setProperty('--ey', (
