        {shareStep==="card" && (
          <div className="rc-share-overlay" onClick={closeShare}>
            <div className="rc-share-card-wrap" onClick={e=>e.stopPropagation()}>
              <button className="rc-share-close" onClick={closeShare}>✕</button>
              <div className="rc-share-card" ref={shareCardRef}>
                <div className="rc-share-badge">🎓</div>
                <div className="rc-share-school">Sacred Heart Academy of Pasig</div>
                <div className="rc-share-name">{shareDisplayName}'s Report Card</div>
                <div className="rc-share-quarter">{shareQuarterLabel} · Grade 4</div>

                <div className="rc-share-avg-wrap">
                  <div className="rc-share-avg">{shareAvg!=null ? shareAvg.toFixed(1) : "—"}</div>
                  <div className="rc-share-avg-label">{isFinalShare ? "Overall Average" : "Quarter Average"}</div>
                  {shareHonor && <div className="rc-share-honor">⭐ {shareHonor}</div>}
                </div>

                <div className="rc-share-divider"></div>
                <div className="rc-share-list">
                  {shareRows.map(({s,grade})=>(
                    <div key={s.id} className="rc-share-row">
                      <span className="rc-share-row-subj"><span><SubjectIcon icon={s.icon}/></span><span>{s.shortName}</span></span>
                      <span className="rc-share-row-grade">{grade}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="rc-share-actions-row">
                <button className="rc-share-fb-btn" disabled={shareBusy} onClick={shareReportCard}>
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="white"><path d="M22 12.06C22 6.51 17.52 2 12 2S2 6.51 2 12.06C2 17.06 5.66 21.21 10.44 22v-7.02H7.9v-2.92h2.54V9.84c0-2.51 1.49-3.9 3.78-3.9 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.9h2.78l-.44 2.92h-2.34V22C18.34 21.21 22 17.06 22 12.06z"/></svg>
                  {shareBusy ? "Preparing…" : "Share to Facebook"}
                </button>
              </div>
              <div className="rc-share-hint">Opens your device's share sheet (Facebook included), or downloads the image if sharing isn't supported here.</div>

      </React.Fragment>

  }

function App(){
  const [progress, setProgress] = useState(loadProgress());
  const [edits, setEdits] = useState(loadEdits());
  const [bank, setBank] = useState(loadBank());
  const [moves, setMoves] = useState(loadMoves());
  const [customLessons, setCustomLessons] = useState(loadCustomLessons());
  const [settings, setSettings] = useState(loadSettings());
  const [notes, setNotes] = useState(loadNotes());
  const [activity, setActivity] = useState(loadActivity());
  const [generalKnown, setGeneralKnown] = useState(loadGeneralKnown());
  const [grades, setGrades] = useState(loadGrades());
  const [gradeConfig, setGradeConfig] = useState(loadGradeConfig());
  // Lifted up from GradesScreen (rather than a local useState there) because
  // GradesScreen is redefined on every App re-render — editing a Final/Detailed
  // score triggers setGrades, which re-renders App, which would otherwise reset
  // any state local to GradesScreen and collapse the open subject back to just
  // the Report Card summary. Keeping it here lets it survive those edits.
  const [gradesOpenSubject, setGradesOpenSubject] = useState(null);
  const [gradesSelectedQuarter, setGradesSelectedQuarter] = useState(GRADE_QUARTERS[0].id);
  const [nav, setNav] = useState({screen:"dashboard"});
  const [quizSession, setQuizSession] = useState(null); // {kind:'lesson'|'long', questions, accent, title, key}
  const lastQuizQuestionsRef = useRef({}); // key -> question texts used last time, so "play again" avoids repeats
  const [saveFlash, setSaveFlash] = useState(false);
  const importInputRef = useRef(null);

  useEffect(()=>{ saveProgress(progress); }, [progress]);
  useEffect(()=>{ saveEdits(edits); }, [edits]);
  useEffect(()=>{ saveBank(bank); }, [bank]);
  useEffect(()=>{ saveMoves(moves); }, [moves]);
  useEffect(()=>{ saveCustomLessons(customLessons); }, [customLessons]);
  useEffect(()=>{ saveSettings(settings); }, [settings]);
  useEffect(()=>{ saveNotes(notes); }, [notes]);
  useEffect(()=>{ saveActivity(activity); }, [activity]);
  useEffect(()=>{ saveGeneralKnown(generalKnown); }, [generalKnown]);
  useEffect(()=>{ saveGrades(grades); }, [grades]);
  useEffect(()=>{ saveGradeConfig(gradeConfig); }, [gradeConfig]);
  useEffect(()=>{ setSoundEnabled(settings.soundEnabled !== false); }, [settings.soundEnabled]);
  useEffect(()=>{
    document.body.classList.toggle("dark-mode", !!settings.darkMode);
  }, [settings.darkMode]);

  useEffect(()=>{
    // If the background Firebase pull finds newer data than what we
    // rendered with, refresh state from localStorage without a reload.
    function onCloudSynced(){
      setProgress(loadProgress());
      setEdits(loadEdits());
      setBank(loadBank());
      setMoves(loadMoves());
      setCustomLessons(loadCustomLessons());
      setSettings(loadSettings());
      setNotes(loadNotes());
      setActivity(loadActivity());
      setGeneralKnown(loadGeneralKnown());
      setGrades(loadGrades());
      setGradeConfig(loadGradeConfig());
    }
    window.addEventListener("gs4-cloud-synced", onCloudSynced);
    return () => window.removeEventListener("gs4-cloud-synced", onCloudSynced);
  }, []);

  async function saveEverythingNow(){
    Sound.save();
    saveProgress(progress); saveEdits(edits); saveBank(bank); saveMoves(moves);
    saveCustomLessons(customLessons);
    saveSettings(settings); saveNotes(notes); saveActivity(activity); saveGrades(grades);
    // Skip the debounce and push the full snapshot to Firebase right away.
    clearTimeout(cloudSyncTimer);
    const cloudOk = await pushToCloud();
    setSaveFlash(cloudOk ? "✅ Saved to Firebase!" : "⚠️ Saved on this device only (offline)");
    setTimeout(()=>setSaveFlash(false), 1800);
  }

  async function exportAllData(){
    setSaveFlash("⏳ Gathering backup (incl. offline audio)…");
    // storyAudioCache lives in IndexedDB (not localStorage) and normally
    // never touches Firebase/cloud sync, so it has to be pulled in
    // separately here to make it into the JSON backup file.
    const storyAudioCache = await exportStoryAudioCache();
    const payload = {
      app: "gs4-learning-passport",
      exportedAt: new Date().toISOString(),
      data: {
        progress, edits, bank, moves, customLessons, gradeConfig,
        settings, notes, activity, generalKnown, grades
      },
      // Kept as a separate top-level section (not inside `data`) since it's
      // IndexedDB content, not a localStorage key like everything above.
      storyAudioCache
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `learning-passport-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setSaveFlash("⬇️ Exported backup file!");
    setTimeout(()=>setSaveFlash(false), 1800);
  }

  function importAllData(file){
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const parsed = JSON.parse(reader.result);
        const d = parsed && parsed.data ? parsed.data : parsed; // allow raw or wrapped JSON
        if(!d || typeof d !== "object") throw new Error("bad format");
        const audioEntries = parsed && Array.isArray(parsed.storyAudioCache) ? parsed.storyAudioCache : null;
        const audioNote = audioEntries && audioEntries.length ? ` and ${audioEntries.length} cached story audio file(s)` : "";
        if(!window.confirm(`Import this backup? This will replace all current progress, topics, notes, and quiz bank data${audioNote} on this device.`)) return;
        if(d.progress) setProgress(d.progress);
        if(d.edits) setEdits(d.edits);
        if(d.bank) setBank(d.bank);
        if(d.moves) setMoves(d.moves);
        if(d.customLessons) setCustomLessons(d.customLessons);
        if(d.gradeConfig) setGradeConfig(d.gradeConfig);
        if(d.settings) setSettings(d.settings);
        if(d.notes) setNotes(d.notes);
        if(d.activity) setActivity(d.activity);
        if(d.generalKnown) setGeneralKnown(d.generalKnown);
        if(d.grades) setGrades(d.grades);
        // Persist immediately so a refresh doesn't race the effects.
        if(d.progress) saveProgress(d.progress);
        if(d.edits) saveEdits(d.edits);
        if(d.bank) saveBank(d.bank);
        if(d.moves) saveMoves(d.moves);
        if(d.customLessons) saveCustomLessons(d.customLessons);
        if(d.gradeConfig) saveGradeConfig(d.gradeConfig);
        if(d.settings) saveSettings(d.settings);
        if(d.notes) saveNotes(d.notes);
        if(d.activity) saveActivity(d.activity);
        if(d.generalKnown) saveGeneralKnown(d.generalKnown);
        if(d.grades) saveGrades(d.grades);
        // Restore the IndexedDB offline audio cache, if the backup has one.
        if(audioEntries && audioEntries.length){
          setSaveFlash("⏳ Restoring offline audio…");
          await importStoryAudioCache(audioEntries);
        }
        clearTimeout(cloudSyncTimer);
        const cloudOk = await pushToCloud();
        setSaveFlash(cloudOk ? "✅ Imported & synced!" : "✅ Imported (saved on this device only)");
        setTimeout(()=>setSaveFlash(false), 1800);
      }catch(err){
        setSaveFlash("⚠️ Import failed: invalid file");
        setTimeout(()=>setSaveFlash(false), 2200);
      }
    };
    reader.readAsText(file);
  }

  function logLessonLearned(lessonId){
    setActivity(prev => {
      const today = todayStr();
      if(prev.some(a=>a.type==="lesson" && a.date===today && a.lessonId===lessonId)) return prev;
      return [...prev, {type:"lesson", date:today, lessonId, ts:Date.now()}];
    });
  }
  function logQuestionsAnswered(count){
    setActivity(prev => [...prev, {type:"questions", date:todayStr(), count, ts:Date.now()}]);
  }
  function updateSettings(patch){
    setSettings(prev => ({...prev, ...patch}));
  }
  function addNote(text){
    const t = text.trim();
    if(!t) return;
    setNotes(prev => [{id:"n"+Date.now(), text:t, createdAt:Date.now()}, ...prev]);
  }
  function deleteNote(id){
    setNotes(prev => prev.filter(n=>n.id!==id));
  }

  function saveLessonEdit(lessonId, data){
    setEdits(prev => ({...prev, [lessonId]: data}));
  }
  function setLessonQuestions(lessonId, questions){
    setBank(prev => ({...prev, [lessonId]: questions}));
  }
  function getQuestions(lessonId){
    return bank[lessonId] || [];
  }
  function moveLesson(lessonId, quarterId){
    setMoves(prev => ({...prev, [lessonId]: {quarterId}}));
  }
  function addCustomTopic(subjectId, quarterId, title, sub, chapterId){
    const id = newLessonId();
    setCustomLessons(prev => [...prev, {id, subjectId, quarterId, chapterId: chapterId || null, title: title.trim() || "New Topic", sub: (sub||"").trim(), createdAt: Date.now()}]);
    return id;
  }
  function removeCustomTopic(lessonId){
    setCustomLessons(prev => prev.filter(c => c.id !== lessonId));
    setEdits(prev => { const n = {...prev}; delete n[lessonId]; return n; });
    setBank(prev => { const n = {...prev}; delete n[lessonId]; return n; });
    setProgress(prev => { const n = {...prev, lessons:{...prev.lessons}}; delete n.lessons[lessonId]; return n; });
  }

  function currentSubject(){ return SUBJECTS.find(s=>s.id===nav.subjectId); }

  function goDashboard(){ Sound.back(); setNav({screen:"dashboard"}); setQuizSession(null); }
  function goNotes(){ Sound.nav(); setNav({screen:"notes"}); setQuizSession(null); }
  function goGrades(){ Sound.nav(); setNav({screen:"grades"}); setQuizSession(null); }
  function setGradeEntry(subjectId, quarterId, patch){
    setGrades(prev=>{
      const subj = {...(prev[subjectId]||{})};
      const q = {...(subj[quarterId]||{mode:"final"})};
      subj[quarterId] = {...q, ...patch};
      return {...prev, [subjectId]: subj};
    });
  }
  // Clears a manually-typed Final-mode override for one component, so it
  // falls back to the auto-computed Detailed-items average again. Also
  // clears the old-style value stored directly under the plain key, but
  // only when that isn't actually holding Detailed items (an array).
  function clearGradeFinalOverride(subjectId, quarterId, key){
    setGrades(prev=>{
      const subj = {...(prev[subjectId]||{})};
      const q = {...(subj[quarterId]||{mode:"final"})};
      const patch = {[key+"Final"]: ""};
      if(q[key]!=null && !Array.isArray(q[key])) patch[key] = "";
      subj[quarterId] = {...q, ...patch};
      return {...prev, [subjectId]: subj};
    });
  }
  function defaultTotalFor(key){
    // WW starts out of 10, PT out of 20 (both still user-editable); QA has no
    // preset total since it's a single graded item that varies by quarter.
    if(key==="ww") return 10;
    if(key==="pt") return 20;
    return "";
  }
  function addGradeItem(subjectId, quarterId, key){
    setGrades(prev=>{
      const subj = {...(prev[subjectId]||{})};
      const q = {...(subj[quarterId]||{mode:"final"})};
      const items = [...(q[key]||[]), {score:"", total:defaultTotalFor(key)}];
      subj[quarterId] = {...q, [key]: items};
      return {...prev, [subjectId]: subj};
    });
  }
  function removeGradeItem(subjectId, quarterId, key, idx){
    setGrades(prev=>{
      const subj = {...(prev[subjectId]||{})};
      const q = {...(subj[quarterId]||{mode:"final"})};
      const items = (q[key]||[]).filter((_,i)=>i!==idx);
      subj[quarterId] = {...q, [key]: items};
      return {...prev, [subjectId]: subj};
    });
  }
  function updateGradeItem(subjectId, quarterId, key, idx, field, value){
    setGrades(prev=>{
      const subj = {...(prev[subjectId]||{})};
      const q = {...(subj[quarterId]||{mode:"final"})};
      const items = [...(q[key]||[])];
      items[idx] = {...(items[idx]||{score:"",total:""}), [field]: value};
      subj[quarterId] = {...q, [key]: items};
      return {...prev, [subjectId]: subj};
    });
  }
  function setSubjectWeight(subjectId, key, value){
    setGradeConfig(prev=>({
      ...prev,
      weights: {...prev.weights, [subjectId]: {...prev.weights[subjectId], [key]: value}}
    }));
  }
  function setHonorThreshold(key, value){
    setGradeConfig(prev=>({...prev, honors: {...prev.honors, [key]: value}}));
  }
  function resetGradeConfig(){
    setGradeConfig(defaultGradeConfig());
  }
  function adjustSubjectFinal(subjectId, delta){
    setGrades(prev=>{
      const subj = {...(prev[subjectId]||{})};
      subj.adjust = (Number(subj.adjust)||0) + delta;
      return {...prev, [subjectId]: subj};
    });
  }

  function goSubjectHome(sid){ Sound.nav(); setNav({screen:"home", subjectId:sid}); setQuizSession(null); }

  function goLesson(sid, qid, lid, startEdit){ Sound.nav(); setNav({screen:"lesson", subjectId:sid, quarterId:qid, lessonId:lid, tab:"learn", startEdit:!!startEdit}); setQuizSession(null); }

  function markLearned(lessonId){
    Sound.unlock();
    const wasLearned = !!(progress.lessons[lessonId] && progress.lessons[lessonId].learned);
    setProgress(prev => {
      const next = {...prev, lessons:{...prev.lessons}};
      const rec = next.lessons[lessonId] || {};
      next.lessons[lessonId] = {...rec, learned:true};
      return next;
    });
    logLessonLearned(lessonId);
  }

  function startLessonQuiz(quarter, lesson, count, topics, qType){
    Sound.nav();
    let pool = filterByTopics(getQuestions(lesson.id), topics);
    pool = filterByType(pool, qType);
    const n = Math.max(1, Math.min(count || pool.length, pool.length));
    const avoid = new Set(lastQuizQuestionsRef.current[lesson.id] || []);
    const chosen = pickAvoidingRepeats(pool, n, avoid);
    lastQuizQuestionsRef.current[lesson.id] = chosen.map(q=>q.q);
    setQuizSession({
      kind:"lesson", key:lesson.id, accent:quarter.color, title: lesson.title,
      questions: chosen
    });
  }
  function startLongQuiz(quarter, count, topics, qType){
    Sound.nav();
    const subject = currentSubject();
    const lessons = quarterLessons(subject, quarter, moves, customLessons);
    let pool = lessons.flatMap(l => getQuestions(l.id).map(q => ({...q, tag: mergeLesson(l, edits).title})));
    pool = filterByTopics(pool, topics);
    pool = filterByType(pool, qType);
    const n = Math.max(1, Math.min(count || pool.length, pool.length));
    const avoid = new Set(lastQuizQuestionsRef.current[quarter.id] || []);
    const chosen = pickAvoidingRepeats(pool, n, avoid);
    lastQuizQuestionsRef.current[quarter.id] = chosen.map(q=>q.q);
    setQuizSession({
      kind:"long", key:quarter.id, accent:quarter.color, title: quarter.title + " Long Quiz",
      questions: chosen
    });
  }

  function handleQuizFinish(answers){
    const correct = answers.filter(a=>a.isCorrect).length;
    const total = answers.length;
    const ratio = total ? correct/total : 0;
    const passed = ratio >= 0.7;
    const bucket = quizSession.kind === "lesson" ? progress.lessons : progress.longQuiz;
    const prevRec = bucket[quizSession.key];
    const prevRatio = prevRec && prevRec.best ? prevRec.best.correct/prevRec.best.total : -1;
    const prevPassed = prevRatio >= 0.7;
    const isNewBest = ratio > prevRatio;

    setProgress(prev=>{
      const next = {...prev};
      if(quizSession.kind === "lesson"){
        next.lessons = {...prev.lessons};
        const rec = next.lessons[quizSession.key] || {};
        const best = rec.best && rec.best.correct/rec.best.total >= correct/total ? rec.best : {correct,total};
        next.lessons[quizSession.key] = {...rec, best, last:{correct,total}};
      } else {
        next.longQuiz = {...prev.longQuiz};
        const rec = next.longQuiz[quizSession.key] || {};
        const best = rec.best && rec.best.correct/rec.best.total >= correct/total ? rec.best : {correct,total};
        next.longQuiz[quizSession.key] = {...rec, best, last:{correct,total}};
      }
      return next;
    });
    logQuestionsAnswered(total);

    setQuizSession(sess => ({...sess, finalAnswers: answers}));
  }

  function subjectLessonCount(subject){
    return allSubjectLessons(subject, customLessons).length;
  }
  function subjectLearnedCount(subject, progress){
    return allSubjectLessons(subject, customLessons).filter(l => progress.lessons[l.id] && progress.lessons[l.id].learned).length;
  }

              <div className="ref-cat-head" onClick={()=>toggleCat(cat.id)}>
                <div className="ref-cat-icon">{cat.icon}</div>
                <div className="ref-cat-title">{cat.title}</div>
                <div className="ref-cat-count">{catKnown}/{cat.words.length}</div>
                <div className="ref-cat-chev">▾</div>
              </div>
              {isOpen && (
                <div className="ref-cat-body">
                  <p className="ref-cat-note">{cat.note}</p>
                  <div className="ref-word-grid">
                    {wordsToShow.map(w=>{
                      const known = !!generalKnown[cat.id+"::"+w];
                      return (
                        <button
                          key={w}
                          className={"ref-word" + (known ? " known":"")}
                          onClick={()=>toggleGeneralWord(cat.id, w)}
                        >
                          <span className="chk">{known ? "✓" : "○"}</span>
                          <span>{w}</span>
                        </button>
                      );
                    })}
                  </div>
                  <div className="ref-progress-mini">
                    <div className="ref-progress-mini-fill" style={{width:catPct+"%"}}></div>
                  </div>
                </div>
              )}
            </div>
          );
        })}

        <div className="footer-note">SACRED HEART ACADEMY OF PASIG · GRADE SCHOOL DEPARTMENT</div>
      </React.Fragment>
    );
  }

  /* ---------------- QUARTER SCREEN ---------------- */
  function QuarterScreen(){
    const subject = currentSubject();
    const quarter = subject.quarters.find(q=>q.id===nav.quarterId);
    const isStories = subject.special === "stories";
    const [showSetup, setShowSetup] = useState(false);
    const [generatingIds, setGeneratingIds] = useState({});
    const [genLesson, setGenLesson] = useState(null); // lesson currently being configured for AI generation
    const [genCount, setGenCount] = useState(6);
    const [genTypes, setGenTypes] = useState(new Set(GENERATE_TYPE_ORDER));
    const [genTopic, setGenTopic] = useState("");
    const [genDifficulty, setGenDifficulty] = useState("medium");
    const lessons = quarterLessons(subject, quarter, moves, customLessons);
    const nativeLessons = lessons.filter(l=>l.homeQuarterId===quarter.id);
    const movedInLessons = lessons.filter(l=>l.homeQuarterId!==quarter.id);
    const totalBankQ = lessons.reduce((sum,l)=>sum+getQuestions(l.id).length, 0);
    const [longCount, setLongCount] = useState(Math.min(10, totalBankQ) || 1);
    const [longTopics, setLongTopics] = useState([TOPIC_ALL]);
    const [longType, setLongType] = useState(TYPE_ALL);
    const longFullPool = lessons.flatMap(l=>getQuestions(l.id));
    const longAvailTopics = bankTopics(longFullPool);
    const longAvailTopicsWithCounts = longAvailTopics.map(t=>({name:t, count: longFullPool.filter(q=>normTopic(q.topic)===t).length}));
    const longTopicPool = filterByTopics(longFullPool, longTopics);
    const longFilteredCount = filterByType(longTopicPool, longType).length;
    let counter = 0;

    useEffect(()=>{ setLongCount(Math.min(10, longFilteredCount) || 1); }, [longTopics, longType, longFilteredCount]);
    useEffect(()=>{ setLongType(TYPE_ALL); }, [longTopics]);

    const [addingTopic, setAddingTopic] = useState(false);
    const [newTopicTitle, setNewTopicTitle] = useState("");
    const [newTopicSub, setNewTopicSub] = useState("");
    const [newTopicChapter, setNewTopicChapter] = useState("");

    function submitNewTopic(){
      if(!newTopicTitle.trim()) return;
      const id = addCustomTopic(subject.id, quarter.id, newTopicTitle, newTopicSub, newTopicChapter || null);
      setNewTopicTitle(""); setNewTopicSub(""); setNewTopicChapter(""); setAddingTopic(false);
      goLesson(subject.id, quarter.id, id, true);
    }

    function openGenerateSetup(l, e){
      if(e){ e.stopPropagation(); }
      if(generatingIds[l.id]) return;
      const defaultTypes = new Set(GENERATE_TYPE_ORDER);
      setGenLesson(l);
      setGenTypes(defaultTypes);
      setGenCount(getGenerateCountRange(defaultTypes).min);
      setGenTopic("");
      setGenDifficulty("medium");
    }

    function toggleGenType(t){
      setGenTypes(prev=>{
        const next = new Set(prev);
        if(next.has(t)){ if(next.size>1) next.delete(t); } else { next.add(t); }
        // Cascade: whenever the type selection changes, snap the count back
        // to the automatic (lower-end) value for the new selection.
        setGenCount(getGenerateCountRange(next).min);
        return next;
      });
    }

    async function runGenerateQuestions(){
      const l = genLesson;
      if(!l) return;
      let apiKey = loadGeminiApiKey();
      if(!apiKey){
        apiKey = window.prompt("Paste a free Gemini API key to generate quiz questions (get one at aistudio.google.com/apikey). It's saved on this device only, and also reused for story narration.");
        if(!apiKey || !apiKey.trim()) return;
        apiKey = apiKey.trim();
        saveGeminiApiKey(apiKey);
      }
      setGenLesson(null);
      setGeneratingIds(prev=>({...prev, [l.id]:true}));
      try{
        const merged = mergeLesson(l, edits);
        const generated = await generateQuestionsForLesson(apiKey, merged, {
          count: genCount,
          types: Array.from(genTypes),
          topic: genTopic,
          difficulty: genDifficulty,
          existingQuestions: getQuestions(l.id).map(q=>q.q)
        });
        if(!generated.length){
          alert("Gemini didn't return any usable questions for \"" + merged.title + "\". Try again in a moment.");
        } else {
          setLessonQuestions(l.id, [...getQuestions(l.id), ...generated]);
          alert("✨ Added " + generated.length + " new question" + (generated.length===1?"":"s") + " to \"" + merged.title + "\"'s question bank.");
        }
      }catch(err){
        alert("Couldn't generate questions: " + (err && err.message ? err.message : "unknown error"));
      }finally{
        setGeneratingIds(prev=>{ const next={...prev}; delete next[l.id]; return next; });
      }
    }

    function renderLessonCard(l0, moved){
      counter++;
      const l = mergeLesson(l0, edits);
      const rec = progress.lessons[l.id];
      const learned = rec && rec.learned;
      const best = rec && rec.best;
      const qCount = getQuestions(l.id).length;
      if(isStories){
        return (
          <button key={l.id} className="lesson-card" style={{width:"100%", border:"2px solid var(--line)", position:"relative", animationDelay:Math.min(counter*0.04,0.4)+"s"}} onClick={()=>goLesson(subject.id, quarter.id, l.id)}>
            <div className="lesson-num" style={{background:quarter.color}}>{counter}</div>
            <div className="lesson-body">
              <h3>{l.title}</h3>
              {l.sub && <div className="sub">{l.sub}</div>}
              <div className="lesson-status">
                {moved && <span className="pill todo">📦 Moved here</span>}
                <span className={"pill " + (learned ? "done":"todo")}>{learned ? "✅ Read" : "▶ Read"}</span>
              </div>
            </div>
            {l0.isCustom && (
              <span
                role="button"
                title="Delete this story"
                className="note-remove-btn"
                style={{position:"absolute", top:8, right:8}}
                onClick={(e)=>{
                  e.stopPropagation();
                  if(window.confirm('Delete the story "' + l.title + '"?')){
                    removeCustomTopic(l.id);
                  }
                }}
              >✕</span>
            )}
            <div className="chev">›</div>
          </button>
        );
      }
      return (
        <button key={l.id} className="lesson-card" style={{width:"100%", border:"2px solid var(--line)", position:"relative", animationDelay:Math.min(counter*0.04,0.4)+"s"}} onClick={()=>goLesson(subject.id, quarter.id, l.id)}>
          <div className="lesson-num" style={{background:quarter.color}}>{counter}</div>
          <div className="lesson-body">
            <h3>{l.title}</h3>
            {l.sub && <div className="sub">{l.sub}</div>}
            <div className="lesson-status">
              {moved && <span className="pill todo">📦 Moved here</span>}
              {l0.isCustom && <span className="pill todo">✨ My Topic</span>}
              {getLessonVideos(l).some(u=>youtubeEmbedId(u)) && <span className="pill done">🎬 Video</span>}
              <span className={"pill " + (learned ? "done":"todo")}>{learned ? "📖 Learned" : "📖 Not started"}</span>
              <span
                role="button"
                title="Generate quiz questions with AI (Gemini) from this topic's notes"
                className="pill todo"
                style={{cursor: generatingIds[l.id] ? "default" : "pointer", opacity: generatingIds[l.id] ? 0.6 : 1}}
                onClick={(e)=>openGenerateSetup(l, e)}
              >{generatingIds[l.id] ? "⏳ Generating…" : "✨ Generate"}</span>
              {best ? (
                <span className={"pill " + (best.correct/best.total>=0.7 ? "score-good":"score-bad")}>
                  📝 {best.correct}/{best.total}
                </span>
              ) : (
                <span className="pill todo">📝 {qCount ? qCount + " Qs in bank" : "No questions yet"}</span>
              )}
            </div>
          </div>
          {l0.isCustom && (
            <span
              role="button"
              title="Delete this topic"
              className="note-remove-btn"
              style={{position:"absolute", top:8, right:8}}
              onClick={(e)=>{
                e.stopPropagation();
                if(window.confirm('Delete the topic "' + l.title + '"? This removes its notes and question bank too.')){
                  removeCustomTopic(l.id);
                }
              }}
            >✕</span>
          )}
          <div className="chev">›</div>
        </button>
      );
    }

    return (
      <React.Fragment>
        <div className="backbar">
          <button className="backbtn" onClick={()=>goSubjectHome(subject.id)}>←</button>
          <div>
            <div className="qnum" style={{color:quarter.color}}>{subject.shortName} · {quarter.num}</div>
            <h1 style={{margin:0, fontSize:"22px"}}>{quarter.icon} {quarter.title}</h1>
          </div>
        </div>

        {quarter.chapters.map(ch=>{
          const chLessons = nativeLessons.filter(l=>l.chapterId===ch.id);
          if(!chLessons.length) return null;
          return (
            <div key={ch.id}>
              <h3 className="chapter-title">{ch.title}</h3>
              {chLessons.map(l0=>renderLessonCard(l0, false))}
            </div>
          );
        })}

        {(()=>{
          const myTopics = nativeLessons.filter(l=>l.chapterId==="custom");
          if(!myTopics.length) return null;
          return (
            <div>
              <h3 className="chapter-title">{isStories ? "✨ My Stories" : "✨ My Topics"}</h3>
              {myTopics.map(l0=>renderLessonCard(l0, false))}
            </div>
          );
        })()}

        {movedInLessons.length > 0 && (
          <div>
            <h3 className="chapter-title">{isStories ? "📦 Moved Stories" : "📦 Moved Topics"}</h3>
            {movedInLessons.map(l0=>renderLessonCard(l0, true))}
          </div>
        )}

        <div className="note-block" style={{padding:14, marginBottom:18}}>
          {addingTopic ? (
            <React.Fragment>
              <label className="field-label" style={{marginTop:0}}>{isStories ? "Story title" : "Topic title"}</label>
              <input
                type="text" className="text-input" value={newTopicTitle}
                onChange={e=>setNewTopicTitle(e.target.value)}
                placeholder={isStories ? "e.g. The Turtle and the Monkey" : "e.g. The Water Cycle"} autoFocus
              />
              <label className="field-label">{isStories ? "Short blurb (optional)" : "Subtitle (optional)"}</label>
              <input
                type="text" className="text-input" value={newTopicSub}
                onChange={e=>setNewTopicSub(e.target.value)}
                placeholder={isStories ? "e.g. A Filipino folktale about patience" : "e.g. Evaporation, Condensation, Precipitation"}
              />
              {!isStories && (
                <React.Fragment>
                  <label className="field-label">Add inside</label>
                  <select className="text-input" value={newTopicChapter} onChange={e=>setNewTopicChapter(e.target.value)}>
                    <option value="">✨ My Topics (new section)</option>
                    {quarter.chapters.map(ch=>(
                      <option key={ch.id} value={ch.id}>{ch.title}</option>
                    ))}
                  </select>
                </React.Fragment>
              )}
              <div className="learn-footer" style={{gap:10}}>
                <button className="btn btn-ghost" onClick={()=>{setAddingTopic(false); setNewTopicTitle(""); setNewTopicSub(""); setNewTopicChapter("");}}>Cancel</button>
                <button className="btn btn-primary" style={{background:quarter.color}} disabled={!newTopicTitle.trim()} onClick={submitNewTopic}>+ {isStories ? "Create Story" : "Create Topic"} →</button>
              </div>
            </React.Fragment>
          ) : (
            <button className="btn" style={{background:quarter.color, color:"#fff", width:"100%"}} onClick={()=>setAddingTopic(true)}>
              + Add New {isStories ? "Story" : "Topic"} to {quarter.title}
            </button>
          )}
        </div>

        {!isStories && (
        <div className="longquiz-card" style={{flexDirection:"column", alignItems:"stretch"}}>
          <div style={{display:"flex", alignItems:"center", gap:14}}>
            <div className="lqicon">🏆</div>
            <div style={{flex:1}}>
              <h3>{quarter.title} — Long Quiz</h3>
              <p>All topics in this quarter, combined into one test. {totalBankQ} question{totalBankQ===1?"":"s"} available.{progress.longQuiz[quarter.id] ? " Best: " + progress.longQuiz[quarter.id].best.correct + "/" + progress.longQuiz[quarter.id].best.total : ""}</p>
            </div>
            {!showSetup && (
              totalBankQ > 0 ? (
                <button className="btn" style={{background:quarter.color, color:"#fff"}} onClick={()=>setShowSetup(true)}>Start</button>
              ) : (
                <span className="pill todo">No questions yet</span>
              )
            )}
          </div>
          {showSetup && (
            <div style={{marginTop:14}}>
              {longAvailTopics.length > 0 && (
                <React.Fragment>
                  <label className="field-label">Which topic(s)?</label>
                  <div style={{maxWidth:320, marginBottom:14}}>
                    <TopicPicker
                      topics={longAvailTopicsWithCounts}
                      totalCount={totalBankQ}
                      selected={longTopics}
                      onToggle={(t)=>toggleTopicSelection(longTopics, t, setLongTopics)}
                    />
                  </div>
                </React.Fragment>
              )}
              <label className="field-label">Question type?</label>
              <div style={{marginBottom:14}}>
                <QuizTypePicker pool={longTopicPool} selected={longType} onSelect={setLongType} />
              </div>
              {longFilteredCount === 0 ? (
                <p className="sub">No questions of this type for this topic yet.</p>
              ) : (
                <React.Fragment>
                  <label className="field-label">How many questions would you like to take? (1–{longFilteredCount})</label>
                  <input type="number" className="text-input" min={1} max={longFilteredCount} value={longCount}
                    onChange={e=>{
                      const raw = e.target.value;
                      if(raw === ""){ setLongCount(""); return; }
                      const v = parseInt(raw,10);
                      if(Number.isNaN(v)) return;
                      setLongCount(Math.max(1, Math.min(v, longFilteredCount)));
                    }}
                    onBlur={()=>{
                      if(longCount === "" || Number.isNaN(longCount)) setLongCount(1);
                    }} />
                </React.Fragment>
              )}
              <div className="learn-footer" style={{gap:10}}>
                <button className="btn btn-ghost" onClick={()=>setShowSetup(false)}>Cancel</button>
                {longFilteredCount > 0 && (
                  <button className="btn btn-primary" style={{background:quarter.color}} onClick={()=>startLongQuiz(quarter, longCount, longTopics, longType)}>Start Long Quiz →</button>
                )}
              </div>
            </div>
          )}
        </div>
        )}
        {genLesson && (
          <div className="gen-setup-overlay" onClick={()=>setGenLesson(null)}>
            <div className="gen-setup-card" onClick={e=>e.stopPropagation()}>
              <h3 style={{margin:"0 0 4px"}}>✨ Generate Questions</h3>
              <p className="sub" style={{margin:"0 0 14px"}}>For "{mergeLesson(genLesson, edits).title}"</p>

              <label className="field-label">How many questions?</label>
              <select className="text-input" value={genCount}
                onChange={e=>setGenCount(parseInt(e.target.value,10))}>
                {(()=>{
                  const range = getGenerateCountRange(genTypes);
                  return getGenerateCountOptions(genTypes).map(v=>(
                    <option key={v} value={v}>{v}{v===range.min ? " (recommended)" : ""}</option>
                  ));
                })()}
              </select>

              <label className="field-label">Question type(s)</label>
              <div style={{display:"flex", flexWrap:"wrap", gap:8, marginBottom:6}}>
                {GENERATE_TYPE_ORDER.map(t=>(
                  <span key={t}
                    className={"pill " + (genTypes.has(t) ? "done" : "todo")}
                    style={{cursor:"pointer"}}
                    onClick={()=>toggleGenType(t)}
                  >{genTypes.has(t) ? "✓ " : ""}{GENERATE_TYPE_LABELS[t]}</span>
                ))}
              </div>

              <label className="field-label">Focus area (optional)</label>
              <input type="text" className="text-input" placeholder={"e.g. \"addition\" — leave blank for the whole lesson: \"" + mergeLesson(genLesson, edits).title + "\""}
                value={genTopic} onChange={e=>setGenTopic(e.target.value)} />
              {genTopic.trim() ? (
                <p className="sub" style={{margin:"4px 0 0"}}>Every question will be narrowed to "{genTopic.trim()}" — Gemini won't wander into other parts of this lesson. Questions are tagged with this exact focus area so you can pick it again later when starting a quiz.</p>
              ) : (
                <p className="sub" style={{margin:"4px 0 0"}}>Type a specific part of the lesson (e.g. "addition" instead of all of Math, or "the water cycle" instead of all of Science) to narrow every generated question to just that.</p>
              )}

              <label className="field-label">Difficulty</label>
              <div style={{display:"flex", gap:8, marginBottom:6}}>
                {[["easy","🌱 Easy"],["medium","⭐ Medium"],["hard","🔥 Hard"]].map(([key,label])=>(
                  <span key={key}
                    className={"pill " + (genDifficulty===key ? "done" : "todo")}
                    style={{cursor:"pointer"}}
                    onClick={()=>setGenDifficulty(key)}
                  >{label}</span>
                ))}
              </div>

              <div className="learn-footer" style={{gap:10}}>
                <button className="btn btn-ghost" onClick={()=>setGenLesson(null)}>Cancel</button>
                <button className="btn btn-primary" style={{background:quarter.color}} onClick={runGenerateQuestions}>✨ Generate →</button>
              </div>
            </div>
          </div>
        )}
      </React.Fragment>
    );
  }

  /* ---------------- LESSON SCREEN ---------------- */
  function LessonScreen(){
    const subject = currentSubject();
    const quarter = subject.quarters.find(q=>q.id===nav.quarterId);
    const rawLesson = allSubjectLessons(subject, customLessons).find(l=>l.id===nav.lessonId);
    const lesson = mergeLesson(rawLesson, edits);
    const tab = nav.tab || "learn";
    function setTab(t){ setNav(prev => ({...prev, tab:t})); }
    const [editingLesson, setEditingLesson] = useState(!!nav.startEdit);
    const [movingLesson, setMovingLesson] = useState(false);
    const [moveTarget, setMoveTarget] = useState("");
    const [quizCount, setQuizCount] = useState(1);
    const [quizTopics, setQuizTopics] = useState([TOPIC_ALL]);
    const [quizType, setQuizType] = useState(TYPE_ALL);
    const rec = progress.lessons[lesson.id];
    const qBank = getQuestions(lesson.id);
    const otherQuarters = subject.quarters.filter(q=>q.id !== quarter.id);
    const availTopics = bankTopics(qBank);
    const availTopicsWithCounts = availTopics.map(t=>({name:t, count: qBank.filter(q=>normTopic(q.topic)===t).length}));
    const topicFilteredBank = filterByTopics(qBank, quizTopics);
    const filteredBank = filterByType(topicFilteredBank, quizType);

    useEffect(()=>{ setQuizCount(Math.min(10, filteredBank.length) || 1); }, [lesson.id, filteredBank.length]);
    useEffect(()=>{ setQuizType(TYPE_ALL); }, [quizTopics, lesson.id]);

    const activeLessonQuiz = tab==="quiz" && quizSession && quizSession.kind==="lesson" && quizSession.key===lesson.id && !quizSession.finalAnswers;
    const isStories = subject.special === "stories";

    if(isStories){
      return (
        <React.Fragment>
          <div className="backbar">
            <button className="backbtn" onClick={()=>goQuarter(subject.id, quarter.id)}>←</button>
            <div>
              <div className="qnum" style={{color:quarter.color, fontSize:"9.6px"}}>{subject.shortName} · {quarter.title}</div>
              <h1 style={{margin:0, fontSize:"12px"}}>{lesson.title}</h1>
            </div>
          </div>

          <div key="story" className="tab-fade">
            {editingLesson ? (
              <LessonEditForm
                lesson={lesson}
                accent={quarter.color}
                defaultNoteType="story"
                storyMode={true}
                onSave={(data)=>{ saveLessonEdit(lesson.id, data); setEditingLesson(false); }}
                onCancel={()=>setEditingLesson(false)}
              />
            ) : movingLesson ? (
              <div className="journal-page">
                <h3 style={{marginTop:0}}>Move "{lesson.title}" to another shelf</h3>
                <p className="sub">Currently on: {quarter.title}</p>
                <label className="field-label">Move to</label>
                <select className="text-input" value={moveTarget} onChange={e=>setMoveTarget(e.target.value)}>
                  <option value="">Choose a shelf…</option>
                  {otherQuarters.map(q=>(<option key={q.id} value={q.id}>{q.icon} {q.title}</option>))}
                </select>
                <div className="learn-footer" style={{gap:10}}>
                  <button className="btn btn-ghost" onClick={()=>{setMovingLesson(false); setMoveTarget("");}}>Cancel</button>
                  <button className="btn btn-primary" style={{background:quarter.color}} disabled={!moveTarget}
                    onClick={()=>{
                      moveLesson(lesson.id, moveTarget);
                      setMovingLesson(false);
                      goQuarter(subject.id, moveTarget);
                    }}>↔ Move Story</button>
                </div>
              </div>
            ) : (
              <div className="journal-page learn-page">
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10, flexWrap:"wrap"}}>
                  <h3 style={{marginTop:0}}>{lesson.title}{lesson.sub ? " — " + lesson.sub : ""}</h3>
                  <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setEditingLesson(true)}>✏️ Edit Story</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setMovingLesson(true)}>↔ Move Shelf</button>
                    {rawLesson.isCustom && (
                      <button
                        className="btn btn-ghost btn-sm"
                        onClick={()=>{
                          if(window.confirm('Delete the story "' + lesson.title + '"?')){
                            removeCustomTopic(lesson.id);
                            goQuarter(subject.id, quarter.id);
                          }
                        }}
                      >🗑 Delete Story</button>
                    )}
                  </div>
                </div>
                {rawLesson.homeQuarterId !== quarter.id && (
                  <p className="sub">📦 Originally on {subject.quarters.find(q=>q.id===rawLesson.homeQuarterId).title}, moved to {quarter.title}.</p>
                )}
                {(()=>{
                  const notes = getLessonNotes(lesson);
                  if(!notes.length){
                    return <p className="sub">This story doesn't have any text yet — tap "✏️ Edit Story" to paste or write it in.</p>;
                  }
                  return (
                    <div className="learn-notes-col">
                      {notes.map((note, i)=>(
                        note.type === "story" ? (
                          <StoryCard key={note.id || i} note={note} index={i+1} />
                        ) : (
                          <div className="note-view" key={note.id || i} dangerouslySetInnerHTML={{__html: note.html}}></div>
                        )
                      ))}
                    </div>
                  );
                })()}
                <div className="learn-footer" style={{gap:8, flexWrap:"wrap"}}>
                  <button className="btn btn-primary" style={{background:quarter.color}} onClick={()=>markLearned(lesson.id)}>
                    {rec && rec.learned ? "✅ Marked as Read" : "Mark as Read"}
                  </button>
                </div>
              </div>
            )}
          </div>
        </React.Fragment>
      );
    }

    return (
      <React.Fragment>
        <div className="backbar">
          <button className="backbtn" onClick={()=>goQuarter(subject.id, quarter.id)}>←</button>
          <div>
            <div className="qnum" style={{color:quarter.color, fontSize:"9.6px"}}>{rawLesson.chapterTitle}</div>
            <h1 style={{margin:0, fontSize:"12px"}}>{lesson.title}</h1>
          </div>
        </div>

        <div className="tabbar">
          <button className={"tab" + (tab==="learn" ? " active":"")} onClick={()=>{setTab("learn"); setEditingLesson(false);}}>📖 Learn</button>
          <button className={"tab" + (tab==="quiz" ? " active":"")} onClick={()=>setTab("quiz")}>📝 Quiz{rec && rec.best ? " (" + rec.best.correct + "/" + rec.best.total + ")" : ""}</button>
          {activeLessonQuiz && (
            <button
              className="btn btn-ghost btn-sm"
              title="Stop this quiz"
              onClick={()=>{
                if(window.confirm("Stop this quiz? Your progress on this attempt won't be saved.")){
                  Sound.back();
                  setQuizSession(null);
                }
              }}
            >✕ Stop Quiz</button>
          )}
          <button className={"tab" + (tab==="manage" ? " active":"")} onClick={()=>setTab("manage")}>🗂️ Questions{qBank.length ? " (" + qBank.length + ")" : ""}</button>
        </div>

        <div key={tab} className="tab-fade">
        {tab === "learn" && (
          editingLesson ? (
            <LessonEditForm
              lesson={lesson}
              accent={quarter.color}
              onSave={(data)=>{ saveLessonEdit(lesson.id, data); setEditingLesson(false); }}
              onCancel={()=>setEditingLesson(false)}
            />
          ) : movingLesson ? (
            <div className="journal-page">
              <h3 style={{marginTop:0}}>Move "{lesson.title}" to another quarter</h3>
              <p className="sub">Currently in: {quarter.num} — {quarter.title}</p>
              <label className="field-label">Move to</label>
              <select className="text-input" value={moveTarget} onChange={e=>setMoveTarget(e.target.value)}>
                <option value="">Choose a quarter…</option>
                {otherQuarters.map(q=>(<option key={q.id} value={q.id}>{q.num} — {q.title}</option>))}
              </select>
              <div className="learn-footer" style={{gap:10}}>
                <button className="btn btn-ghost" onClick={()=>{setMovingLesson(false); setMoveTarget("");}}>Cancel</button>
                <button className="btn btn-primary" style={{background:quarter.color}} disabled={!moveTarget}
                  onClick={()=>{
                    moveLesson(lesson.id, moveTarget);
                    setMovingLesson(false);
                    goQuarter(subject.id, moveTarget);
                  }}>↔ Move Topic</button>
              </div>
            </div>
          ) : (
            <div className="journal-page learn-page">
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10, flexWrap:"wrap"}}>
                <h3 style={{marginTop:0}}>{lesson.title}{lesson.sub ? " — " + lesson.sub : ""}</h3>
                <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setEditingLesson(true)}>✏️ Edit Topic</button>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setMovingLesson(true)}>↔ Move Quarter</button>
                  {rawLesson.isCustom && (
                    <button
                      className="btn btn-ghost btn-sm"
                      onClick={()=>{
                        if(window.confirm('Delete the topic "' + lesson.title + '"? This removes its notes and question bank too.')){
                          removeCustomTopic(lesson.id);
                          goQuarter(subject.id, quarter.id);
                        }
                      }}
                    >🗑 Delete Topic</button>
                  )}
                </div>
              </div>
              {rawLesson.homeQuarterId !== quarter.id && (
                <p className="sub">📦 Originally in {subject.quarters.find(q=>q.id===rawLesson.homeQuarterId).num}, moved to {quarter.num}.</p>
              )}
              {(()=>{
                // On desktop, video(s) and notes sit side by side (video sticky) instead of
                // stacking full-width one after another — keeps the Learn tab from turning
                // into one very long scroll on a wide screen, while mobile keeps the simple
                // stacked order.
                const videoIds = getLessonVideos(lesson).map(youtubeEmbedId).filter(Boolean);
                const notes = getLessonNotes(lesson);
                const multiple = notes.length > 1;
                const videoBlock = videoIds.length > 0 ? (
                  <div className="learn-video-col">
                    {videoIds.map((vid, i)=>(
                      <div className="video-embed" key={i}>
                        <iframe
                          src={"https://www.youtube.com/embed/" + vid}
                          title={lesson.title + " video " + (i+1)}
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                          allowFullScreen
                        ></iframe>
                      </div>
                    ))}
                  </div>
                ) : null;
                const notesBlock = (
                  <div className="learn-notes-col">
                    {notes.map((note, i)=>(
                      note.type === "story" ? (
                        <StoryCard key={note.id || i} note={note} index={i+1} />
                      ) : multiple ? (
                        <div className="note-card" key={note.id || i}>
                          <div className="note-card-head">📝 {note.name && note.name.trim() ? note.name.trim() : "Note " + (i+1)}</div>
                          <div className="note-view" dangerouslySetInnerHTML={{__html: note.html}}></div>
                        </div>
                      ) : (
                        <div className="note-view" key={note.id || i} dangerouslySetInnerHTML={{__html: note.html}}></div>
                      )
                    ))}
                  </div>
                );
                return videoBlock ? (
                  <div className="learn-layout">{videoBlock}{notesBlock}</div>
                ) : notesBlock;
              })()}
              <div className="learn-footer" style={{gap:8, flexWrap:"wrap"}}>
                <button className="btn btn-primary" style={{background:quarter.color}} onClick={()=>{markLearned(lesson.id); setTab("quiz");}}>
                  {rec && rec.learned ? "Reviewed — Take Quiz →" : "Mark as Learned & Take Quiz →"}
                </button>
              </div>
            </div>
          )
        )}

        {tab === "quiz" && (
          quizSession && quizSession.kind==="lesson" && quizSession.key===lesson.id ? (
            quizSession.finalAnswers ? (
              <ResultsView
                answers={quizSession.finalAnswers}
                accent={quarter.color}
                title={lesson.title}
                onRetry={()=>startLessonQuiz(quarter, lesson, quizCount, quizTopics, quizType)}
                onDone={()=>{setQuizSession(null);}}
              />
            ) : (
              <QuizRunner
                questions={quizSession.questions}
                accent={quarter.color}
                onFinish={handleQuizFinish}
                onStop={()=>{setQuizSession(null);}}
                showStopInline={false}
              />
            )
          ) : (
            <div className="quiz-card" style={{textAlign:"center"}}>
              {qBank.length === 0 ? (
                <React.Fragment>
                  <p style={{marginTop:0}}>No questions yet for <strong>{lesson.title}</strong>.</p>
                  <button className="btn btn-primary" style={{background:quarter.color}} onClick={()=>setTab("manage")}>➕ Add Questions</button>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <p style={{marginTop:0}}>Ready to test what you learned about <strong>{lesson.title}</strong>?</p>
                  {availTopics.length > 0 && (
                    <React.Fragment>
                      <label className="field-label">Which topic(s)?</label>
                      <div style={{maxWidth:320, margin:"0 auto 14px"}}>
                        <TopicPicker
                          topics={availTopicsWithCounts}
                          totalCount={qBank.length}
                          selected={quizTopics}
                          onToggle={(t)=>toggleTopicSelection(quizTopics, t, setQuizTopics)}
                        />
                      </div>
                    </React.Fragment>
                  )}
                  <label className="field-label">Question type?</label>
                  <div style={{maxWidth:320, margin:"0 auto 14px"}}>
                    <QuizTypePicker pool={topicFilteredBank} selected={quizType} onSelect={setQuizType} />
                  </div>
                  {filteredBank.length === 0 ? (
                    <p className="sub">No questions of this type for this topic yet.</p>
                  ) : (
                    <React.Fragment>
                      <label className="field-label">How many questions would you like to take? (1–{filteredBank.length})</label>
                      <input type="number" className="text-input" style={{maxWidth:120, margin:"0 auto 14px"}} min={1} max={filteredBank.length} value={quizCount}
                        onChange={e=>{
                          const raw = e.target.value;
                          if(raw === ""){ setQuizCount(""); return; }
                          const v = parseInt(raw,10);
                          if(Number.isNaN(v)) return;
                          setQuizCount(Math.max(1, Math.min(v, filteredBank.length)));
                        }}
                        onBlur={()=>{
                          if(quizCount === "" || Number.isNaN(quizCount)) setQuizCount(1);
                        }} />
                      <div>
                        <button className="btn btn-primary" style={{background:quarter.color}} onClick={()=>startLessonQuiz(quarter, lesson, quizCount, quizTopics, quizType)}>
                          {rec && rec.best ? "Retake Quiz" : "Start Quiz"}
                        </button>
                      </div>
                    </React.Fragment>
                  )}
                </React.Fragment>
              )}
            </div>
          )
        )}

        {tab === "manage" && (
          <QuestionBankManager
            lessonId={lesson.id}
            questions={qBank}
            accent={quarter.color}
            onChange={(next)=>setLessonQuestions(lesson.id, next)}
          />
        )}
        </div>
      </React.Fragment>
    );
  }

  /* ---------------- LONG QUIZ SCREEN (uses quizSession set at quarter level) ---------------- */
  function LongQuizScreen(){
    const subject = currentSubject();
    const quarter = subject.quarters.find(q=>q.id===nav.quarterId);
    return (
      <React.Fragment>
        <div className="backbar">
          <button className="backbtn" onClick={()=>goQuarter(subject.id, quarter.id)}>←</button>
          <div>
            <div className="qnum" style={{color:quarter.color}}>{subject.shortName} · {quarter.num} · Long Quiz</div>
            <h1 style={{margin:0, fontSize:"20px"}}>🏆 {quarter.title}</h1>
          </div>
        </div>
        {quizSession.finalAnswers ? (
          <ResultsView
            answers={quizSession.finalAnswers}
            accent={quarter.color}
            title={quarter.title + " Long Quiz"}
            onRetry={()=>startLongQuiz(quarter)}
            onDone={()=>{setQuizSession(null); goQuarter(subject.id, quarter.id);}}
          />
        ) : (
          <QuizRunner
            questions={quizSession.questions}
            accent={quarter.color}
            onFinish={handleQuizFinish}
            onStop={()=>{setQuizSession(null); goQuarter(subject.id, quarter.id);}}
          />
        )}
      </React.Fragment>
    );
  }

  let content;
  if(quizSession && quizSession.kind==="long"){
    content = <LongQuizScreen/>;
  } else if(nav.screen==="quarter"){
    content = <QuarterScreen/>;
  } else if(nav.screen==="lesson"){
    content = <LessonScreen/>;
  } else if(nav.screen==="home"){
    content = <SubjectHomeScreen/>;
  } else if(nav.screen==="general"){
    content = <GeneralScreen/>;
  } else if(nav.screen==="notes"){
    content = <NotesScreen/>;
  } else if(nav.screen==="typing"){
    content = <TypingGalaxyScreen/>;
  } else if(nav.screen==="grades"){
    content = <GradesScreen
      grades={grades} gradeConfig={gradeConfig}
      gradesOpenSubject={gradesOpenSubject} setGradesOpenSubject={setGradesOpenSubject}
      gradesSelectedQuarter={gradesSelectedQuarter} setGradesSelectedQuarter={setGradesSelectedQuarter}
      goDashboard={goDashboard}
      setGradeEntry={setGradeEntry} addGradeItem={addGradeItem} removeGradeItem={removeGradeItem} updateGradeItem={updateGradeItem}
      adjustSubjectFinal={adjustSubjectFinal} setSubjectWeight={setSubjectWeight} setHonorThreshold={setHonorThreshold} resetGradeConfig={resetGradeConfig}
      clearGradeFinalOverride={clearGradeFinalOverride}
    />;
  } else if(nav.screen==="subjects"){
    content = <SubjectsScreen/>;
  } else {
    content = <DashboardScreen/>;
  }

  const headerIcon = nav.subjectId ? (currentSubject() ? currentSubject().icon : "🎓") : "🎓";
  const headerLabel = nav.subjectId && currentSubject() ? currentSubject().name : "Grade 4";
  const headerBg = nav.subjectId && currentSubject() ? currentSubject().color : "linear-gradient(150deg, var(--night), var(--night-deep))";
  const screenKey = (quizSession && quizSession.kind==="long" ? "longquiz-"+quizSession.key : nav.screen) + "-" + (nav.subjectId||"") + "-" + (nav.quarterId||"") + "-" + (nav.lessonId||"");

  const headerBar = (
    <div className={"app-header" + (nav.subjectId ? " app-header-footer" : "")}>
      <div className="brand" onClick={goDashboard} style={{cursor:"pointer"}}>
        <div className="brand-badge" style={{background:headerBg}}><SubjectIcon icon={headerIcon}/></div>
        <div className="brand-text">
          <div className="eyebrow">Sacred Heart Academy of Pasig</div>
          <h1>{headerLabel}</h1>
        </div>
      </div>
      <div className="header-actions">
        {settings.darkMode && nav.screen!=="typing" && (
          <button
            className="settings-btn"
            title="Turn off dark mode"
            onClick={()=>updateSettings({darkMode: false})}
          >☀️</button>
        )}
        <button
          className="settings-btn"
          title={settings.soundEnabled !== false ? "Mute sound" : "Unmute sound"}
          onClick={()=>{
            const next = settings.soundEnabled === false;
            updateSettings({soundEnabled: next});
            if(next) setTimeout(()=>Sound.tap(), 30);
          }}
        >{settings.soundEnabled !== false ? "🔊" : "🔇"}</button>
        <button className="settings-btn" title="Grades" onClick={goGrades}>🎓</button>
        <button className="settings-btn" title="Save everything now" onClick={saveEverythingNow}>💾</button>
        <button className="settings-btn" title="Export all data as JSON (progress, topics, quiz bank & offline audio cache)" onClick={exportAllData}>⬇️</button>
        <button className="settings-btn" title="Import data from JSON backup (progress, topics, quiz bank & offline audio cache)" onClick={()=>importInputRef.current && importInputRef.current.click()}>⬆️</button>
        <input
          ref={importInputRef}
          type="file"
          accept="application/json,.json"
          style={{display:"none"}}
          onChange={(e)=>{
            const file = e.target.files && e.target.files[0];
            if(file) importAllData(file);
            e.target.value = "";
          }}
        />
      </div>
    </div>
  );

  return (
    <React.Fragment>
      {settings.darkMode && <Starfield/>}
      {!nav.subjectId && headerBar}
      {saveFlash && <div className="save-toast">{saveFlash}</div>}
      <div key={screenKey} className="screen-enter">{content}</div>
      {nav.subjectId && headerBar}
    </React.Fragment>
  );
}

/* =========================================================
   STARTUP — mount instantly from whatever's in localStorage,
   then hydrate from Firebase in the background so other-device
   progress still shows up, without blocking first paint.
   ========================================================= */
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
loadFromCloud().then(cloudSynced => {
  if(cloudSynced) window.dispatchEvent(new Event("gs4-cloud-synced"));
});
</script>
</body>
</html>
