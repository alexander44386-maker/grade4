oin ships  -> 'explode' : instantly clears every invader\n  //                       on screen.\n  //   500-coin ship   -> 'nova'    : freezes AND explodes everything\n  //                       for double bonus score, then grants a few\n  //                       seconds of shield \u2014 strictly better than\n  //                       freeze or explode alone.\n  // ============================================================\n  function chargeShipPower(){\n    const def = CHAR_DEFS[selectedChar];\n    if(!def || !def.power) return;\n    powerCharges += 1;\n    updatePowerBadge();\n    showToast('\u26a1 Power Ready! Press SPACE');\n    speak('Power ready!');\n  }\n\n  function triggerShipPower(){\n    const def = CHAR_DEFS[selectedChar];\n    if(!def || !def.power) return;\n    if(powerCharges <= 0) return;\n    powerCharges -= 1;\n    updatePowerBadge();\n    if(def.power === 'freeze') triggerFreezePower();\n    else if(def.power === 'slow') triggerSlowPower();\n    else if(def.power === 'explode') triggerExplodePower();\n    else if(def.power === 'nova') triggerNovaPower();\n  }\n\n  // Small floating badge over the cannon showing banked charges, so the\n  // player can see at a glance whether a power is ready to use.\n  let powerBadgeEl = null;\n  function updatePowerBadge(){\n    if(!powerBadgeEl){\n      powerBadgeEl = document.createElement('div');\n      powerBadgeEl.id = 'power-badge-sp';\n      powerBadgeEl.style.cssText = 'position:absolute; bottom:30px; left:calc(50% + 30px); z-index:6; font-family:\"Baloo 2\", sans-serif; font-weight:800; font-size:10px; color:#0B1740; background:linear-gradient(135deg,#FFE58A,#FFD23F); padding:2px 6px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.35); pointer-events:none; transition:opacity 0.15s ease; opacity:0; white-space:nowrap;';\n      game.appendChild(powerBadgeEl);\n    }\n    if(powerCharges > 0){\n      powerBadgeEl.textContent = '\u26a1' + powerCharges;\n      powerBadgeEl.style.opacity = '1';\n    } else {\n      powerBadgeEl.style.opacity = '0';\n    }\n  }\n\n  let streakBadgeEl = null;\n  function updateStreakBadge(){\n    const def = CHAR_DEFS[selectedChar];\n    if(!def || !def.power){\n      if(streakBadgeEl) streakBadgeEl.style.opacity = '0';\n      return;\n    }\n    if(!streakBadgeEl){\n      streakBadgeEl = document.createElement('div');\n      streakBadgeEl.id = 'streak-badge-sp';\n      streakBadgeEl.style.cssText = 'position:absolute; bottom:10px; left:calc(50% + 30px); z-index:6; font-family:\"Baloo 2\", sans-serif; font-weight:700; font-size:9px; color:#EAF4FF; background:rgba(20,28,64,0.65); padding:1px 6px; border-radius:7px; pointer-events:none; transition:opacity 0.15s ease; opacity:0; white-space:nowrap;';\n      game.appendChild(streakBadgeEl);\n    }\n    const prog = streak % 10;\n    streakBadgeEl.textContent = prog + '/10';\n    streakBadgeEl.style.opacity = (running && !paused) ? '1' : '0';\n  }\n\n  function showPowerOverlay(tint){\n    const ov = document.createElement('div');\n    ov.className = 'power-screen-overlay';\n    ov.id = 'power-overlay-sp';\n    ov.style.cssText = `position:absolute;inset:0;pointer-events:none;z-index:8;background:${tint};transition:opacity 0.25s ease;opacity:0;`;\n    game.appendChild(ov);\n    requestAnimationFrame(()=>{ ov.style.opacity = '1'; });\n    return ov;\n  }\n  function hidePowerOverlay(){\n    const ov = document.getElementById('power-overlay-sp');\n    if(!ov) return;\n    ov.style.opacity = '0';\n    setTimeout(()=>ov.remove(), 300);\n  }\n\n  function freezeInvadersVisual(on, glow){\n    invaders.forEach(c=>{\n      c.el.style.filter = on ? `drop-shadow(0 0 12px ${glow}) brightness(1.2)` : '';\n      c.el.style.animationPlayState = on ? 'paused' : '';\n      c.el.style.outline = on ? `2px solid ${glow}` : '';\n    });\n  }\n\n  const FREEZE_MS = 3200;\n  function triggerFreezePower(){\n    if(freezeActive) return;\n    freezeActive = true;\n    clearTimeout(spawnTimer);\n    freezeInvadersVisual(true, '#A8E8FF');\n    showPowerOverlay('radial-gradient(circle, rgba(123,232,255,0.20), rgba(46,159,214,0.30))');\n    showToast('\u2744\ufe0f Freeze Blast!');\n    speak('Freeze Blast!');\n    setTimeout(()=>{\n      freezeActive = false;\n      freezeInvadersVisual(false);\n      hidePowerOverlay();\n      if(running && !paused) scheduleSpawn();\n    }, FREEZE_MS);\n  }\n\n  // ---- Slow Field (200-coin ships): slows every invader on screen by 70%\n  // for ~8s, instead of fully freezing them. Spawning keeps going as normal,\n  // but any invader that spawns while Slow Field is active also comes in at\n  // the reduced speed (see spawnInvader's slowActive check below).\n  const SLOW_MS = 8000;\n  const SLOW_FACTOR = 0.3; // 70% slower\n  function triggerSlowPower(){\n    if(slowActive) return;\n    slowActive = true;\n    invaders.forEach(c=>{\n      c._preSlowSpeed = c.speed;\n      c.speed = c.speed * SLOW_FACTOR;\n    });\n    showPowerOverlay('radial-gradient(circle, rgba(46,217,195,0.20), rgba(28,168,143,0.28))');\n    showToast('\ud83d\udc0c Slow Field!');\n    speak('Slow Field!');\n    setTimeout(()=>{\n      slowActive = false;\n      invaders.forEach(c=>{\n        if(typeof c._preSlowSpeed === 'number'){\n          c.speed = c._preSlowSpeed;\n          delete c._preSlowSpeed;\n        }\n      });\n      hidePowerOverlay();\n    }, SLOW_MS);\n  }\n\n  // Pops every invader currently on screen with a bonus-scored explosion,\n  // exactly like a normal hit but for the whole field at once.\n  function explodeAllInvaders(bonusPerInvader){\n    const toExplode = invaders.slice();\n    toExplode.forEach(c=>{\n      const rect = c.el.getBoundingClientRect();\n      const gameRect = game.getBoundingClientRect();\n      const cx = rect.left - gameRect.left + rect.width/2;\n      const cy = rect.top - gameRect.top + rect.height/2;\n      burstExplosion(cx, cy, c.color);\n      c.el.classList.add('pop');\n      setTimeout(()=>c.el.remove(), 280);\n      score += bonusPerInvader + level*2;\n    });\n    invaders = [];\n    scoreVal.textContent = score;\n    playZap(700);\n    highlightTargets();\n  }\n\n  function triggerExplodePower(){\n    showToast('\ud83d\udca5 Meteor Bomb!');\n    speak('Meteor Bomb!');\n    explodeAllInvaders(8);\n  }\n\n  const NOVA_FREEZE_MS = 1300;\n  const NOVA_SHIELD_MS = 6000;\n  function triggerNovaPower(){\n    if(freezeActive) return;\n    freezeActive = true;\n    clearTimeout(spawnTimer);\n    freezeInvadersVisual(true, '#B84DFF');\n    showPowerOverlay('radial-gradient(circle, rgba(184,77,255,0.25), rgba(77,232,255,0.28))');\n    showToast('\ud83c\udf1f NOVA BLAST!');\n    speak('Nova blast!');\n    setTimeout(()=>{\n      freezeActive = false;\n      freezeInvadersVisual(false);\n      hidePowerOverlay();\n      explodeAllInvaders(16); // double the plain explode bonus\n      shieldActive = true;\n      showToast('\ud83d\udee1\ufe0f Shield up!');\n      setTimeout(()=>{ shieldActive = false; }, NOVA_SHIELD_MS);\n      if(running && !paused) scheduleSpawn();\n    }, NOVA_FREEZE_MS);\n  }\n\n  function spawnInvader(){\n    if(!running || paused) return;\n    const cfg = LEVELS[level];\n    const diff = DIFFICULTIES[difficulty];\n    // Level 16+ (level index 15+) switches to the armored \"elite\" invader\n    // look so the visuals step up alongside the difficulty.\n    const isElite = level >= 15;\n    const typePool = isElite ? ELITE_ITYPES : ITYPES;\n    const type = typePool[Math.floor(Math.random()*typePool.length)];\n\n    // Level 13+ (level index 12+) introduces two special invader kinds:\n    // zigzag (weaves side to side) and shielded (needs two letters typed\n    // in sequence to pop).\n    // Level 26+ (level index 25+) steps this up further: every invader\n    // becomes a \"word invader\" \u2014 a real short word typed letter by letter,\n    // reusing the same sequential mechanic as shielded \u2014 and every one of\n    // them zigzags. Level 31+ (level index 30+) bumps the word length from\n    // 2 letters to 3.\n    const isWordLevel = level >= 25;\n    const wordLen = level >= 30 ? 3 : 2;\n    const canSpecial = level >= 12 && !isWordLevel;\n    const specialRoll = canSpecial ? Math.random() : 1;\n    const isZigzag = isWordLevel ? true : (canSpecial && specialRoll < 0.16);\n    const isShielded = isWordLevel ? true : (canSpecial && !isZigzag && specialRoll < 0.28);\n\n    const el = document.createElement('div');\n    el.className = 'invader ' + type.key + '-type' + (isElite ? ' elite' : '') + (isShielded ? ' shielded' : '') + (isZigzag ? ' zigzag' : '');\n    el.style.color = type.color;\n    el.style.background = `radial-gradient(circle at 32% 30%, #ffffff44, transparent 45%), ${type.color}`;\n    el.style.boxShadow = `0 0 14px ${type.color}, inset 0 -6px 10px rgba(0,0,0,0.25)`;\n\n    const gw = game.clientWidth;\n    const x = 30 + Math.random()*(Math.max(gw-100,40));\n    el.style.left = x+'px';\n    el.style.top = '-70px';\n\n    const eye = document.createElement('div'); eye.className='eye-single';\n    const pup = document.createElement('div'); pup.className='pupil-single';\n    const letterTxt = document.createElement('span'); letterTxt.className='letter-txt';\n\n    let letter = null, letters = null;\n    if(isShielded){\n      if(isWordLevel){\n        letters = pickWordInvaderWord(cfg.letters, wordLen).split('');\n      } else {\n        const first = weightedPickLetter(cfg.letters);\n        let second = weightedPickLetter(cfg.letters);\n        if(second === first && cfg.letters.length > 1){\n          do { second = cfg.letters[Math.floor(Math.random()*cfg.letters.length)]; } while(second === first);\n        }\n        letters = [first, second];\n      }\n      letterTxt.innerHTML = letters.map((ch,i)=> '<span class=\"shield-l' + (i===0?' active':'') + '\">' + (ch===';'?';':ch.toUpperCase()) + '</span>').join('');\n    } else {\n      letter = weightedPickLetter(cfg.letters);\n      letterTxt.textContent = letter===';' ? ';' : letter.toUpperCase();\n    }\n\n    eye.appendChild(pup);\n    el.appendChild(eye); el.appendChild(letterTxt);\n    buildInvaderFeature(el, type);\n    if(isShielded){\n      const shieldIcon = document.createElement('div');\n      shieldIcon.className = 'shield-icon';\n      shieldIcon.textContent = '\ud83d\udee1\ufe0f';\n      el.appendChild(shieldIcon);\n    }\n    game.appendChild(el);\n\n    const c = {\n      id: idCounter++,\n      letter, letters, shielded: isShielded, shieldIndex: 0,\n      moveType: isZigzag ? 'zigzag' : 'straight',\n      zigAmp: 26 + Math.random()*22,\n      zigSeed: Math.random()*Math.PI*2,\n      zigTime: 0,\n      el, x, baseX: x, y:-70,\n      revealed: false,\n      spawnTime: performance.now(),\n      speed: cfg.speed * (0.85 + Math.random()*0.4) * diff.speedMult * (isZigzag ? 0.85 : 1) * (isShielded ? 0.8 : 1) * (slowActive ? SLOW_FACTOR : 1),\n      color: type.color,\n      typeKey: type.key\n    };\n    invaders.push(c);\n    highlightTargets();\n  }\n\n  function scheduleSpawn(){\n    clearTimeout(spawnTimer);\n    if(!running || paused) return;\n    const diff = DIFFICULTIES[difficulty];\n    spawnTimer = setTimeout(()=>{\n      spawnInvader();\n      scheduleSpawn();\n    }, LEVELS[level].spawnMs * diff.spawnMult);\n  }\n\n  function loop(){\n    if(!running){ return; }\n    // Frozen invaders hold their position (so the player can safely type\n    // every one of them) \u2014 skip all movement/landing checks while active.\n    if(!paused && !freezeActive){\n      const groundY = game.clientHeight - 70;\n      const gw = game.clientWidth;\n      let justRevealed = false;\n      invaders.forEach(c=>{\n        if(c.popping || c.missed) return;\n        c.y += c.speed;\n        c.el.style.top = c.y+'px';\n        if(!c.revealed && c.y >= 0){\n          // Invader just crossed into the visible game area \u2014 this is the\n          // moment its key hint should actually light up, not the instant\n          // it spawned off-screen above the top edge.\n          c.revealed = true;\n          justRevealed = true;\n        }\n        if(c.moveType === 'zigzag'){\n          c.zigTime += 1;\n          const wobble = Math.sin(c.zigTime * 0.06 + c.zigSeed) * c.zigAmp;\n          const nx = Math.max(6, Math.min(gw-66, c.baseX + wobble));\n          c.x = nx;\n          c.el.style.left = nx+'px';\n        }\n        if(c.y >= groundY){\n          c.missed = true;\n          c.el.classList.add('miss');\n          streak = 0;\n          streakVal.textContent = streak;\n          updateStreakBadge();\n          updateShipGlow();\n          const missLetter = c.shielded ? c.letters[c.shieldIndex] : c.letter;\n          recordLetterOutcome(missLetter, false);\n          if(!shieldActive) loseHeart();\n          setTimeout(()=>{ c.el.remove(); }, 500);\n        }\n      });\n      invaders = invaders.filter(c=>!c.missed);\n      if(justRevealed) highlightTargets();\n    }\n    rafId = requestAnimationFrame(loop);\n  }\n\n  function handleLetter(ch){\n    if(!running || paused) return;\n    ensureAudio();\n    let target = null;\n    invaders.forEach(c=>{\n      const want = c.shielded ? c.letters[c.shieldIndex] : c.letter;\n      if(want === ch && !c.popping && !c.missed){\n        if(!target || c.y > target.y) target = c;\n      }\n    });\n    if(target){\n      flashKeyPress(ch);\n\n      if(target.shielded && target.shieldIndex < target.letters.length - 1){\n        // Partial hit on a shielded invader: advance its pointer, give a\n        // little feedback and score, but don't pop it yet.\n        target.shieldIndex += 1;\n        const spans = target.el.querySelectorAll('.shield-l');\n        spans.forEach((s,i)=>{\n          s.classList.toggle('active', i===target.shieldIndex);\n          s.classList.toggle('done', i<target.shieldIndex);\n        });\n        recordLetterOutcome(ch, true);\n        playZap(520 + target.shieldIndex*90);\n        score += 4;\n        scoreVal.textContent = score;\n        highlightTargets();\n        return;\n      }\n\n      target.popping = true;\n      const reactionMs = performance.now() - target.spawnTime;\n      recordLetterOutcome(ch, true, reactionMs);\n\n      const rect = target.el.getBoundingClientRect();\n      const gameRect = game.getBoundingClientRect();\n      const cx = rect.left - gameRect.left + rect.width/2;\n      const cy = rect.top - gameRect.top + rect.height/2;\n\n      const prevTier = getComboTierIndex(streak);\n      streak += 1;\n      const newTier = getComboTierIndex(streak);\n      const multiplier = COMBO_TIERS[newTier].mult;\n\n      if(newTier >= 2) spawnShipTrail();\n      moveCannonTo(cx);\n      fireLaser(cx, cy, target.color);\n      burstExplosion(cx, cy, target.color);\n      playZap(380 + level*25 + toneForType(target.typeKey) + Math.min(140, streak*4));\n      target.el.classList.add('pop');\n      setTimeout(()=>target.el.remove(), 280);\n      invaders = invaders.filter(c=>c.id!==target.id);\n\n      const base = 10 + level*2 + (target.shielded ? 8 : 0);\n      score += Math.round(base * multiplier);\n      popsThisLevel += 1;\n      scoreVal.textContent = score;\n      streakVal.textContent = streak;\n      updateStreakBadge();\n      updateShipGlow();\n      speakSuccess(streak);\n\n      if(newTier > prevTier){\n        const bonusCoins = newTier * 2;\n        if(bonusCoins > 0){\n          addCoins(bonusCoins);\n          updateCoinBadge();\n          showToast('\u2b50 Combo x' + multiplier + '! +' + bonusCoins + ' Coins');\n          punchScore();\n          screenShake(game, 'light');\n        }\n      }\n\n      if(streak>0 && streak % 10 === 0){\n        showToast(ENCOURAGEMENTS[Math.floor(Math.random()*ENCOURAGEMENTS.length)]);\n        chargeShipPower();\n      }\n\n      if(popsThisLevel >= LEVELS[level].popsToLevel && level < LEVELS.length-1){\n        const levelStats = { lettersTyped: popsThisLevel, accuracy: calcAccuracy(popsThisLevel, missesThisLevel) };\n        level += 1;\n        popsThisLevel = 0;\n        missesThisLevel = 0;\n        levelVal.textContent = level+1;\n        if(bestVal) bestVal.textContent = saveBestLevel(level+1);\n        refreshKeyboardLocks();\n        clearTimeout(spawnTimer);\n        paused = true;\n        showLevelPopup(game, level+1, levelStats, ()=>{\n          if((level+1) % 5 === 0){\n            invaders.forEach(c=>c.el.remove());\n            invaders = [];\n            runBoss((level+1)/5, ()=>{\n              paused = false;\n              scheduleSpawn();\n            });\n          } else {\n            paused = false;\n            scheduleSpawn();\n          }\n        });\n      }\n      highlightTargets();\n    } else {\n      // Typing a wrong letter breaks the streak-of-10 needed to charge a\n      // ship power, so mistypes actually cost the player something instead\n      // of being free to spam.\n      missesThisLevel += 1;\n      flashKeyPress(ch);\n      if(streak > 0){\n        streak = 0;\n        streakVal.textContent = streak;\n        updateStreakBadge();\n        updateShipGlow();\n      }\n    }\n  }\n\n  document.addEventListener('keydown', (e)=>{\n    if(!running || paused) return;\n    let ch = e.key.toLowerCase();\n    if(ch === ' '){\n      e.preventDefault();\n      triggerShipPower();\n      return;\n    }\n    if(ch.length !== 1) return;\n    if(!/^[a-z0-9,.;]$/.test(ch)) return;\n    handleLetter(ch);\n  });\n\n  Object.keys(keyEls).forEach(ch=>{\n    keyEls[ch].addEventListener('click', ()=>{\n      if(keyEls[ch].classList.contains('locked')) return;\n      handleLetter(ch);\n    });\n  });\n\n  function renderHearts(justLostIdx){\n    heartsVal.innerHTML = '';\n    for(let i=0;i<MAX_HEARTS;i++){\n      const span = document.createElement('span');\n      const lost = i >= hearts;\n      span.className = 'heart-icon' + (lost ? ' lost' : '') + (i===justLostIdx ? ' just-lost' : '');\n      span.textContent = lost ? '\ud83d\udda4' : '\u2764\ufe0f';\n      heartsVal.appendChild(span);\n    }\n  }\n  function loseHeart(){\n    if(hearts <= 0) return;\n    hearts -= 1;\n    renderHearts(hearts);\n    if(hearts <= 0){\n      triggerGameOver();\n    }\n  }\n  function triggerGameOver(){\n    if(!running) return;\n    running = false;\n    paused = true;\n    freezeActive = false;\n    shieldActive = false;\n    slowActive = false;\n    hidePowerOverlay();\n    powerCharges = 0;\n    updatePowerBadge();\n    if(streakBadgeEl) streakBadgeEl.style.opacity = '0';\n    clearTimeout(spawnTimer);\n    invaders.forEach(c=>c.el.remove());\n    invaders = [];\n    view.classList.remove('playing');\n    const levelReached = level + 1;\n    const overlay = document.createElement('div');\n    overlay.className = 'boss-overlay';\n    overlay.innerHTML =\n      '<div class=\"boss-intro\">GAME OVER</div>' +\n      '<div class=\"boss-figure\">\ud83d\udca5</div>' +\n      '<div class=\"boss-hint\">Out of hearts! You reached level ' + levelReached + '.</div>';\n    game.appendChild(overlay);\n    speak('Game over!');\n    setTimeout(()=>{\n      overlay.classList.add('leaving');\n      setTimeout(()=>{\n        overlay.remove();\n        showEndOfGameCoins(game, difficulty, levelReached, ()=>{\n          showKeyReport(game, ()=>{\n            if(keyboardWrap) keyboardWrap.style.display = 'none'; intro.style.display = 'flex';\n          });\n        });\n      }, 350);\n    }, 1300);\n  }\n  // Runs (and, on a boss-timeout heart loss, re-runs) a boss fight for the\n  // given boss number until it's defeated or the player is out of hearts.\n  function runBoss(bossNumber, onAllDone){\n    function attempt(){\n      startBossFight(game, bossNumber, LEVELS[level].letters, difficulty, onAllDone, ()=>{\n        loseHeart();\n        if(hearts > 0) attempt();\n      });\n    }\n    attempt();\n  }\n\n  function quitGame(){\n    running = false;\n    paused = false;\n    freezeActive = false;\n    shieldActive = false;\n    slowActive = false;\n    hidePowerOverlay();\n    powerCharges = 0;\n    updatePowerBadge();\n    if(streakBadgeEl) streakBadgeEl.style.opacity = '0';\n    clearTimeout(spawnTimer);\n    invaders.forEach(c=>c.el.remove());\n    invaders = [];\n    view.classList.remove('playing');\n    const levelReached = level + 1;\n    showEndOfGameCoins(game, difficulty, levelReached, ()=>{\n      showKeyReport(game, ()=>{\n        if(keyboardWrap) keyboardWrap.style.display = 'none'; intro.style.display = 'flex';\n      });\n    });\n  }\n\n  function startGame(){\n    LEVELS = buildLevels(keyFilter.getSelected());\n    intro.style.display = 'none';\n    view.classList.add('playing');\n    running = true;\n    paused = false;\n    freezeActive = false;\n    shieldActive = false;\n    slowActive = false;\n    hidePowerOverlay();\n    powerCharges = 0;\n    updatePowerBadge();\n    level = 0; score = 0; streak = 0; popsThisLevel = 0; missesThisLevel = 0;\n    hearts = MAX_HEARTS;\n    letterStats = {};\n    resetCannonPosition();\n    updateShipGlow();\n    levelVal.textContent = 1;\n    if(bestVal) bestVal.textContent = getBestLevel();\n    diffVal.textContent = DIFFICULTIES[difficulty].label;\n    scoreVal.textContent = 0;\n    streakVal.textContent = 0;\n    renderHearts();\n    refreshKeyboardLocks();\n    updatePowerBadge();\n    updateStreakBadge();\n    // Hard mode hides the on-screen keyboard hint below the ship so kids\n    // have to rely on real keyboard muscle memory instead of the visual cue.\n    if(keyboardWrap) keyboardWrap.style.display = (difficulty === 'hard') ? 'none' : '';\n    ensureAudio();\n    scheduleSpawn();\n    loop();\n  }\n\n  startBtn.addEventListener('click', startGame);\n\n  cancelBtn.addEventListener('click', ()=>{\n    if(!running) return;\n    showConfirm('Quit this game? Your progress will be lost.', quitGame);\n  });\n\n  refreshKeyboardLocks();\n\n  return {\n    forcePause: function(){\n      if(running && !paused){\n        paused = true;\n        clearTimeout(spawnTimer);\n      }\n    },\n    isRunning: ()=> running\n  };\n})();\n\n<\/script>\n</body>\n</html>\n";

   STORY SHELVES — "Story Time" is a special, ungraded subject: a
   library of short stories (not lessons), organized into a handful of
   shelves/categories. It reuses the exact same {id,num,icon,title,
   chapters,color} shape every other subject's quarters use, but each
   shelf's `chapters` stays empty on purpose — there's no built-in
   curriculum here, every story is added in-app (see addCustomTopic +
   LessonEditForm's storyMode) and simply falls into that shelf's
   "✨ My Stories" bucket, same mechanism as a custom topic elsewhere.

   SubjectHomeScreen can group them into separate "English Stories" /
   "Filipino Stories" sections instead of one mixed grid — the shelves
   themselves stay independent (a story added to one shelf never shows
   up under the other language's section).
   ========================================================= */

/* =========================================================
   GRADES — component weights (from Sacred Heart's Grade Components
   sheet), DepEd transmutation, and honor thresholds.
   Subjects not on any report card (the "general" reference word list)
   are excluded from the Grades section.
   ========================================================= */
// Written Work / Performance Task / Quarterly Assessment weights per subject group.
const GRADE_WEIGHTS = {
  filipino:{ww:0.3, pt:0.5, qa:0.2},
  english: {ww:0.3, pt:0.5, qa:0.2},
  ap:      {ww:0.3, pt:0.5, qa:0.2},
  gmrc:    {ww:0.3, pt:0.5, qa:0.2}, // Christian Living / Values Education-type weighting
  math:    {ww:0.4, pt:0.4, qa:0.2},
  science: {ww:0.4, pt:0.4, qa:0.2},
  computer:{ww:0.2, pt:0.6, qa:0.2},
  mapeh:   {ww:0.2, pt:0.6, qa:0.2},
  hele:    {ww:0.2, pt:0.6, qa:0.2}
};
const GRADED_SUBJECTS = SUBJECTS.filter(s=>s.special!=="reference" && GRADE_WEIGHTS[s.id]);
const GRADE_QUARTERS = [
  {id:"q1", label:"Q1"},
  {id:"q2", label:"Q2"},
  {id:"q3", label:"Q3"},
  {id:"q4", label:"Q4"}
];

// DepEd's published transmutation table, expressed as a formula instead of
// a hardcoded 40-row lookup: below 60% raw, every 4 raw points = +1 transmuted
// point (60→60 ... 59.99→74); at/above 60% raw, every 1.6 raw points = +1
// transmuted point (60→75 ... 100→100).
function transmuteGrade(rawPct){
  if(rawPct==null || isNaN(rawPct)) return null;
  const raw = Math.max(0, Math.min(100, rawPct));
  if(raw >= 60){
    return Math.min(100, 75 + Math.floor((raw-60)/1.6));
  }
  return 60 + Math.floor(raw/4);
}
const DEFAULT_HONOR_THRESHOLDS = {highest:98, high:95, honors:90};
function honorLabel(avg, thresholds){
  const t = thresholds || DEFAULT_HONOR_THRESHOLDS;
  if(avg==null) return null;
  if(avg>=t.highest) return "With Highest Honors";
  if(avg>=t.high) return "With High Honors";
  if(avg>=t.honors) return "With Honors";
  return null;
}
// A quarter entry is either:
//  - mode "final": entry.ww / entry.pt / entry.qa each hold an already-computed
//    percentage (0-100) for that component, weighted by this subject's group weights.
//  - mode "detailed": entry.ww / entry.pt / entry.qa each hold an ARRAY of
//    {score,total} items (Written Work #1, #2, ... etc). Each component's
//    percentage is the sum of scores over the sum of totals across its items,
//    then weighted the same way as Final mode.
// Sums the {score,total} items for one component (WW/PT/QA) into a single
// percentage. Pulled out of componentPct so Final mode can also use it as
// an auto-computed fallback (see componentPct below).
function detailedComponentPct(entry, key){
  const items = (entry[key]||[]).filter(it=>it && it.total!=="" && it.total!=null && Number(it.total)>0 && it.score!==""&&it.score!=null);
  if(!items.length) return null;
  const sumScore = items.reduce((a,it)=>a+Number(it.score),0);
  const sumTotal = items.reduce((a,it)=>a+Number(it.total),0);
  if(sumTotal<=0) return null;
  return Math.max(0, Math.min(100, (sumScore/sumTotal)*100));
}
function componentPct(entry, key){
  if(entry.mode==="detailed"){
    return detailedComponentPct(entry, key);
  }
  // Final mode: prefer a manually-typed override (stored under key+"Final"
  // so it never collides with any Detailed items kept under the plain
  // key). If there's no override yet, auto-fill from the Detailed items'
  // computed average instead of showing blank/zero — so switching to
  // Final mode never hides work already entered in Detailed mode.
  const manualKey = key + "Final";
  let manual = entry[manualKey];
  // Backward-compat: older saves stored the Final-mode value directly
  // under entry[key] as a plain number (before this override/auto-fill
  // split existed). Treat that as the manual override too.
  if((manual==="" || manual==null) && entry[key]!=null && entry[key]!=="" && !Array.isArray(entry[key])){
    manual = entry[key];
  }
  if(manual !== "" && manual != null && !isNaN(manual)){
    return Math.max(0, Math.min(100, Number(manual)));
  }
  return detailedComponentPct(entry, key);
}
function computeQuarterGrade(subjectId, entry, weightsOverride){
  if(!entry) return null;
  const w = weightsOverride || GRADE_WEIGHTS[subjectId];
  if(!w) return null;
  const parts = ["ww","pt","qa"];
  let weightedSum = 0, weightUsed = 0;
  parts.forEach(p=>{
    const pct = componentPct(entry, p);
    if(pct!=null){
      weightedSum += pct * w[p];
      weightUsed += w[p];
    }
  });
  if(weightUsed<=0) return null;
  const rawPct = weightedSum/weightUsed;
  return transmuteGrade(rawPct);
}
function subjectFinalGrade(subjectId, gradesForSubject, weightsOverride){
  const vals = GRADE_QUARTERS.map(q=>computeQuarterGrade(subjectId, gradesForSubject && gradesForSubject[q.id], weightsOverride)).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
// A parent can nudge the auto-computed final grade up/down by whole points
// (e.g. for teacher-adjusted rounding) without touching the underlying scores.
function subjectAdjust(gradesForSubject){
  return (gradesForSubject && Number(gradesForSubject.adjust)) || 0;
}
function subjectDisplayFinal(subjectId, gradesForSubject, weightsOverride){
  const base = subjectFinalGrade(subjectId, gradesForSubject, weightsOverride);
  if(base==null) return null;
  return Math.max(60, Math.min(100, Math.round(base) + subjectAdjust(gradesForSubject)));
}

/* =========================================================
   PH FLAG ICON — drawn as a real vector graphic rather than the 🇵🇭
   emoji, since flag emoji don't render as actual flags on plenty of
   desktop browsers/OSes (Windows in particular just shows the letters
   "PH", and some environments render an entirely different flag).
   ========================================================= */
function starPoints(cx, cy, spikes, outerR, innerR){
  const pts = [];
  for(let i=0;i<spikes*2;i++){
    const r = i%2===0 ? outerR : innerR;
    const a = (Math.PI/spikes)*i - Math.PI/2;
    pts.push((cx + Math.cos(a)*r).toFixed(2) + "," + (cy + Math.sin(a)*r).toFixed(2));
  }
  return pts.join(" ");
}
function PHFlagIcon(){
  return (
    <svg viewBox="0 0 30 20" width="1em" height="1em" style={{display:"block", borderRadius:"3px", flex:"0 0 auto"}} role="img" aria-label="Philippine flag">
      <rect x="0" y="0" width="30" height="10" fill="#0038A8"/>
      <rect x="0" y="10" width="30" height="10" fill="#CE1126"/>
      <polygon points="0,0 0,20 17.3,10" fill="#FFFFFF"/>
      <polygon points={starPoints(6.5, 10, 8, 2.6, 1.15)} fill="#FCD116"/>
      <polygon points={starPoints(2.6, 3, 5, 1.1, 0.45)} fill="#FCD116"/>
      <polygon points={starPoints(2.6, 17, 5, 1.1, 0.45)} fill="#FCD116"/>
      <polygon points={starPoints(13.2, 10, 5, 1.1, 0.45)} fill="#FCD116"/>
    </svg>
  );
}

function SubjectIcon({icon}){

/* Minimal allow-list sanitizer for teacher-authored rich text (from the
   contentEditable note editor) before it's stored / rendered with
   dangerouslySetInnerHTML. Strips scripts, event handlers and anything not
   on the allow-list, but keeps the inline styles execCommand produces. */
function sanitizeHtml(html){
  const ALLOWED_TAGS = new Set(["B","STRONG","I","EM","U","S","STRIKE","SPAN","DIV","BR","UL","OL","LI","P","FONT","A","H1","H2","H3","H4","TABLE","THEAD","TBODY","TFOOT","TR","TD","TH"]);
  try{
    const doc = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html");
    const root = doc.body.firstChild;
    (function clean(node){
      Array.from(node.childNodes).forEach(child=>{
        if(child.nodeType === 1){
          if(!ALLOWED_TAGS.has(child.tagName)){
            while(child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            return;
          }
          Array.from(child.attributes).forEach(attr=>{
            const name = attr.name.toLowerCase();
            if(name.startsWith("on")){ child.removeAttribute(attr.name); return; }
            if(name === "style") return;
            if(child.tagName === "A" && (name === "href" || name === "target" || name === "rel")){
              if(name === "href" && /^\s*javascript:/i.test(attr.value)) child.removeAttribute(attr.name);
              return;
            }
            if(child.tagName === "FONT" && (name === "color" || name === "size" || name === "face")) return;
            if((child.tagName === "TD" || child.tagName === "TH") && (name === "colspan" || name === "rowspan")) return;
            child.removeAttribute(attr.name);
          });
          clean(child);
        } else if(child.nodeType !== 3){
          node.removeChild(child);
        }
      });
    })(root);
    return root.innerHTML;
  }catch(e){ return ""; }
}
function youtubeEmbedId(url){
  if(!url) return null;
  const trimmed = url.trim();
  if(!trimmed) return null;
  try{
    const u = new URL(trimmed);
    const host = u.hostname.replace(/^www\./,"");
    if(host === "youtu.be"){
      return u.pathname.slice(1).split("/")[0] || null;
    }
    if(host === "youtube.com" || host === "m.youtube.com"){
      if(u.pathname === "/watch") return u.searchParams.get("v");
      if(u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2] || null;
      if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2] || null;
    }
  }catch(e){ /* not a valid URL */ }
  return null;
}
/* =========================================================
   STORY NARRATION — reads a Story note block aloud using the browser's
   built-in speech synthesis (Web Speech API). No paid API/key involved,
   so this can't do real emotional voice acting; instead it:
   - splits each line into "Speaker: text" (dialogue) vs plain narration,
   - assigns each named character a consistent, distinct system voice,
   - nudges pitch/rate/volume per line from punctuation (!, ?, ..., CAPS)
     as a lightweight stand-in for emotion.
   Convention taught to the teacher in the editor: a line written as
   "Maya: Where did the cat go?" makes "Maya" speak that line; any other
   line is read as narration.
   ========================================================= */
function parseStorySegments(text){
  const lines = String(text || "").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  return lines.map(line=>{
    const m = line.match(/^([A-Za-z][A-Za-z0-9 '’-]{0,24}):\s*(.+)$/);
    if(m) return {speaker: m[1].trim(), text: m[2].trim()};
    return {speaker: null, text: line};
  });
}
const STORY_NARRATOR_KEY = "__narrator__";
// Which language's voices to read stories with, persisted across sessions.
// "" means the original default behavior (prefer English, fall back to
// whatever's installed). Any other value is a language code taken straight
// from an installed voice's lang tag (e.g. "fil", "tl", "es").
const STORY_VOICE_LANG_KEY = "grade4-story-voice-lang";
function loadStoryVoiceLangPref(){
  try{ return localStorage.getItem(STORY_VOICE_LANG_KEY) || ""; }catch(e){ return ""; }
}
function saveStoryVoiceLangPref(v){
  try{ localStorage.setItem(STORY_VOICE_LANG_KEY, v || ""); }catch(e){}
}
// Some browsers/OSes tag the Filipino voice with the older Tagalog code
// ("tl") instead of "fil" (or vice versa) — treat those as the same
// language so picking either one in the dropdown reliably finds it.
const STORY_LANG_ALIASES = { fil: ["fil","tl"], tl: ["tl","fil"] };
function getStoryVoices(langPrefix){
  if(!('speechSynthesis' in window)) return [];
  const key = (langPrefix || "").toLowerCase();
  // Always read straight from the browser instead of keeping our own
  // cache on top of it. speechSynthesis.getVoices() is already cheap, and
  // the old custom cache was the actual bug: once a language's entry was
  // cached, later selecting a DIFFERENT language could still end up
  // reusing a stale/empty cache entry from before voices had finished
  // loading, so the story kept speaking in the previously-selected
  // (or default) language instead of the newly-selected one.
  const all = speechSynthesis.getVoices();
  if(!key) return all.filter(v=>/^en/i.test(v.lang));
  const codes = STORY_LANG_ALIASES[key] || [key];
  // No silent fallback to "all voices" here on purpose — if nothing
  // actually matches the selected language, playStory() below falls back
  // to just hinting the browser via utterance.lang instead of picking a
  // random unrelated voice.
  return all.filter(v=> v.lang && codes.some(c=> v.lang.toLowerCase().startsWith(c)));
}
// Scans whatever voices this browser/device actually has installed and
// returns one entry per distinct language (e.g. Filipino only shows up
// here if a Filipino/Tagalog voice is installed on the device) — this way
// the picker never offers a language that would silently fall back to
// something else.
function getStoryLanguageOptions(){
  if(!('speechSynthesis' in window)) return [];
  const all = speechSynthesis.getVoices();
  const seen = new Map();
  all.forEach(v=>{
    if(!v.lang) return;
    const code = v.lang.split(/[-_]/)[0].toLowerCase();
    if(!seen.has(code)) seen.set(code, v.lang);
  });
  let dn = null;
  try{ dn = new Intl.DisplayNames(['en'], {type:'language'}); }catch(e){}
  const options = Array.from(seen.keys()).map(code=>{
    let label = code.toUpperCase();
    try{ if(dn){ const name = dn.of(code); if(name) label = name; } }catch(e){}
    return {code, label};
  });
  options.sort((a,b)=>a.label.localeCompare(b.label));
  return options;
}
// Deterministic per-character voice+pitch assignment so the same
// character sounds the same every read, and different characters
// (and the narrator) sound distinct from each other.
function assignStoryVoices(segments, langPrefix){
  const voices = getStoryVoices(langPrefix);
  const names = Array.from(new Set(segments.map(s=>s.speaker || STORY_NARRATOR_KEY)));
  const pitchSteps = [1, 1.3, 0.75, 1.5, 0.6, 1.15, 0.9, 1.4];
  const map = {};
  let charIdx = 0;
  names.forEach(name=>{
    if(name === STORY_NARRATOR_KEY){
      map[name] = {voice: voices[0] || null, pitch: 1, rateBase: 0.95};
      return;
    }
    const voice = voices.length ? voices[(charIdx + 1) % voices.length] : null;
    map[name] = {voice, pitch: pitchSteps[charIdx % pitchSteps.length], rateBase: 1};
    charIdx++;
  });
  return map;
}
// Cheap punctuation/caps-based "emotion" — free browser TTS has no real
// emotional inflection to draw on, so this is an approximation only.
function storyEmotionForLine(text){
  const isShout = /\b[A-Z]{3,}\b/.test(text);
  const hasExclaim = /!/.test(text);
  const hasQuestion = /\?/.test(text);
  const isTrailing = /\.\.\.\s*$/.test(text);
  if(isShout) return {rateMult:1.12, pitchMult:1.18, volume:1};
  if(hasExclaim) return {rateMult:1.08, pitchMult:1.12, volume:1};
  if(hasQuestion) return {rateMult:1, pitchMult:1.08, volume:1};
  if(isTrailing) return {rateMult:0.85, pitchMult:1, volume:0.85};
  return {rateMult:1, pitchMult:1, volume:1};
}
// Plays a story's segments in order via speechSynthesis's own queue.
// Returns a controller with .stop(); calls onSegment(idx) as each line
// starts (for highlighting) and onEnd() when the story finishes/stops.
function playStory(text, {onSegment, onEnd, lang} = {}){
  if(!('speechSynthesis' in window)){ if(onEnd) onEnd(); return null; }
  speechSynthesis.cancel();
  const segments = parseStorySegments(text);
  if(!segments.length){ if(onEnd) onEnd(); return null; }
  const voiceMap = assignStoryVoices(segments, lang);
  let i = 0;
  let stopped = false;
  function speakNext(){
    if(stopped) return;
    if(i >= segments.length){ if(onEnd) onEnd(); return; }
    const seg = segments[i];
    const info = voiceMap[seg.speaker || STORY_NARRATOR_KEY] || {voice:null, pitch:1, rateBase:1};
    const emo = storyEmotionForLine(seg.text);
    const u = new SpeechSynthesisUtterance(seg.text);
    if(info.voice){
      u.voice = info.voice;
      u.lang = info.voice.lang;
    } else if(lang){
      // No installed voice exactly matches the selected language — still
      // hint the browser toward it via lang instead of leaving it unset
      // (which is what silently produced "still plays default").
      u.lang = lang;
    }
    u.pitch = Math.max(0.4, Math.min(2, info.pitch * emo.pitchMult));
    u.rate = Math.max(0.6, Math.min(1.5, info.rateBase * emo.rateMult));
    u.volume = emo.volume;
    if(onSegment) onSegment(i, seg);
    u.onend = ()=>{ i++; speakNext(); };
    u.onerror = ()=>{ i++; speakNext(); };
    // Chrome has a long-standing bug where speak() called right after
    // cancel() (which we just did above, and which also happens on every
    // language switch since handleLangChange stops playback) can get
    // dropped or silently keep using the previous utterance's voice. A
    // short delay before the first speak() call avoids that race.
    setTimeout(()=>{ if(!stopped) speechSynthesis.speak(u); }, i === 0 ? 40 : 0);
  }
  speakNext();
  return { stop(){ stopped = true; speechSynthesis.cancel(); } };
}

/* =========================================================
   GEMINI TTS — optional higher-quality narration via Gemini 3.1 Flash
   TTS (preview). The free browser voice above (playStory) stays the
   default; this is an opt-in upgrade for whoever has an API key.

   Every story is split into "parts" of at most 2 distinct speakers and
   at most 6 lines each — both because the API only accepts up to 2
   speaker voices per call, and so one long story isn't riding on a
   single giant, slow, easy-to-rate-limit request: if one part fails
   (network hiccup, free-tier limit, etc.) the rest still play, instead
   of the whole story going silent.
   ========================================================= */

// Deliberately NOT prefixed with "gs4_" or "ta-" — those are the only
// prefixes isSyncedKey() above watches, and pushToCloud() bundles every
// matching key into one blob that's PUT to a Firebase DB with open
// read/write (see the FIREBASE comment near the top of this file). An
// API key must never end up in that payload, so it's stored under its
// own key name that the sync code will never see or touch — it still
// persists in localStorage on this device, just outside the sync net.
const GEMINI_KEY_STORAGE = "local_only_gemini_tts_key";
function loadGeminiApiKey(){
  try{ return localStorage.getItem(GEMINI_KEY_STORAGE) || ""; }catch(e){ return ""; }
}

/* ---------------------------------------------------------------
   STORY AUDIO CACHE — on-device only (IndexedDB), never touches
   Firebase/cloud sync. The very first time a story is played with
   the Gemini voice, every part is generated and stitched into ONE
   full-story WAV file, which is saved here. Every play after that
   reuses the saved file instead of calling the API again — no
   repeat API cost, and it still plays back with the device fully
   offline. Audio is stored in IndexedDB rather than localStorage
   because localStorage only holds small text strings (a few MB
   total, shared with everything else the app saves); IndexedDB is
   the browser storage built for larger binary data like audio, but
   like localStorage it lives only on this device/browser and is
   never uploaded anywhere.
   --------------------------------------------------------------- */
// Named "local_only_" (not "gs4_") on purpose — same reason as the Gemini
// key above: gs4_/ta- is the prefix the Firebase sync code watches for in
// localStorage, and this name should never look like it's part of that.
// It's IndexedDB, a completely separate storage system Firebase sync code
// never reads from, but keeping the name unambiguous avoids any confusion.
const STORY_AUDIO_DB_NAME = "local_only_story_audio_cache_g4";
const STORY_AUDIO_STORE = "clips";
function openStoryAudioDB(){
  return new Promise((resolve, reject)=>{
    try{
      const req = indexedDB.open(STORY_AUDIO_DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(STORY_AUDIO_STORE)) db.createObjectStore(STORY_AUDIO_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }catch(e){ reject(e); }
  });
}
// Small, fast, non-cryptographic string hash (djb2) — plenty for a
// cache key. Same story text always produces the same key, so an
// edited story naturally gets treated as new and re-generated; the
// old cached entry for the previous version just goes unused.
function hashStoryText(text){
  let h = 5381;
  for(let i=0;i<text.length;i++){ h = ((h*33) ^ text.charCodeAt(i)) >>> 0; }
  return h.toString(36) + "_" + text.length;
}
function storyAudioCacheKey(noteId, text, genders){
  // Folding the genders map into the hash means correcting a character's
  // gender (via the JSON "genders" field) and re-saving is enough on its
  // own to invalidate old cached audio — the story text didn't change,
  // but the voice assignment needs to, so the old cache entry must miss.
  const gendersPart = genders && Object.keys(genders).length ? "_g" + hashStoryText(JSON.stringify(genders)) : "";
  return "story_" + (noteId || "x") + "_" + hashStoryText(text || "") + gendersPart;
}
// Per-part sub-key so each Gemini TTS chunk can be saved to IndexedDB
// the moment it downloads, independent of whether the other parts have
// succeeded yet. Value stored under this key is the raw base64 PCM
// string (not a Blob), so it can be re-collected and stitched later
// without a blob<->base64 round trip.
function storyPartCacheKey(cacheKey, partIdx){
  return cacheKey + "_part" + partIdx;
}
async function getCachedStoryAudio(key){
  try{
    const db = await openStoryAudioDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(STORY_AUDIO_STORE, "readonly");
      const req = tx.objectStore(STORY_AUDIO_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}
async function setCachedStoryAudio(key, blob){
  try{
    const db = await openStoryAudioDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(STORY_AUDIO_STORE, "readwrite");
      tx.objectStore(STORY_AUDIO_STORE).put(blob, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ return false; }
}
async function deleteCachedStoryAudio(key){
  try{
    const db = await openStoryAudioDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(STORY_AUDIO_STORE, "readwrite");
      tx.objectStore(STORY_AUDIO_STORE).delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ return false; }
}

/* ---------------------------------------------------------------
   STORY AUDIO CACHE — full backup/restore helpers, used by the
   Export/Import JSON backup buttons so the on-device IndexedDB
   audio cache travels with the rest of a family's data instead of
   being left behind (it normally never touches Firebase/cloud sync,
   so a JSON backup is the only way to move it to another device).
   Blob values are converted to base64 data URLs so they can live
   inside plain JSON; the per-part cache entries (already stored as
   base64 strings) are carried through unchanged.
   --------------------------------------------------------------- */
function blobToDataURL(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
async function exportStoryAudioCache(){
  try{
    const db = await openStoryAudioDB();
    const rawEntries = await new Promise((resolve, reject)=>{
      const tx = db.transaction(STORY_AUDIO_STORE, "readonly");
      const store = tx.objectStore(STORY_AUDIO_STORE);
      const out = [];
      const cursorReq = store.openCursor();
      cursorReq.onsuccess = (e) => {
        const cursor = e.target.result;
        if(cursor){
          out.push({key: cursor.key, value: cursor.value});
          cursor.continue();
        } else {
          resolve(out);
        }
      };
      cursorReq.onerror = () => reject(cursorReq.error);
    });
    const entries = [];
    for(const {key, value} of rawEntries){
      if(value instanceof Blob){
        entries.push({key, kind:"blob", data: await blobToDataURL(value)});
      } else {
        entries.push({key, kind:"raw", data: value});
      }
    }
    return entries;
  }catch(e){ return []; }
}
async function importStoryAudioCache(entries){
  if(!entries || !entries.length) return;
  try{
    const converted = [];
    for(const item of entries){
      if(item.kind === "blob"){
        const blob = await (await fetch(item.data)).blob();
        converted.push({key: item.key, value: blob});
      } else {
        converted.push({key: item.key, value: item.data});
      }
    }
    const db = await openStoryAudioDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(STORY_AUDIO_STORE, "readwrite");
      converted.forEach(c => tx.objectStore(STORY_AUDIO_STORE).put(c.value, c.key));
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){}
}
// Rough per-segment start times for highlighting cached playback,
// where we no longer have real per-part timing — split total audio
// duration proportionally by each line's character length.
function estimateSegmentStarts(segments, totalDuration){
  const lens = segments.map(s => Math.max(1, (s.text || "").length));
  const totalLen = lens.reduce((a,b)=>a+b, 0) || 1;
  let acc = 0;
  return lens.map(len => {
    const start = (acc / totalLen) * totalDuration;
    acc += len;
    return start;
  });
}
function saveGeminiApiKey(key){
  try{
    if(key) localStorage.setItem(GEMINI_KEY_STORAGE, key);
    else localStorage.removeItem(GEMINI_KEY_STORAGE);
  }catch(e){}
  // Each open StoryCard keeps its own copy of the key in React state
  // (see useGeminiApiKey below) — broadcast so all of them pick up a
  // change immediately instead of only on their next mount.
  window.dispatchEvent(new Event("gemini-key-changed"));
}
