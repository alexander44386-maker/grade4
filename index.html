      </div>
      {!a.isCorrect && <div className="ra right">Correct answer: {a.options[a.correct]}</div>}
    </React.Fragment>
  );
}
function ResultsView({answers, accent, onRetry, onDone, title}){
  const total = answers.length;
  const correct = answers.filter(a => a.isCorrect).length;
  const pct = Math.round((correct/total)*100);
  const passed = pct >= 70;
  const isPerfect = total > 0 && correct === total;
  React.useEffect(()=>{ isPerfect ? Sound.perfect() : passed ? Sound.pass() : Sound.tryAgain(); }, []);
  return (
    <div className={"results-card" + (passed ? " reward" : "")}>
      {passed && <Confetti variant={isPerfect ? "perfect" : "reward"} big={isPerfect}/>}
      {isPerfect && <div className="perfect-badge">🎉 Perfect Score! 🎉</div>}
      {passed && !isPerfect && <div className="levelup-badge">⚡ Level Up!</div>}
      <div className={"results-emoji" + (isPerfect ? " perfect" : "")}>{isPerfect ? "🏆" : passed ? "🌟" : "🔍"}</div>
      <div className="results-score" style={{color: passed ? undefined : accent}}>{correct} / {total}</div>
      <div className="results-sub">
        {isPerfect ? "Flawless! You got every question right in " + title + "." : passed ? "Great work! You passed " + title + "." : "Keep practicing — review " + title + " and try again."}
      </div>
      <div className="review-list">
        {answers.map((a, i) => (
          <div className="review-item" key={i} style={{animationDelay:Math.min(i*0.04,0.5)+"s"}}>
            {a.tag && <div className="rtag">{a.tag}</div>}
            <div className="rq">{i+1}. {a.question}</div>
            <AnswerReviewBody a={a} />
          </div>
        ))}
      </div>
      <div className="results-actions">
        <button className="btn btn-ghost" onClick={onRetry}>↻ Try Again</button>
        <button className="btn btn-primary" style={{background:accent}} onClick={onDone}>Done</button>
      </div>
    </div>
  );
}

/* =========================================================
   RICH-TEXT NOTE EDITOR — a single formattable lesson-note block
   (bold/italic/underline/list/font/size/color, incl. Ctrl+B/I/U)
   ========================================================= */
function NoteEditor({initialHtml, initialName, onNameChange, registerRef, onRemove, canRemove, index}){
  const divRef = useRef(null);
  const savedRange = useRef(null);

  useEffect(()=>{
    if(divRef.current){
      divRef.current.innerHTML = initialHtml || "";
      registerRef(divRef.current);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function saveSelection(){
    const sel = window.getSelection();
    if(sel && sel.rangeCount > 0){
      const range = sel.getRangeAt(0);
      if(divRef.current && divRef.current.contains(range.commonAncestorContainer)){
        savedRange.current = range.cloneRange();
      }
    }
  }
  function restoreSelection(){
    if(savedRange.current){
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange.current);
    }
  }
  function exec(cmd, val){
    if(divRef.current){
      divRef.current.focus();
      restoreSelection();
    }
    try{ document.execCommand("styleWithCSS", false, true); }catch(e){}
    document.execCommand(cmd, false, val);
    saveSelection();
  }
  function handleKeyDown(e){
    const mod = e.ctrlKey || e.metaKey;
    if(!mod) return;
    const key = e.key.toLowerCase();
    if(key === "b"){ e.preventDefault(); exec("bold"); }
    else if(key === "i"){ e.preventDefault(); exec("italic"); }
    else if(key === "u"){ e.preventDefault(); exec("underline"); }
  }

  return (
    <div className="note-block">
      <div className="note-block-head">
        <span className="note-block-num">📝</span>
        <input
          type="text"
          className="note-name-input"
          value={initialName}
          onChange={e=>onNameChange(e.target.value)}
          placeholder={"Note " + index}
          title="Rename this lesson note"
        />
        {canRemove && (
          <button type="button" className="note-remove-btn" onClick={onRemove} title="Remove this note">✕ Remove</button>
        )}
      </div>
      <div className="rt-toolbar">
        <button type="button" className="rt-btn" onMouseDown={e=>e.preventDefault()} onClick={()=>exec("bold")} title="Bold (Ctrl+B)"><b>B</b></button>
        <button type="button" className="rt-btn" onMouseDown={e=>e.preventDefault()} onClick={()=>exec("italic")} title="Italic (Ctrl+I)"><i>I</i></button>
        <button type="button" className="rt-btn" onMouseDown={e=>e.preventDefault()} onClick={()=>exec("underline")} title="Underline (Ctrl+U)"><u>U</u></button>
        <span className="rt-sep"></span>
        <button type="button" className="rt-btn" onMouseDown={e=>e.preventDefault()} onClick={()=>exec("insertUnorderedList")} title="Bullet list">• List</button>
        <span className="rt-sep"></span>
        <select className="rt-select" defaultValue="" onChange={e=>{ if(e.target.value){ exec("fontName", e.target.value); e.target.value=""; } }} title="Font">
          <option value="" disabled>Font</option>
          <option value="Nunito, sans-serif">Nunito</option>
          <option value="'Fredoka', sans-serif">Fredoka</option>
          <option value="Calibri, sans-serif">Calibri</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="'Space Mono', monospace">Monospace</option>
          <option value="Georgia, serif">Serif</option>
          <option value="'Comic Sans MS', cursive">Comic Sans</option>
        </select>
        <select className="rt-select" defaultValue="" onChange={e=>{ if(e.target.value){ exec("fontSize", e.target.value); e.target.value=""; } }} title="Size">
          <option value="" disabled>Size</option>
          <option value="2">Small</option>
          <option value="3">Normal</option>
          <option value="5">Large</option>
          <option value="7">X-Large</option>
        </select>
        <label className="rt-color-label" title="Text color">
          🎨<input type="color" className="rt-color" defaultValue="#2E2D52" onChange={e=>exec("foreColor", e.target.value)} />
        </label>
        <span className="rt-sep"></span>
        <button type="button" className="rt-btn" onMouseDown={e=>e.preventDefault()} onClick={()=>exec("removeFormat")} title="Clear formatting">⨯ Clear</button>
      </div>
      <div
        ref={divRef}
        className="rich-editor"
        contentEditable
        suppressContentEditableWarning
        onKeyDown={handleKeyDown}
        onMouseUp={saveSelection}
        onKeyUp={saveSelection}
        data-placeholder="Type this teaching point here… select text to format it, or use the toolbar."
      ></div>
    </div>
  );
}

/* =========================================================
   STORY EDITOR — a plain-text block that gets read aloud with a
   different voice per character (see playStory() above for how).
   ========================================================= */
function StoryEditor({initialText, initialName, initialGenders, onNameChange, onGendersChange, registerRef, onRemove, canRemove, index}){
  const taRef = useRef(null);
  const [showJsonPaste, setShowJsonPaste] = useState(false);
  const [jsonText, setJsonText] = useState("");
  const [jsonError, setJsonError] = useState("");
  const pendingTextRef = useRef(null);

  // The narrator's voice (Gemini AI voice mode only) is just another entry
  // in the same genders map the character voices already use, stored under
  // the special key "Narrator" — see assignGeminiVoices(). "" means "no
  // preference" (draws from the full voice pool, the old default behavior).
  const narratorGenderRaw = (initialGenders && initialGenders["Narrator"]) || "";
  function handleNarratorGenderChange(value){
    const next = {...(initialGenders || {})};
    if(value){ next["Narrator"] = value; } else { delete next["Narrator"]; }
    onGendersChange && onGendersChange(next);
  }

  useEffect(()=>{
    if(taRef.current){
      // If a JSON conversion happened while the plain-text textarea was
      // unmounted (JSON panel open), apply the pending converted text now
      // that it's back in the DOM; otherwise fall back to initialText.
      taRef.current.value = pendingTextRef.current != null ? pendingTextRef.current : (initialText || "");
      pendingTextRef.current = null;
      registerRef(taRef.current);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [showJsonPaste]);

  function handleConvertJson(){
    let parsed;
    try{
      parsed = JSON.parse(jsonText);
    }catch(e){
      setJsonError("That's not valid JSON — check for a missing comma or bracket.");
      return;
    }
    const lines = Array.isArray(parsed) ? parsed : parsed && Array.isArray(parsed.lines) ? parsed.lines : null;
    if(!lines || !lines.length){
      setJsonError('Expected either an array of lines, or {"name":"...", "lines":[...]}.');
      return;
    }
    const text = storyLinesToText(lines);
    if(!text){
      setJsonError("No usable lines found in that JSON.");
      return;
    }
    // The plain-text textarea (taRef) is unmounted while this JSON panel is
    // showing, so we can't write to it directly here — stash it and let the
    // effect above apply it once the textarea remounts.
    pendingTextRef.current = text;
    if(!Array.isArray(parsed) && parsed.name && !initialName){
      onNameChange(String(parsed.name));
    }
    // Optional {"genders": {"Maya":"girl", "Whiskers":"boy"}} map — only
    // present on the object form, not the bare-array form. This is what
    // lets the Gemini AI voice pick the right voice pool per character
    // instead of guessing from the name alone (see assignGeminiVoices).
    if(!Array.isArray(parsed) && parsed.genders && typeof parsed.genders === "object" && onGendersChange){
      onGendersChange(parsed.genders);
    }
    setJsonError("");
    setJsonText("");
    setShowJsonPaste(false);
  }

  const STORY_JSON_SAMPLE = '{\n  "name": "The Lost Cat",\n  "genders": { "Maya": "girl", "Whiskers": "boy" },\n  "lines": [\n    { "speaker": null, "text": "Once upon a time, in a quiet village, there lived a curious cat named Whiskers." },\n    { "speaker": "Maya", "text": "Where did the cat go?" },\n    { "speaker": null, "text": "The cat had been hiding under the table the whole time!" },\n    { "speaker": "Whiskers", "text": "Meow! I was just exploring!" }\n  ]\n}';

  return (
    <div className="note-block story-block">
      <div className="note-block-head">
        <span className="note-block-num">🎭</span>
        <input
          type="text"
          className="note-name-input"
          value={initialName}
          onChange={e=>onNameChange(e.target.value)}
          placeholder={"Story " + index}
          title="Rename this story"
        />
        <button type="button" className="note-remove-btn" style={{color:"var(--night)"}} onClick={()=>setShowJsonPaste(v=>!v)} title="Paste a JSON-formatted story instead of typing it">
          {showJsonPaste ? "✕ Close JSON" : "📋 Paste JSON"}
        </button>
        {canRemove && (
          <button type="button" className="note-remove-btn" onClick={onRemove} title="Remove this story">✕ Remove</button>
        )}
      </div>
      {showJsonPaste ? (
        <div className="story-json-panel">
          <p className="story-hint">
            Paste a story written in JSON (this is the format to hand ChatGPT/Claude so it can write one for you):
          </p>
          <CopyableJson label="📄 Sample story JSON" json={STORY_JSON_SAMPLE} note='"speaker": null (or leave it out) means narration; any other name makes that character speak the line. The optional top-level "genders" map ("boy"/"girl") tells the AI voice which character to voice as which — leave a name out of it and the app will just guess from the name instead. You can also set the narrator&apos;s voice by adding a "Narrator" entry to that map, or just use the "Narrator voice" dropdown below the story text.' />
          <textarea
            className="story-textarea"
            rows={6}
            value={jsonText}
            onChange={e=>{ setJsonText(e.target.value); setJsonError(""); }}
            placeholder='Paste JSON here, e.g. {"name":"...", "lines":[{"speaker":null,"text":"..."}]}'
          ></textarea>
          {jsonError && <div className="sub" style={{color:"var(--bad)", marginTop:4}}>{jsonError}</div>}
          <button type="button" className="btn btn-primary btn-sm" style={{marginTop:8, alignSelf:"flex-start"}} onClick={handleConvertJson}>✅ Convert &amp; Fill In Story</button>
        </div>
      ) : (
        <>
          <p className="story-hint">
            🎙️ Start a line with <b>Character:</b> and it'll be read in a distinct voice — e.g. "Maya: Where did the cat go?".
            Any line without a name is read as calm narration. Punctuation gives a little emotion too (!, ?, ...).
          </p>
          <textarea
            ref={taRef}
            className="story-textarea"
            rows={8}
            placeholder={"Once upon a time, in a quiet village...\n\nMaya: Where did the cat go?\n\nThe cat was hiding under the table the whole time!"}
          ></textarea>
          <p className="story-hint" style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
            🎙️ Narrator voice (Gemini AI voice only):
            <select
              className="story-lang-select"
              value={narratorGenderRaw}
              onChange={e=>handleNarratorGenderChange(e.target.value)}
              title="Which voice pool the narrator (unattributed lines) is picked from"
            >
              <option value="">Any</option>
              <option value="girl">Female</option>
              <option value="boy">Male</option>
            </select>
          </p>
          {initialGenders && Object.keys(initialGenders).filter(n=>n!=="Narrator").length > 0 && (
            <p className="story-hint">
              🚻 Character genders set (from the last JSON paste): {Object.entries(initialGenders).filter(([n])=>n!=="Narrator").map(([n,g])=>`${n} (${g})`).join(", ")}.{" "}
              <button type="button" className="note-remove-btn" style={{padding:"1px 8px"}} onClick={()=>onGendersChange && onGendersChange(narratorGenderRaw ? {"Narrator": narratorGenderRaw} : {})}>✕ Clear</button>
            </p>
          )}
        </>
      )}
    </div>
  );
}

/* =========================================================
   STORY CARD — displays a story block with a Play button that reads it
   aloud via playStory() (different voice per character, light emotion
   from punctuation). Highlights the line currently being spoken.
   ========================================================= */
function StoryCard({note, index}){
  const [playing, setPlaying] = useState(false);
  const [activeIdx, setActiveIdx] = useState(-1);
  const [langOptions, setLangOptions] = useState(()=>getStoryLanguageOptions());
  const [selectedLang, setSelectedLang] = useState(()=>loadStoryVoiceLangPref());
  const [narrationMode, setNarrationModeState] = useState(()=>{
    try{ return localStorage.getItem(STORY_NARRATION_MODE_KEY) || "browser"; }catch(e){ return "browser"; }
  });
  const [showKeyInput, setShowKeyInput] = useState(false);
  const [keyDraft, setKeyDraft] = useState("");
  const [statusMsg, setStatusMsg] = useState("");
  const [progressText, setProgressText] = useState("");
  const [hasCachedAudio, setHasCachedAudio] = useState(false);
  // True from the moment playback ends with at least one failed part,
  // until the background retry loop (retryFailedPartsInBackground)
  // finishes — success or give-up. Used to block re-clicking Play
  // during that window so we don't fire a second, duplicate Gemini
  // request for the same still-downloading part.
  const [bgSyncing, setBgSyncing] = useState(false);
  // True only while the CURRENT playback session is the already-downloaded
  // (cached) audio — i.e. onProgress reported phase "cached". Fresh
  // Gemini generation (phase "loading"/"playing"/"saving") leaves this
  // false, since pause/speed only apply to cached playback.
  const [isCachedPlayback, setIsCachedPlayback] = useState(false);
  const [paused, setPaused] = useState(false);
  const hadFailedPartRef = useRef(false);
  const geminiKey = useGeminiApiKey();
  const controllerRef = useRef(null);
  const segments = useMemo(()=>parseStorySegments(note.text || ""), [note.text]);
  const cacheKey = useMemo(()=>storyAudioCacheKey(note.id, note.text || "", note.genders), [note.id, note.text, note.genders]);

  useEffect(()=>{
    let cancelled = false;
    getCachedStoryAudio(cacheKey).then(blob => { if(!cancelled) setHasCachedAudio(!!blob); });
    return ()=>{ cancelled = true; };
  }, [cacheKey]);

  // If any StoryCard triggers a global "clear ALL saved audio", every
  // other open StoryCard needs to drop its own "saved offline" flag too
  // — otherwise this card would keep saying "saved" even though its
  // cached file was just wiped.
  useEffect(()=>{
    function onGlobalClear(){
      getCachedStoryAudio(cacheKey).then(b => setHasCachedAudio(!!b));
    }
    window.addEventListener("story-audio-cache-cleared", onGlobalClear);
    return ()=> window.removeEventListener("story-audio-cache-cleared", onGlobalClear);
  }, [cacheKey]);

  useEffect(()=>{
    function refresh(){ setLangOptions(getStoryLanguageOptions()); }
    refresh();
    if('speechSynthesis' in window){
      speechSynthesis.addEventListener('voiceschanged', refresh);
      return ()=> speechSynthesis.removeEventListener('voiceschanged', refresh);
    }
  }, []);

  function stopPlayback(){
    if(controllerRef.current) controllerRef.current.stop();
    controllerRef.current = null;
    setPlaying(false);
    setActiveIdx(-1);
    setProgressText("");
    setIsCachedPlayback(false);
    setPaused(false);
  }
  function handlePauseResume(){
    if(!controllerRef.current) return;
    if(paused){ controllerRef.current.resume(); setPaused(false); }
    else{ controllerRef.current.pause(); setPaused(true); }
  }
  function handlePlay(forceRegenerate){
    if(playing){ stopPlayback(); return; }
    if(bgSyncing){
      // A background retry for a previously-skipped part is still in
      // flight for THIS story — starting a new session now would fire
      // a second, duplicate Gemini request for that same part. Block
      // and let the existing retry finish instead.
      setStatusMsg("⏳ Still recovering a missing part in the background — please wait a moment before playing again.");
      return;
    }
    if(narrationMode === "gemini" && !geminiKey){
      setShowKeyInput(true);
      return;
    }
    setStatusMsg("");
    setPlaying(true);
    if(narrationMode === "gemini"){
      hadFailedPartRef.current = false;
      setProgressText(forceRegenerate ? "✨ Gemini — regenerating…" : "✨ Gemini — checking saved audio…");
      controllerRef.current = playStoryWithGemini(note.text || "", {
        noteId: note.id,
        genders: note.genders,
        forceRegenerate: !!forceRegenerate,
        onSegment: idx => setActiveIdx(idx),
        onProgress: ({part, total, phase}) => {
          if(phase === "cached"){ setProgressText("💾 Playing saved audio (no internet needed)"); setIsCachedPlayback(true); }
          else if(phase === "loading"){ setProgressText(`✨ Gemini — generating part ${part} of ${total}…`); setIsCachedPlayback(false); }
          else if(phase === "saving"){ setProgressText("💾 Saving full narration to this device…"); setIsCachedPlayback(false); }
          else { setProgressText(`✨ Gemini — playing part ${part} of ${total}`); setIsCachedPlayback(false); }
        },
        onEnd: () => {
          controllerRef.current = null;
          setPlaying(false);
          setActiveIdx(-1);
          setProgressText("");
          setIsCachedPlayback(false);
          setPaused(false);
          // If any part failed during this session, playStoryWithGemini
          // kicks off retryFailedPartsInBackground() right after this
          // onEnd fires — so flip bgSyncing on now to block Play until
          // onDownloadComplete reports that loop is done.
          if(hadFailedPartRef.current) setBgSyncing(true);
          getCachedStoryAudio(cacheKey).then(b=>setHasCachedAudio(!!b));
        },
        onPartError: () => {
          hadFailedPartRef.current = true;
          setStatusMsg("⚠️ A part had trouble — skipped ahead so the story keeps going. Retrying quietly in the background…");
        },
        onPartRecovered: () => {
          // A previously-skipped part was filled in by a background
          // retry after the story ended; refresh the "saved offline"
          // indicator in case that completed the full-story cache.
          setStatusMsg("✅ Recovered a missing part in the background.");
          getCachedStoryAudio(cacheKey).then(b => setHasCachedAudio(!!b));
        },
        onDownloadComplete: ({success, missingParts}) => {
          // Fires once (success or not) when the background retry loop
          // finishes — this is the actual "are we done yet" answer, and
          // the point where it's safe to allow Play again.
          setBgSyncing(false);
          if(success){
            setStatusMsg("✅ Full story saved offline — no internet needed next time.");
          }else{
            setStatusMsg(`⚠️ Gave up after several tries — ${missingParts} part(s) still missing. Tap play again later to retry.`);
          }
          getCachedStoryAudio(cacheKey).then(b => setHasCachedAudio(!!b));
        },
        onFallback: () => { setProgressText("🔊 Standard voice (no Gemini key set)"); setStatusMsg("ℹ️ No Gemini key saved — played with the standard voice instead."); }
      });
    } else {
      setProgressText("🔊 Standard voice — playing");
      controllerRef.current = playStory(note.text || "", {
        lang: selectedLang,
        onSegment: idx => setActiveIdx(idx),
        onEnd: () => { controllerRef.current = null; setPlaying(false); setActiveIdx(-1); setProgressText(""); }
      });
    }
  }
  function handleLangChange(e){
    const v = e.target.value;
    setSelectedLang(v);
    saveStoryVoiceLangPref(v);
    // Switching languages mid-read would leave old-language audio queued;
    // simplest and least surprising is to stop and let them hit Play again.
    if(playing) stopPlayback();
  }
  function handleModeChange(mode){
    setNarrationModeState(mode);
    try{ localStorage.setItem(STORY_NARRATION_MODE_KEY, mode); }catch(e){}
    setStatusMsg("");
    if(playing) stopPlayback();
    if(mode === "gemini" && !geminiKey) setShowKeyInput(true);
  }
  function handleSaveKey(){
    saveGeminiApiKey(keyDraft.trim());
    setKeyDraft("");
    setShowKeyInput(false);
  }
  useEffect(()=>()=>{ if(controllerRef.current) controllerRef.current.stop(); }, []);

  return (
    <div className="note-card story-card">
      <div className="note-card-head">
        <span>🎭 {note.name && note.name.trim() ? note.name.trim() : "Story " + index}</span>
        <div className="story-head-controls">
          <select
            className="story-lang-select"
            value={narrationMode}
            onChange={e=>handleModeChange(e.target.value)}
            title="Narration voice engine"
          >
            <option value="browser">🔊 Standard voice</option>
            <option value="gemini">✨ Gemini AI voice</option>
          </select>
          {narrationMode === "browser" && langOptions.length > 0 && (
            <select
              className="story-lang-select"
              value={selectedLang}
              onChange={handleLangChange}
              title="Voice language for this story"
            >
              <option value="">🔊 Default (English)</option>
              {langOptions.filter(o=>o.code!=="en").map(o=>(
                <option key={o.code} value={o.code}>🔊 {o.label}</option>
              ))}
            </select>
          )}
          {narrationMode === "gemini" && (
            <button type="button" className="note-remove-btn" onClick={()=>setShowKeyInput(v=>!v)} title="Set your Gemini API key">
              🔑 {geminiKey ? "Change key" : "Set key"}
            </button>
          )}
          {narrationMode === "gemini" && hasCachedAudio && !playing && (
            <button
              type="button"
              className="note-remove-btn"
              title="Delete the saved audio for just THIS story and generate it fresh next time you press Play — other stories' saved audio is untouched"
              onClick={async ()=>{
                await deleteCachedStoryAudio(cacheKey);
                setHasCachedAudio(false);
                setStatusMsg("🗑️ This story's saved audio was cleared — next Play will regenerate it.");
              }}
            >
              🗑️ Clear this story's audio
            </button>
          )}
          {playing && isCachedPlayback && (
            <button
              type="button"
              className="note-remove-btn"
              onClick={handlePauseResume}
              title="Pause/resume the saved audio"
            >
              {paused ? "▶️ Resume" : "⏸ Pause"}
            </button>
          )}
          <button
            type="button"
            className="story-play-btn"
            onClick={()=>handlePlay(false)}
            disabled={bgSyncing && !playing}
            title={bgSyncing && !playing ? "Recovering a missing part in the background — please wait" : undefined}
          >
            {playing ? "⏹ Stop" : (bgSyncing ? "⏳ Syncing…" : "▶️ Play")}
          </button>
        </div>
      </div>
      {showKeyInput && (
        <div className="story-json-panel">
          <p className="story-hint">
            Paste a Gemini API key (from Google AI Studio) to use realistic AI narration instead of the device's built-in voice. It's saved only on this device and is never included in the cloud sync.
          </p>
          <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
            <input
              type="password"
              className="note-name-input"
              style={{flex:1, minWidth:180}}
              value={keyDraft}
              onChange={e=>setKeyDraft(e.target.value)}
              placeholder="Gemini API key"
            />
            <button type="button" className="btn btn-primary btn-sm" onClick={handleSaveKey} disabled={!keyDraft.trim()}>Save</button>
            <button type="button" className="btn btn-sm" onClick={()=>{ setShowKeyInput(false); setKeyDraft(""); }}>Cancel</button>
          </div>
        </div>
      )}
      {progressText && <p className="story-hint" style={{fontWeight:600}}>{progressText}</p>}
      {statusMsg && <p className="story-hint" style={{color:"#c44"}}>{statusMsg}</p>}
      {narrationMode === "gemini" && !progressText && !statusMsg && (
        <p className="story-hint">{hasCachedAudio ? "💾 Full narration saved on this device — plays instantly, no internet or API call needed." : "Not generated yet — the first Play will call Gemini once, then save the audio here for every replay after."}</p>
      )}
      <div className="story-body">
        {segments.length === 0 ? (
          <p className="story-line narration">This story is empty — add some text in the editor.</p>
        ) : segments.map((seg, i)=>(
          <p key={i} className={"story-line " + (seg.speaker ? "dialogue" : "narration") + (i === activeIdx ? " active" : "")}>
            {seg.speaker && <span className="story-speaker">{seg.speaker}:</span>}{seg.text}
          </p>
        ))}
      </div>
    </div>
  );
}

/* =========================================================
   LESSON EDIT FORM — lets the teacher type in the school's own topic content
   ========================================================= */
function LessonEditForm({lesson, accent, onSave, onCancel, defaultNoteType, storyMode}){
  const [title, setTitle] = useState(lesson.title || "");
  const [sub, setSub] = useState(lesson.sub || "");

  const initialNotes = useMemo(()=>{
    const n = getLessonNotes(lesson);
    const withIds = (n.length ? n : [{html:"", type: defaultNoteType === "story" ? "story" : "note"}]).map(b=>({
      id: b.id || newNoteId(), html: b.html || "", text: b.text || "",
      name: b.name || "", type: b.type === "story" ? "story" : "note",
      genders: (b.genders && typeof b.genders === "object") ? b.genders : {}
    }));
    return withIds;
  }, [lesson.id]);
  const [noteBlocks, setNoteBlocks] = useState(()=>initialNotes.map(b=>({id: b.id, name: b.name, type: b.type, genders: b.genders})));
  const initialHtmlRef = useRef(Object.fromEntries(initialNotes.filter(b=>b.type!=="story").map(b=>[b.id, b.html])));
  const initialTextRef = useRef(Object.fromEntries(initialNotes.filter(b=>b.type==="story").map(b=>[b.id, b.text])));
  const noteRefs = useRef({});
  const storyRefs = useRef({});

  function renameNote(id, name){
    setNoteBlocks(prev => prev.map(b => b.id === id ? {...b, name} : b));
  }
  function updateGenders(id, genders){
    setNoteBlocks(prev => prev.map(b => b.id === id ? {...b, genders} : b));
  }

  const initialVideos = useMemo(()=>{
    const v = getLessonVideos(lesson);
    return v.length ? v.slice() : [""];
  }, [lesson.id]);
  const [videoLinks, setVideoLinks] = useState(initialVideos);

  function addNote(type){
    const id = newNoteId();
    if(type === "story"){ initialTextRef.current[id] = ""; }
    else { initialHtmlRef.current[id] = ""; }
    setNoteBlocks(prev => [...prev, {id, name: "", type: type === "story" ? "story" : "note", genders: {}}]);
  }
  function removeNote(id){
    setNoteBlocks(prev => prev.length > 1 ? prev.filter(b=>b.id !== id) : prev);
    delete noteRefs.current[id];
    delete storyRefs.current[id];
    delete initialHtmlRef.current[id];
    delete initialTextRef.current[id];
  }
  function addVideo(){ setVideoLinks(prev => [...prev, ""]); }
  function removeVideo(idx){ setVideoLinks(prev => prev.filter((_,i)=>i!==idx)); }
  function updateVideo(idx, val){ setVideoLinks(prev => prev.map((v,i)=> i===idx ? val : v)); }

  function handleSave(){
    const notes = noteBlocks.map(b=>{
      if(b.type === "story"){
        const el = storyRefs.current[b.id];
        const text = el ? el.value : (initialTextRef.current[b.id] || "");
        return {id: b.id, type: "story", text, name: (b.name || "").trim(), genders: b.genders || {}};
      }
      const el = noteRefs.current[b.id];
      const html = el ? sanitizeHtml(el.innerHTML) : (initialHtmlRef.current[b.id] || "");
      return {id: b.id, type: "note", html, name: (b.name || "").trim()};
    });
    const youtubeUrls = videoLinks.map(v=>v.trim()).filter(Boolean);
    onSave({title: title.trim() || lesson.title, sub: sub.trim(), notes, youtubeUrls});
  }

  return (
    <div className="journal-page">
      <label className="field-label">{storyMode ? "Story Title" : "Topic Title"}</label>
      <input className="text-input" value={title} onChange={e=>setTitle(e.target.value)} placeholder={storyMode ? "e.g. The Turtle and the Monkey" : "Topic title"} />
      <label className="field-label">{storyMode ? "Short blurb (optional)" : "Subtitle (optional)"}</label>
      <input className="text-input" value={sub} onChange={e=>setSub(e.target.value)} placeholder={storyMode ? "e.g. A Filipino folktale about patience" : "Subtitle"} />

      <label className="field-label">{storyMode ? "🎭 Story Script" : "📝 Lesson Notes"}</label>
      {noteBlocks.map((b, i)=>(
        b.type === "story" ? (
          <StoryEditor
            key={b.id}
            initialText={initialTextRef.current[b.id] || ""}
            initialName={b.name || ""}
            initialGenders={b.genders || {}}
            onNameChange={name=>renameNote(b.id, name)}
            onGendersChange={genders=>updateGenders(b.id, genders)}
            registerRef={el=>{ storyRefs.current[b.id] = el; }}
            onRemove={()=>removeNote(b.id)}
            canRemove={noteBlocks.length > 1}
            index={i+1}
          />
        ) : (
          <NoteEditor
            key={b.id}
            initialHtml={initialHtmlRef.current[b.id] || ""}
            initialName={b.name || ""}
            onNameChange={name=>renameNote(b.id, name)}
            registerRef={el=>{ noteRefs.current[b.id] = el; }}
            onRemove={()=>removeNote(b.id)}
            canRemove={noteBlocks.length > 1}
            index={i+1}
          />
        )
      ))}
      <div className="note-add-row">
        {!storyMode && (
          <button type="button" className="btn btn-ghost btn-sm" onClick={()=>addNote("note")}>➕ Add Lesson Note</button>
        )}
        <button type="button" className="btn btn-ghost btn-sm" onClick={()=>addNote("story")}>🎭 Add Story</button>
      </div>

      {!storyMode && (
        <React.Fragment>
          <label className="field-label" style={{marginTop:22}}>📺 YouTube Video Links (optional)</label>
          {videoLinks.map((url, idx)=>{
            const trimmedUrl = url.trim();
            const previewId = trimmedUrl ? youtubeEmbedId(trimmedUrl) : null;
            const urlLooksBad = trimmedUrl.length > 0 && !previewId;
            return (
              <div key={idx} className="video-link-row">
                <div style={{display:"flex", gap:8, alignItems:"center"}}>
                  <input className="text-input" value={url} onChange={e=>updateVideo(idx, e.target.value)} placeholder="https://www.youtube.com/watch?v=..." />
                  {videoLinks.length > 1 && (
                    <button type="button" className="btn btn-ghost btn-sm" onClick={()=>removeVideo(idx)} title="Remove this video link">✕</button>
                  )}
                </div>
                {urlLooksBad && (
                  <div className="sub" style={{color:"var(--bad)", marginTop:4}}>
                    Hmm, that doesn't look like a YouTube link yet — paste the full video URL (or leave blank).
                  </div>
                )}
                {previewId && (
                  <div style={{marginTop:10}}>
                    <div className="video-embed">
                      <iframe
                        src={"https://www.youtube.com/embed/" + previewId}
                        title="YouTube video preview"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowFullScreen
                      ></iframe>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          <button type="button" className="btn btn-ghost btn-sm" onClick={addVideo} style={{marginTop:6}}>➕ Add Another YouTube Video</button>
        </React.Fragment>
      )}

      <div className="learn-footer" style={{gap:10}}>
        <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary" style={{background:accent}} onClick={handleSave}>💾 {storyMode ? "Save Story" : "Save Topic"}</button>
      </div>
    </div>
  );
}

/* =========================================================
   QUESTION BANK MANAGER — teacher inputs MCQs per topic
   ========================================================= */
const TOPIC_ALL = "__all__";
function normTopic(t){
  return (t || "").trim();
}
function bankTopics(questions){
  const set = new Set();
  (questions||[]).forEach(q=>{ if(normTopic(q.topic)) set.add(normTopic(q.topic)); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
// selectedTopics is an array; [TOPIC_ALL] means "every topic".
function toggleTopicSelection(selectedTopics, t, setSelectedTopics){
  if(t === TOPIC_ALL){ setSelectedTopics([TOPIC_ALL]); return; }
  let next = selectedTopics.includes(TOPIC_ALL) ? [] : selectedTopics.slice();
  next = next.includes(t) ? next.filter(x=>x!==t) : [...next, t];
  setSelectedTopics(next.length ? next : [TOPIC_ALL]);
}
function filterByTopics(questions, selectedTopics){
  if(!selectedTopics || selectedTopics.includes(TOPIC_ALL)) return questions;
  return questions.filter(q=>selectedTopics.includes(normTopic(q.topic)));
}
// Reusable multi-select topic checklist with a "select all" option.
function TopicPicker({topics, totalCount, selected, onToggle}){
  return (
    <div className="topic-picker">
      <label className="topic-all">
        <input type="checkbox" checked={selected.includes(TOPIC_ALL)} onChange={()=>onToggle(TOPIC_ALL)} />
        <span>All Topics ({totalCount})</span>
      </label>
      {topics.map(({name, count})=>(
        <label key={name}>
          <input type="checkbox" checked={!selected.includes(TOPIC_ALL) && selected.includes(name)} onChange={()=>onToggle(name)} />
          <span>{name} ({count})</span>
        </label>
      ))}
    </div>
  );
}

// ---- Quiz-start question-type filter (pure MCQ / pure True-False / pure Fill-in / all types) ----
const TYPE_ALL = "__all__";
const QUIZ_TYPE_OPTIONS = [
  {id:TYPE_ALL, label:"🎲 All Types"},
  {id:"mcq", label:"🔤 Multiple Choice"},
  {id:"tf", label:"✅ True / False"},
  {id:"emoji", label:"😊 Happy / Sad"},
  {id:"tama", label:"🇵🇭 Tama o Mali"},
  {id:"fill", label:"✍️ Fill in the Blank"},
  {id:"match", label:"🔗 Matching"},
  {id:"matchimg", label:"🖼️ Image Matching"},
  {id:"dragdrop", label:"🧩 Drag and Drop"},
  {id:"order", label:"📋 Ordering / Sequencing"},
  {id:"label", label:"🖼️ Label the Parts"},
  {id:"pattern", label:"🔢 Number Pattern"}
];
function filterByType(questions, selectedType){
  if(!selectedType || selectedType === TYPE_ALL) return questions;
  return questions.filter(q => (q.type || "mcq") === selectedType);
}
// Reusable single-select pill row for choosing which question type(s) a quiz should draw from.
// Only shows pills for types that actually have questions in the pool, plus "All Types".
function QuizTypePicker({pool, selected, onSelect}){
  const availTypes = QUESTION_TYPES.filter(t => pool.some(q => (q.type || "mcq") === t.id));
  if(availTypes.length < 2) return null; // nothing to choose between
  const options = [QUIZ_TYPE_OPTIONS[0], ...QUIZ_TYPE_OPTIONS.slice(1).filter(o => availTypes.some(t=>t.id===o.id))];
  return (
    <div className="type-picker">
