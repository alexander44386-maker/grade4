        <button
          type="button"
          key={o.id}
          className={"type-pill" + (selected===o.id ? " active" : "")}
          onClick={()=>onSelect(o.id)}
        >{o.label}</button>
      ))}
    </div>
  );
}

// Shows one JSON format example with a tap-to-copy button, so a JSON snippet
// can be grabbed on a phone without having to carefully select text by hand.
function CopyableJson({label, json, note}){
  const [copied, setCopied] = useState(false);
  function flashCopied(){
    setCopied(true);
    setTimeout(()=>setCopied(false), 1500);
  }
  function handleCopy(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(flashCopied).catch(()=>fallbackCopy());
    } else {
      fallbackCopy();
    }
  }
  function fallbackCopy(){
    try{
      const ta = document.createElement("textarea");
      ta.value = json;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      flashCopied();
    }catch(e){
      alert("Couldn't copy automatically — tap and hold the text to select and copy it.");
    }
  }
  return (
    <div className="json-format-row">
      <div className="json-format-label">{label}</div>
      <div className="json-format-code-wrap">
        <pre className="json-format-code">{json}</pre>
        <button type="button" className="btn btn-ghost btn-sm json-copy-btn" onClick={handleCopy}>
          {copied ? "✅ Copied!" : "📋 Copy"}
        </button>
      </div>
      {note && <p className="fill-hint" style={{marginTop:4}}>{note}</p>}
    </div>
  );
}

// Validates + normalizes a raw parsed-JSON array of question-like objects into
// the app's internal question shape for every supported type. Shared by the
// manual "Add via JSON" bulk import AND the AI "Generate" feature below, so
// both paths accept exactly the same formats (see the Sample Formats panel).
function normalizeQuestionsJSON(parsed, fallbackTopicRaw, forcedTopicRaw){
  const fallbackTopic = normTopic(fallbackTopicRaw);
  // When the person typed a specific topic/subtopic before generating, that
  // exact string is forced onto every generated question's "topic" field
  // (instead of trusting whatever string the model happened to write back),
  // so filtering by topic on the Quiz screen reliably picks these up.
  const forcedTopic = normTopic(forcedTopicRaw);
  return parsed.filter(p=>{
    if(!p || !p.q) return false;
    const t = String(p.type||"mcq").toLowerCase();
    if(t === "fill" || t === "fillblank" || t === "fill_in_the_blank") return !!p.answer;
    if(t === "tf" || t === "truefalse" || t === "true_false") return true;
    if(t === "emoji" || t === "happysad" || t === "happy_sad" || t === "emojitf") return true;
    if(t === "tama" || t === "tamaomali" || t === "tama_o_mali" || t === "tama o mali") return true;
    if(t === "match" || t === "matching") return Array.isArray(p.pairs) && p.pairs.length >= 2 && p.pairs.every(pr=>pr && pr.left && pr.right);
    if(t === "matchimg" || t === "matchimage" || t === "match_image" || t === "imagematching" || t === "image_matching"){
      return Array.isArray(p.pairs) && p.pairs.length >= 2 && p.pairs.every(pr=>pr && (pr.left || pr.image) && pr.right);
    }
    if(t === "dragdrop" || t === "drag_and_drop" || t === "drag-drop" || t === "sort"){
      return Array.isArray(p.categories) && p.categories.length >= 2 && Array.isArray(p.items) && p.items.length >= 2
        && p.items.every(it=>it && it.label && p.categories.includes(it.category));
    }
    if(t === "order" || t === "sequence" || t === "sequencing" || t === "ordering") return Array.isArray(p.items) && p.items.length >= 2;
    if(t === "label" || t === "labelparts" || t === "diagram") return !!String(p.image||"").trim();
    if(t === "pattern" || t === "numberpattern"){
      if(Array.isArray(p.items) && p.items.length >= 1) return p.items.some(it=>it && typeof it.answer !== "undefined");
      return Array.isArray(p.sequence) && p.sequence.length >= 1;
    }
    return Array.isArray(p.options) && p.options.length >= 2;
  }).map(p=>{
    const t = String(p.type||"mcq").toLowerCase();
    const topic = forcedTopic || normTopic(p.topic) || fallbackTopic;
    if(t === "fill" || t === "fillblank" || t === "fill_in_the_blank"){
      return {type:"fill", q:String(p.q), answer:String(p.answer), explain: p.explain ? String(p.explain) : "", topic};
    }
    if(t === "tf" || t === "truefalse" || t === "true_false"){
      let correct = 0;
      if(typeof p.correct === "boolean") correct = p.correct ? 0 : 1;
      else if(Number.isInteger(p.correct)) correct = p.correct;
      else if(typeof p.correct === "string") correct = /^false$/i.test(p.correct.trim()) ? 1 : 0;
      return {type:"tf", q:String(p.q), options:["True","False"], correct, explain: p.explain ? String(p.explain) : "", topic};
    }
    if(t === "emoji" || t === "happysad" || t === "happy_sad" || t === "emojitf"){
      let correct = 0;
      if(typeof p.correct === "boolean") correct = p.correct ? 0 : 1;
      else if(Number.isInteger(p.correct)) correct = p.correct;
      else if(typeof p.correct === "string") correct = /^(sad|false)$/i.test(p.correct.trim()) ? 1 : 0;
      return {type:"emoji", q:String(p.q), options:["😊 Happy","😢 Sad"], correct, explain: p.explain ? String(p.explain) : "", topic};
    }
    if(t === "tama" || t === "tamaomali" || t === "tama_o_mali" || t === "tama o mali"){
      let correct = 0;
      if(typeof p.correct === "boolean") correct = p.correct ? 0 : 1;
      else if(Number.isInteger(p.correct)) correct = p.correct;
      else if(typeof p.correct === "string") correct = /^(mali|false)$/i.test(p.correct.trim()) ? 1 : 0;
      return {type:"tama", q:String(p.q), options:["Tama","Mali"], correct, explain: p.explain ? String(p.explain) : "", topic};
    }
    if(t === "match" || t === "matching"){
      return {type:"match", q:String(p.q), pairs:p.pairs.map(pr=>({left:String(pr.left), right:String(pr.right)})), explain: p.explain ? String(p.explain) : "", topic};
    }
    if(t === "matchimg" || t === "matchimage" || t === "match_image" || t === "imagematching" || t === "image_matching"){
      return {type:"matchimg", q:String(p.q), pairs:p.pairs.map(pr=>({left:String(pr.left || pr.image), right:String(pr.right)})), explain: p.explain ? String(p.explain) : "", topic};
    }
    if(t === "dragdrop" || t === "drag_and_drop" || t === "drag-drop" || t === "sort"){
      return {type:"dragdrop", q:String(p.q), categories:p.categories.map(c=>String(c)), items:p.items.map(it=>({label:String(it.label), category:String(it.category)})), explain: p.explain ? String(p.explain) : "", topic};
    }
    if(t === "order" || t === "sequence" || t === "sequencing" || t === "ordering"){
      return {type:"order", q:String(p.q), items:p.items.map(it=>String(it)), explain: p.explain ? String(p.explain) : "", topic};
    }
    if(t === "label" || t === "labelparts" || t === "diagram"){
      const points = Array.isArray(p.points) ? p.points.map(pt=>({x:Number(pt.x)||0, y:Number(pt.y)||0, label:String(pt.label||"")})) : [];
      return {type:"label", q:String(p.q), image:String(p.image), points, explain: p.explain ? String(p.explain) : "", topic};
    }
    if(t === "pattern" || t === "numberpattern"){
      let items;
      if(Array.isArray(p.items) && p.items.length){
        items = p.items.map(it=> (it && typeof it.answer !== "undefined") ? {kind:"blank", answer:String(it.answer)} : {kind:"num", value:String(it && typeof it.value !== "undefined" ? it.value : it)});
      } else {
        const blanks = Array.isArray(p.blanks) ? p.blanks.slice() : [];
        let bi = 0;
        items = (p.sequence||[]).map(v=>{
          const isBlank = v === null || v === "" || (typeof v === "string" && /^(_+|blank)$/i.test(v.trim()));
          if(isBlank){
            const ans = blanks[bi] !== undefined ? String(blanks[bi]) : "";
            bi++;
            return {kind:"blank", answer:ans};
          }
          return {kind:"num", value:String(v)};
        });
      }
      return {type:"pattern", q:String(p.q), items, explain: p.explain ? String(p.explain) : "", topic};
    }
    return {type:"mcq", q:String(p.q), options:p.options.map(o=>String(o)), correct: Number.isInteger(p.correct)?p.correct:0, explain: p.explain ? String(p.explain) : "", topic};
  });
}

// ============================================================
// AI question generation (Gemini text model). Reuses the same
// on-device-only API key already used for story narration (see
// GEMINI_KEY_STORAGE / loadGeminiApiKey / saveGeminiApiKey above) so the
// student's family only has to paste one free Gemini key for the whole app.
// ============================================================
// Aug 2026: Gemini 3.6 Flash is the current free-tier Flash model. Note that
// starting with 3.6 Flash, Google deprecated the temperature/top_p/top_k
// sampling params — generationConfig below intentionally omits them.
const GEMINI_TEXT_MODEL = "gemini-3.6-flash";
const GEMINI_TEXT_URL = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_TEXT_MODEL}:generateContent`;

const GEMINI_DIFFICULTY_PHRASING = {
  easy: "Keep it EASY: short sentences, the most basic recall-level facts straight from the notes, and obviously-different wrong answers.",
  medium: "Keep it at a normal Grade-4 difficulty: mostly recall with a couple of questions that need a little thought, and wrong answers that are plausible but not tricky.",
  hard: "Make it a bit CHALLENGING for a strong Grade 4 student: require connecting two ideas from the notes, not just single-fact recall, and use wrong-answer options that reflect common misconceptions."
};

function stripHtml(html){
  return String(html||"")
    .replace(/<[^>]*>/g, " ")
    .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&#39;/g, "'").replace(/&quot;/g, '"')
    .replace(/\s+/g, " ").trim();
}

// Builds the notes/story context handed to Gemini, and reports back whether
// this lesson has any Story-type note so the prompt can switch into
// story-comprehension mode. Regular notes carry HTML in n.html; Story notes
// carry plain "Speaker: line" text in n.text (see parseStorySegments) — the
// old version of this function only ever read n.html, so a lesson made up
// entirely of a Story note silently sent NO content to Gemini at all.
function buildLessonContext(lesson){
  const notes = getLessonNotes(lesson);
  const noteChunks = [];
  const storyChunks = [];
  notes.forEach(n=>{
    if(n && n.type === "story"){
      const t = String(n.text || "").trim();
      if(t) storyChunks.push(t);
    } else {
      const t = stripHtml(n && n.html || "");
      if(t) noteChunks.push(t);
    }
  });
  let ctx = "Topic title: " + (lesson.title || "");
  if(lesson.sub) ctx += "\nTopic subtitle: " + lesson.sub;
  if(noteChunks.length){
    ctx += "\n\nLesson notes the student is studying:\n" + noteChunks.join("\n").slice(0, 6000);
  }
  if(storyChunks.length){
    ctx += "\n\nStory the student is reading for this lesson (lines written as \"Character: line\" are that character speaking; other lines are narration):\n" + storyChunks.join("\n\n---\n\n").slice(0, 6000);
  }
  if(!noteChunks.length && !storyChunks.length){
    ctx += "\n\n(no notes written yet — write reasonable questions based on the title/subtitle alone)";
  }
  return { text: ctx, hasStory: storyChunks.length > 0, hasNotes: noteChunks.length > 0 };
}

const GENERATE_TYPE_LIBRARY = {
  mcq: `- Multiple Choice: {"type":"mcq","q":"...","options":["A","B","C","D"],"correct":0,"explain":"...","topic":"..."} — "correct" is the 0-based index of the right option in "options". Distractors must be plausible wrong answers (common misconceptions, near-misses), not silly or obviously wrong.`,
  tf: `- True / False: {"type":"tf","q":"...","correct":true,"explain":"...","topic":"..."} — "correct" must be the JSON boolean true if the statement in "q" is factually TRUE, or false if the statement is factually FALSE. Judge this only from whether the statement itself is correct — never write a numeric index here, and never flip it to mean something else.`,
  emoji: `- Happy / Sad (agree-or-disagree with a statement): {"type":"emoji","q":"...","correct":true,"explain":"...","topic":"..."} — "correct" must be the JSON boolean true if a student should react 😊 Happy because the statement is correct/true, or false if they should react 😢 Sad because the statement is incorrect/false.`,
  tama: `- Tama o Mali (Filipino True/False — only use this for Filipino-language lessons): {"type":"tama","q":"...","correct":true,"explain":"...","topic":"..."} — "q" must be a Filipino statement (pangungusap). "correct" must be the JSON boolean true if the statement is "Tama" (tama/totoo), or false if it is "Mali" (mali/hindi tama).`,
  fill: `- Fill in the Blank: {"type":"fill","q":"... ___ ...","answer":"...","explain":"...","topic":"..."}`,
  match: `- Matching: {"type":"match","q":"...","pairs":[{"left":"...","right":"..."},{"left":"...","right":"..."}],"explain":"...","topic":"..."} — at least 3 pairs.`,
  dragdrop: `- Drag and Drop (sorting into categories): {"type":"dragdrop","q":"...","categories":["Cat A","Cat B"],"items":[{"label":"...","category":"Cat A"},{"label":"...","category":"Cat B"}],"explain":"...","topic":"..."} — at least 4 items across the categories.`,
  order: `- Ordering / Sequencing: {"type":"order","q":"...","items":["step 1","step 2","step 3"],"explain":"...","topic":"..."} — items listed in the correct order (they'll be shuffled for the student).`
};
const GENERATE_TYPE_LABELS = {mcq:"Multiple Choice", tf:"True / False", emoji:"Happy / Sad", tama:"Tama o Mali", fill:"Fill in the Blank", match:"Matching", dragdrop:"Drag and Drop", order:"Ordering"};
const GENERATE_TYPE_ORDER = ["mcq","tf","emoji","tama","fill","match","dragdrop","order"];
// Recommended question-count range per type (per single generate call), based
// on where Gemini Flash quality/JSON-validity starts to degrade. When more
// than one type is selected, the mixed-batch range is used instead — a
// single-type range wouldn't make sense once questions have to be split
// across several structurally different formats.
const GENERATE_COUNT_RANGES = {
  mcq: {min:10, max:12}, tf: {min:10, max:12}, emoji: {min:10, max:12}, tama: {min:10, max:12}, fill: {min:10, max:12},
  match: {min:6, max:8}, dragdrop: {min:5, max:6}, order: {min:5, max:6}
};
const GENERATE_COUNT_RANGE_MIXED = {min:6, max:10};
function getGenerateCountRange(typesSet){
  if(typesSet && typesSet.size === 1){
    const only = Array.from(typesSet)[0];
    return GENERATE_COUNT_RANGES[only] || GENERATE_COUNT_RANGE_MIXED;
  }
  return GENERATE_COUNT_RANGE_MIXED;
}
// Builds the full list of selectable counts for the "How many questions?"
// dropdown: the recommended min..max range, PLUS a couple of smaller,
// quicker-to-generate options — half of the range's min and half of its
// max (rounded, at least 1) — so e.g. a 6-8 range also offers 3 and 4.
function getGenerateCountOptions(typesSet){
  const range = getGenerateCountRange(typesSet);
  const full = [];
  for(let v=range.min; v<=range.max; v++) full.push(v);
  const halfMin = Math.max(1, Math.round(range.min/2));
  const halfMax = Math.max(1, Math.round(range.max/2));
  const extras = [halfMin, halfMax].filter(v=>v < range.min);
  return Array.from(new Set([...extras, ...full])).sort((a,b)=>a-b);
}

// Difficulty is single-select on purpose: generating covers one difficulty
// per API call, so letting the person pick more than one would mean firing
// an extra Gemini request per extra difficulty for the same "Generate" tap.
async function generateQuestionsForLesson(apiKey, lesson, options){
  const opts = options || {};
  const n = Math.max(1, Math.min(20, opts.count || 6));
  const chosenTypes = (opts.types && opts.types.length) ? opts.types : GENERATE_TYPE_ORDER;
  const typeSpec = chosenTypes.map(t=>GENERATE_TYPE_LIBRARY[t]).filter(Boolean).join("\n");
  const difficulty = GEMINI_DIFFICULTY_PHRASING[opts.difficulty] || GEMINI_DIFFICULTY_PHRASING.medium;
  const trimmedTopic = opts.topic && opts.topic.trim() ? opts.topic.trim() : "";
  const topicLine = trimmedTopic
    ? `Focus every question specifically on this topic/subtopic: "${trimmedTopic}". This topic MUST be something that actually appears in the lesson content below — if it doesn't clearly appear there, pick the closest matching part of the lesson content instead of inventing new material for it.`
    : "";
  const mixLine = chosenTypes.length > 1
    ? `Use a MIX of the ${chosenTypes.length} allowed question type(s) below, spread as evenly as reasonable — don't make them all the same type.`
    : `Use ONLY the single allowed question type below for every question.`;
  const existingQs = (opts.existingQuestions || []).map(q=>String(q||"").trim()).filter(Boolean);
  const noDupeBlock = existingQs.length
    ? `\nIMPORTANT — check this topic's existing question bank below (this includes questions from your own last generation for this lesson, if any) before writing new ones. Do NOT repeat these questions, and do NOT write near-duplicates that just reword the same fact — cover different facts, details, or angles from the notes instead:\n${existingQs.slice(-20).map((q,i)=>`${i+1}. ${q}`).join("\n")}\n`
    : "";

  const context = buildLessonContext(lesson);

  // Grounding rule: whatever the lesson actually contains (in the Learn
  // tab — regular notes and/or a Story note) is the only source of TOPICS
  // for these questions. General/world knowledge may be used to phrase a
  // question clearly, write a kid-friendly explanation, or build plausible
  // wrong-answer options, but it must never introduce a fact, subtopic, or
  // detail that isn't actually present in the lesson content below.
  const groundingLine = `Every question must be about something that literally appears in the lesson content below — do not add outside facts, subtopics, or trivia that aren't in it. You may use your general knowledge only to phrase questions clearly, write kid-friendly explanations, and build plausible wrong-answer options — never to introduce new topics.`;

  // Story-specific mode: when the lesson content is (or includes) a Story
  // note, question-writing switches to plain reading-comprehension —
  // characters, what happens, and the story's lesson/moral — instead of
  // interpretive or "what do you think" style questions.
  const storyLine = context.hasStory
    ? `\nThis lesson includes a STORY. For any question based on the story, stick to concrete reading-comprehension: who the characters are, what happens in the story (events in the order they happen), and the lesson/moral of the story. Do NOT write interpretive, opinion-based, "what do you think" or "how do you feel" questions, and do not ask about writing style, literary devices, or the author's intent.${context.hasNotes ? " (If this lesson also has regular notes alongside the story, questions about those notes can be normal fact-recall as usual.)" : ""}`
    : "";

  const prompt = `You are writing a quiz question bank for a Grade 4 elementary student.
${context.text}

Write exactly ${n} quiz questions that check understanding of the lesson content above, in simple Grade-4-appropriate English (or Filipino only if the lesson content itself is in Filipino). ${mixLine} Wrong-answer options must be genuinely plausible, not throwaway jokes.
${groundingLine}
${storyLine}
${topicLine}
${difficulty}
${noDupeBlock}
Only use these question "type" values, matching these exact JSON shapes (omit "topic" if you don't have a natural one):
${typeSpec}

Return ONLY a raw JSON array of question objects — no markdown code fences, no commentary, no surrounding text.`;

  const res = await fetch(`${GEMINI_TEXT_URL}?key=${encodeURIComponent(apiKey)}`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      contents: [{role:"user", parts:[{text: prompt}]}],
      generationConfig: {responseMimeType: "application/json"}
    })
  });
  if(!res.ok){
    let detail = "";
    try{ detail = (await res.json()).error?.message || ""; }catch(e){}
    throw new Error("Gemini request failed (" + res.status + ")" + (detail ? ": " + detail : ""));
  }
  const data = await res.json();
  const text = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || [])
    .map(p=>p.text || "").join("").trim();
  if(!text) throw new Error("Gemini returned an empty response.");
  const cleanedText = text.replace(/^```(json)?/i, "").replace(/```$/, "").trim();
  let parsed;
  try{
    parsed = JSON.parse(cleanedText);
    if(!Array.isArray(parsed)) throw new Error("not an array");
  }catch(e){
    throw new Error("Gemini's response wasn't valid JSON.");
  }
  return normalizeQuestionsJSON(parsed, lesson.title || "", trimmedTopic);
}

function QuestionBankManager({lessonId, questions, accent, onChange}){
  const [bulkText, setBulkText] = useState("");
  const [bulkTopic, setBulkTopic] = useState("");
  const [selected, setSelected] = useState(new Set());
  const [editingIndex, setEditingIndex] = useState(null);
  const [draft, setDraft] = useState(null);
  const [showBulkImport, setShowBulkImport] = useState(false);
  const [showSampleFormats, setShowSampleFormats] = useState(false);

  function startEdit(i){
    setEditingIndex(i);
    setDraft(JSON.parse(JSON.stringify(questions[i])));
  }
  function cancelEdit(){
    setEditingIndex(null);
    setDraft(null);
  }
  function saveEdit(){
    if(!draft || !String(draft.q||"").trim()){ alert("Question text can't be empty."); return; }
    const t = draft.type || "mcq";
    if((t === "mcq" || t === "tf" || t === "tama" || t === "emoji")){
      if(!draft.options || draft.options.some(o=>!String(o).trim())){ alert("All choices need text."); return; }
    }
    if(t === "fill" && !String(draft.answer||"").trim()){ alert("Answer can't be empty."); return; }
    if((t === "match" || t === "matchimg") && (!draft.pairs || draft.pairs.some(p=>!String(p.left).trim() || !String(p.right).trim()))){ alert("All match pairs need both sides filled in."); return; }
    if(t === "dragdrop" && (!draft.items || draft.items.some(it=>!String(it.label).trim()) || !draft.categories || draft.categories.some(c=>!String(c).trim()))){ alert("All items and categories need text."); return; }
    if(t === "order" && (!draft.items || draft.items.some(it=>!String(it).trim()))){ alert("All steps need text."); return; }
    if(t === "label" && (!String(draft.image||"").trim() || !draft.points || draft.points.length < 1 || draft.points.some(p=>!String(p.label).trim()))){ alert("Add an image URL, and a label for every pin (click the picture to add a pin)."); return; }
    if(t === "pattern" && (!draft.items || draft.items.filter(it=>it.kind==="blank").length < 1 || draft.items.some(it=> it.kind==="blank" ? !String(it.answer||"").trim() : !String(it.value||"").trim()))){ alert("Add at least one blank, and fill in every number and blank answer."); return; }
    const next = questions.slice();
    next[editingIndex] = draft;
    onChange(next);
    setEditingIndex(null);
    setDraft(null);
  }

  function updateDraft(field, value){
    setDraft(prev=>({...prev, [field]:value}));
  }
  function updateOption(oi, value){
    setDraft(prev=>{
      const options = prev.options.slice();
      options[oi] = value;
      return {...prev, options};
    });
  }
  function addOption(){
    setDraft(prev=>({...prev, options:[...prev.options, ""]}));
  }
  function removeOption(oi){
    setDraft(prev=>{
      if(prev.options.length <= 2) return prev;
      const options = prev.options.slice();
      options.splice(oi,1);
      let correct = prev.correct;
      if(correct === oi) correct = 0;
      else if(correct > oi) correct = correct - 1;
      return {...prev, options, correct};
    });
  }
  function updatePair(pi, side, value){
    setDraft(prev=>{
      const pairs = prev.pairs.map((p,i)=> i===pi ? {...p, [side]:value} : p);
      return {...prev, pairs};
    });
  }
  function addPair(){
    setDraft(prev=>({...prev, pairs:[...prev.pairs, {left:"", right:""}]}));
  }
  function removePair(pi){
    setDraft(prev=>{
      if(prev.pairs.length <= 2) return prev;
      const pairs = prev.pairs.slice();
      pairs.splice(pi,1);
      return {...prev, pairs};
    });
  }
  function updateDDItem(ii, field, value){
    setDraft(prev=>{
      const items = prev.items.map((it,i)=> i===ii ? {...it, [field]:value} : it);
      return {...prev, items};
    });
  }
  function addDDItem(){
    setDraft(prev=>({...prev, items:[...prev.items, {label:"", category:(prev.categories&&prev.categories[0])||""}]}));
  }
  function removeDDItem(ii){
    setDraft(prev=>{
      if(prev.items.length <= 2) return prev;
      const items = prev.items.slice();
      items.splice(ii,1);
      return {...prev, items};
    });
  }
  function updateDDCategory(ci, value){
    setDraft(prev=>{
      const oldVal = prev.categories[ci];
      const categories = prev.categories.slice();
      categories[ci] = value;
      const items = prev.items.map(it=> it.category===oldVal ? {...it, category:value} : it);
      return {...prev, categories, items};
    });
  }
  function addDDCategory(){
    setDraft(prev=>({...prev, categories:[...prev.categories, ""]}));
  }
  function removeDDCategory(ci){
    setDraft(prev=>{
      if(prev.categories.length <= 2) return prev;
      const removed = prev.categories[ci];
      const categories = prev.categories.slice();
      categories.splice(ci,1);
      const items = prev.items.map(it=> it.category===removed ? {...it, category:categories[0]||""} : it);
      return {...prev, categories, items};
    });
  }
  function updateOrderItem(ii, value){
    setDraft(prev=>{
      const items = prev.items.slice();
      items[ii] = value;
      return {...prev, items};
    });
  }
  function addOrderItem(){
    setDraft(prev=>({...prev, items:[...prev.items, ""]}));
  }
  function removeOrderItem(ii){
    setDraft(prev=>{
      if(prev.items.length <= 2) return prev;
      const items = prev.items.slice();
      items.splice(ii,1);
      return {...prev, items};
    });
  }

  // ---- Label the Parts (image + pins) ----
  function updateLabelImage(value){
    setDraft(prev=>({...prev, image:value}));
  }
  function updateLabelPoint(pi, value){
    setDraft(prev=>{
      const points = prev.points.map((p,i)=> i===pi ? {...p, label:value} : p);
      return {...prev, points};
    });
  }
  function removeLabelPoint(pi){
    setDraft(prev=>{
      const points = prev.points.slice();
      points.splice(pi,1);
      return {...prev, points};
    });
  }
  function handleLabelImageClick(e){
    const rect = e.currentTarget.getBoundingClientRect();
    if(!rect.width || !rect.height) return;
    const xPct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
    const yPct = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
    setDraft(prev=>({...prev, points:[...(prev.points||[]), {x:Math.round(xPct*10)/10, y:Math.round(yPct*10)/10, label:""}]}));
  }

  // ---- Number Pattern (sequence of numbers + blanks) ----
  function updatePatternItem(ii, field, value){
    setDraft(prev=>{
      const items = prev.items.map((it,i)=> i===ii ? {...it, [field]:value} : it);
      return {...prev, items};
    });
  }
  function togglePatternKind(ii){
    setDraft(prev=>{
      const items = prev.items.map((it,i)=> i===ii ? (it.kind==="blank" ? {kind:"num", value:""} : {kind:"blank", answer:""}) : it);
      return {...prev, items};
    });
  }
  function addPatternItem(kind){
    setDraft(prev=>({...prev, items:[...(prev.items||[]), kind==="blank" ? {kind:"blank", answer:""} : {kind:"num", value:""}]}));
  }
  function removePatternItem(ii){
    setDraft(prev=>{
      if((prev.items||[]).length <= 1) return prev;
      const items = prev.items.slice();
      items.splice(ii,1);
      return {...prev, items};
    });
  }

  const topics = bankTopics(questions);
  const noTopicCount = questions.filter(q=>!normTopic(q.topic)).length;
  const allSelected = questions.length > 0 && selected.size === questions.length;

  function toggleSelect(i){
    setSelected(prev=>{
      const next = new Set(prev);
      if(next.has(i)) next.delete(i); else next.add(i);
      return next;
    });
  }
  function toggleSelectAll(){
    setSelected(allSelected ? new Set() : new Set(questions.map((_,i)=>i)));
  }

  function handleDeleteOne(i){
    if(!confirm("Delete this question?")) return;
    const next = questions.slice();
    next.splice(i,1);
    onChange(next);
    setSelected(prev=>{
      const shifted = new Set();
      prev.forEach(idx=>{ if(idx!==i) shifted.add(idx>i ? idx-1 : idx); });
      return shifted;
    });
  }

  function handleDeleteSelected(){
    if(selected.size===0) return;
    if(!confirm("Delete " + selected.size + " selected question(s)?")) return;
    onChange(questions.filter((_,i)=>!selected.has(i)));
    setSelected(new Set());
  }

  function handleDeleteAll(){
    if(questions.length===0) return;
    if(!confirm("Delete all " + questions.length + " questions in this bank? This can't be undone.")) return;
    onChange([]);
    setSelected(new Set());
  }

  function handleDeleteTopic(topic){
    const label = topic ? topic : "No topic";
    const count = questions.filter(q=>normTopic(q.topic)===topic).length;
    if(count===0) return;
    if(!confirm("Delete all " + count + " question(s) in \"" + label + "\"?")) return;
    onChange(questions.filter(q=>normTopic(q.topic)!==topic));
    setSelected(new Set());
  }

  function handleDeleteType(type){
    const label = (QUESTION_TYPES.find(t=>t.id===type)||{}).label || type;
    const count = questions.filter(q=>(q.type||"mcq")===type).length;
    if(count===0) return;
    if(!confirm("Delete all " + count + " \"" + label + "\" question(s)? This can't be undone.")) return;
    onChange(questions.filter(q=>(q.type||"mcq")!==type));
    setSelected(new Set());
  }

  function triggerDownload(filename, data){
    try{
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 200);
    }catch(e){ alert("Couldn't create that download."); }
  }

  function slugify(s){
    return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "questions";
  }

  function handleDownloadTopic(topic){
    const list = questions.filter(q=>normTopic(q.topic)===topic);
    if(!list.length) return;
    triggerDownload(slugify(lessonId) + "-" + slugify(topic || "no-topic") + ".json", list);
  }

  function handleDownloadType(type){
    const list = questions.filter(q=>(q.type||"mcq")===type);
    if(!list.length) return;
    triggerDownload(slugify(lessonId) + "-" + slugify(type) + ".json", list);
  }

  function handleDownloadAll(){
    if(!questions.length) return;
    triggerDownload(slugify(lessonId) + "-all-questions.json", questions);
  }

  function handleBulkImport(mode){
    let parsed;
    try{
      parsed = JSON.parse(bulkText);
      if(!Array.isArray(parsed)) throw new Error("not an array");
    }catch(e){
      alert("Couldn't read that as a JSON list of questions. Expected format:\n[{\"q\":\"...\", \"options\":[\"A\",\"B\",\"C\",\"D\"], \"correct\":0, \"explain\":\"...\"}]\nAlso supports tf, tama, fill, match, dragdrop, order, label, and pattern types — see the format notes below the bank.");
      return;
    }
    const fallbackTopic = normTopic(bulkTopic);
    const cleaned = parsed.filter(p=>{
      if(!p || !p.q) return false;
      const t = String(p.type||"mcq").toLowerCase();
      if(t === "fill" || t === "fillblank" || t === "fill_in_the_blank") return !!p.answer;
      if(t === "tf" || t === "truefalse" || t === "true_false") return true;
      if(t === "emoji" || t === "happysad" || t === "happy_sad" || t === "emojitf") return true;
      if(t === "tama" || t === "tamaomali" || t === "tama_o_mali" || t === "tama o mali") return true;
      if(t === "match" || t === "matching") return Array.isArray(p.pairs) && p.pairs.length >= 2 && p.pairs.every(pr=>pr && pr.left && pr.right);
      if(t === "matchimg" || t === "matchimage" || t === "match_image" || t === "imagematching" || t === "image_matching"){
        return Array.isArray(p.pairs) && p.pairs.length >= 2 && p.pairs.every(pr=>pr && (pr.left || pr.image) && pr.right);
      }
      if(t === "dragdrop" || t === "drag_and_drop" || t === "drag-drop" || t === "sort"){
        return Array.isArray(p.categories) && p.categories.length >= 2 && Array.isArray(p.items) && p.items.length >= 2
          && p.items.every(it=>it && it.label && p.categories.includes(it.category));
      }
      if(t === "order" || t === "sequence" || t === "sequencing" || t === "ordering") return Array.isArray(p.items) && p.items.length >= 2;
      if(t === "label" || t === "labelparts" || t === "diagram") return !!String(p.image||"").trim();
      if(t === "pattern" || t === "numberpattern"){
        if(Array.isArray(p.items) && p.items.length >= 1) return p.items.some(it=>it && typeof it.answer !== "undefined");
        return Array.isArray(p.sequence) && p.sequence.length >= 1;
      }
      return Array.isArray(p.options) && p.options.length >= 2;
    }).map(p=>{
      const t = String(p.type||"mcq").toLowerCase();
      const topic = normTopic(p.topic) || fallbackTopic;
      if(t === "fill" || t === "fillblank" || t === "fill_in_the_blank"){
        return {type:"fill", q:String(p.q), answer:String(p.answer), explain: p.explain ? String(p.explain) : "", topic};
      }
      if(t === "tf" || t === "truefalse" || t === "true_false"){
        let correct = 0;
        if(typeof p.correct === "boolean") correct = p.correct ? 0 : 1;
        else if(Number.isInteger(p.correct)) correct = p.correct;
        else if(typeof p.correct === "string") correct = /^false$/i.test(p.correct.trim()) ? 1 : 0;
        return {type:"tf", q:String(p.q), options:["True","False"], correct, explain: p.explain ? String(p.explain) : "", topic};
      }
      if(t === "emoji" || t === "happysad" || t === "happy_sad" || t === "emojitf"){
        let correct = 0;
        if(typeof p.correct === "boolean") correct = p.correct ? 0 : 1;
        else if(Number.isInteger(p.correct)) correct = p.correct;
        else if(typeof p.correct === "string") correct = /^(sad|false)$/i.test(p.correct.trim()) ? 1 : 0;
        return {type:"emoji", q:String(p.q), options:["😊 Happy","😢 Sad"], correct, explain: p.explain ? String(p.explain) : "", topic};
      }
      if(t === "tama" || t === "tamaomali" || t === "tama_o_mali" || t === "tama o mali"){
        let correct = 0;
        if(typeof p.correct === "boolean") correct = p.correct ? 0 : 1;
        else if(Number.isInteger(p.correct)) correct = p.correct;
        else if(typeof p.correct === "string") correct = /^(mali|false)$/i.test(p.correct.trim()) ? 1 : 0;
        return {type:"tama", q:String(p.q), options:["Tama","Mali"], correct, explain: p.explain ? String(p.explain) : "", topic};
      }
      if(t === "match" || t === "matching"){
        return {type:"match", q:String(p.q), pairs:p.pairs.map(pr=>({left:String(pr.left), right:String(pr.right)})), explain: p.explain ? String(p.explain) : "", topic};
      }
      if(t === "matchimg" || t === "matchimage" || t === "match_image" || t === "imagematching" || t === "image_matching"){
        return {type:"matchimg", q:String(p.q), pairs:p.pairs.map(pr=>({left:String(pr.left || pr.image), right:String(pr.right)})), explain: p.explain ? String(p.explain) : "", topic};
      }
      if(t === "dragdrop" || t === "drag_and_drop" || t === "drag-drop" || t === "sort"){
        return {type:"dragdrop", q:String(p.q), categories:p.categories.map(c=>String(c)), items:p.items.map(it=>({label:String(it.label), category:String(it.category)})), explain: p.explain ? String(p.explain) : "", topic};
      }
      if(t === "order" || t === "sequence" || t === "sequencing" || t === "ordering"){
        return {type:"order", q:String(p.q), items:p.items.map(it=>String(it)), explain: p.explain ? String(p.explain) : "", topic};
      }
      if(t === "label" || t === "labelparts" || t === "diagram"){
        const points = Array.isArray(p.points) ? p.points.map(pt=>({x:Number(pt.x)||0, y:Number(pt.y)||0, label:String(pt.label||"")})) : [];
        return {type:"label", q:String(p.q), image:String(p.image), points, explain: p.explain ? String(p.explain) : "", topic};
      }
      if(t === "pattern" || t === "numberpattern"){
        let items;
        if(Array.isArray(p.items) && p.items.length){
          items = p.items.map(it=> (it && typeof it.answer !== "undefined") ? {kind:"blank", answer:String(it.answer)} : {kind:"num", value:String(it && typeof it.value !== "undefined" ? it.value : it)});
        } else {
          const blanks = Array.isArray(p.blanks) ? p.blanks.slice() : [];
          let bi = 0;
          items = (p.sequence||[]).map(v=>{
            const isBlank = v === null || v === "" || (typeof v === "string" && /^(_+|blank)$/i.test(v.trim()));
            if(isBlank){
              const ans = blanks[bi] !== undefined ? String(blanks[bi]) : "";
              bi++;
              return {kind:"blank", answer:ans};
            }
            return {kind:"num", value:String(v)};
          });
        }
        return {type:"pattern", q:String(p.q), items, explain: p.explain ? String(p.explain) : "", topic};
      }
      return {type:"mcq", q:String(p.q), options:p.options.map(o=>String(o)), correct: Number.isInteger(p.correct)?p.correct:0, explain: p.explain ? String(p.explain) : "", topic};
    });
    if(!cleaned.length){ alert("No valid questions found in that JSON."); return; }
    const next = mode === "replace" ? cleaned : [...questions, ...cleaned];
    onChange(next);
    setBulkText("");
    setBulkTopic("");
    setSelected(new Set());
  }

  if(showSampleFormats){
    return (
      <div className="journal-page">
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>
          <h3 style={{margin:0}}>📍 Sample Formats</h3>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowSampleFormats(false)}>← Back to Question Bank</button>
        </div>
        <p className="sub">Paste an array of questions in the "➕ JSON" screen — use the copy button on any format below as a starting point.</p>
        <CopyableJson label="🔤 Multiple Choice"
          json={'[{"q":"...","options":["A","B","C","D"],"correct":0,"explain":"...","topic":"Comparing"}]'} />
        <CopyableJson label="✅ True / False"
          json={'[{"type":"tf","q":"...","correct":0,"explain":"...","topic":"Ordering"}]'}
          note='correct: 0 = True, 1 = False' />
        <CopyableJson label="😊 Happy / Sad"
          json={'[{"type":"emoji","q":"...","correct":0,"explain":"...","topic":"Ordering"}]'}
          note='correct: 0 = Happy 😊, 1 = Sad 😢' />
        <CopyableJson label="🇵🇭 Tama o Mali"
          json={'[{"type":"tama","q":"...","correct":0,"explain":"...","topic":"Ordering"}]'}
          note='correct: 0 = Tama, 1 = Mali' />
        <CopyableJson label="✍️ Fill in the Blank"
          json={'[{"type":"fill","q":"...","answer":"...","explain":"...","topic":"Rounding"}]'} />
        <CopyableJson label="🔗 Matching"
          json={'[{"type":"match","q":"Match the scientist to their invention","pairs":[{"left":"Edison","right":"Light bulb"},{"left":"Bell","right":"Telephone"}],"explain":"...","topic":"Inventors"}]'} />
        <CopyableJson label="🖼️ Image Matching"
          json={'[{"type":"matchimg","q":"Match each picture to its word","pairs":[{"left":"https://example.com/cell.png","right":"Plant Cell"},{"left":"https://example.com/atom.png","right":"Atom"}],"explain":"...","topic":"Science"}]'}
          note='"left" is an image URL for every pair (shown as a picture), "right" is the word it matches.' />
        <CopyableJson label="🧩 Drag and Drop"
          json={'[{"type":"dragdrop","q":"Sort into Solid, Liquid, Gas","categories":["Solid","Liquid","Gas"],"items":[{"label":"Ice","category":"Solid"},{"label":"Water","category":"Liquid"},{"label":"Steam","category":"Gas"}],"explain":"...","topic":"Matter"}]'}
          note={'Each item\'s "category" must exactly match one of the "categories".'} />
        <CopyableJson label="📋 Ordering / Sequencing"
          json={'[{"type":"order","q":"Arrange the butterfly life cycle","items":["Egg","Larva","Pupa","Adult"],"explain":"...","topic":"Life Cycles"}]'}
          note={'List "items" in the correct order — they\'ll be shuffled for the student.'} />
        <CopyableJson label="🖼️ Label the Parts"
          json={'[{"type":"label","q":"Label the parts of the plant cell","image":"https://example.com/cell.png","points":[{"x":20,"y":30,"label":"Nucleus"},{"x":50,"y":60,"label":"Cell wall"}],"explain":"...","topic":"Cells"}]'}
          note='"x"/"y" are % position on the image, 0–100. You can also paste just "image" and "q" with no "points", then click ✏️ Edit to click on the picture and drop pins.' />
        <CopyableJson label="🔢 Number Pattern"
          json={'[{"type":"pattern","q":"Fill in the missing numbers","sequence":[2,4,"_",8,"_","_",12],"blanks":[6,10,11],"explain":"...","topic":"Skip Counting"}]'}
          note={'Put "_" in "sequence" for each blank, in order, then give each blank\'s answer in "blanks".'} />
        <p className="sub">"topic" is optional on all types — leave it out (or empty) for questions with no topic.</p>
        <div className="learn-footer" style={{gap:10}}>
          <button className="btn btn-primary" style={{background:accent}} onClick={()=>{ setShowSampleFormats(false); setShowBulkImport(true); }}>➕ Go to Add via JSON →</button>
        </div>
      </div>
    );
  }

  if(showBulkImport){
    return (
      <div className="journal-page">
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>
          <h3 style={{margin:0}}>➕ Add Questions via JSON</h3>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowBulkImport(false)}>← Back to Question Bank</button>
        </div>
        <p className="sub">Paste an array of questions below to add them to the bank. Need the format? Tap "📍 Sample" to see examples for every question type.</p>
        <button className="btn btn-ghost btn-sm" style={{alignSelf:"flex-start", marginBottom:6}} onClick={()=>{ setShowBulkImport(false); setShowSampleFormats(true); }}>📍 View Sample Formats</button>
        <label className="field-label" style={{marginTop:0}}>Topic for this batch (optional)</label>
        <input className="text-input" list="topic-suggestions" value={bulkTopic} onChange={e=>setBulkTopic(e.target.value)} placeholder="e.g. Comparing — applied to any question below with no topic of its own" />
        <datalist id="topic-suggestions">
          {topics.map(t=>(<option key={t} value={t} />))}
        </datalist>
        <p className="fill-hint">If a question in the JSON already has its own "topic", that's kept. Otherwise this batch topic is used. Leave blank for no topic.</p>
        <textarea className="text-area" rows={8} value={bulkText} onChange={e=>setBulkText(e.target.value)} placeholder="Paste JSON array here..."></textarea>
        <div className="learn-footer" style={{gap:10}}>
          <button className="btn btn-primary" style={{background:accent}} onClick={()=>handleBulkImport("append")}>➕ Append to Bank</button>
        </div>
      </div>
    );
  }

  return (
    <div className="journal-page">
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>
        <h3 style={{margin:0}}>Question Bank {questions.length ? "(" + questions.length + ")" : ""}</h3>
        <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowBulkImport(true)}>➕ JSON</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowSampleFormats(true)}>📍 Sample</button>
        </div>
      </div>
      {questions.length === 0 && <p className="sub">No questions yet. Tap "➕ JSON" above to add multiple choice, true/false, happy/sad, tama o mali, fill-in-the-blank, matching, drag-and-drop, ordering, label-the-parts, or number-pattern questions — tap "📍 Sample" to see the format for each type.</p>}

      {questions.length > 0 && (
        <div className="bank-toolbar">
          <label className="bank-selectall">
            <input type="checkbox" checked={allSelected} onChange={toggleSelectAll} />
            <span>{selected.size>0 ? selected.size + " selected" : "Select all"}</span>
          </label>
          <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
            {selected.size>0 && (
              <button className="btn btn-ghost btn-sm" onClick={handleDeleteSelected}>🗑️ Delete Selected ({selected.size})</button>
            )}
            <button className="btn btn-ghost btn-sm" onClick={handleDownloadAll}>⬇️ Download All JSON</button>
            <button className="btn btn-ghost btn-sm" style={{color:"var(--bad)"}} onClick={handleDeleteAll}>🗑️ Delete All</button>
          </div>
        </div>
      )}

      {(topics.length > 0 || noTopicCount > 0) && (
        <div className="bank-topic-tools">
          <label className="field-label" style={{marginTop:0}}>Manage by topic</label>
          {topics.map(t=>{
            const count = questions.filter(q=>normTopic(q.topic)===t).length;
            return (
              <div key={t} className="bank-topic-row">
                <span className="bank-topic-name">🏷️ {t} ({count})</span>
                <div style={{display:"flex", gap:8}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>handleDownloadTopic(t)}>⬇️ Download</button>
                  <button className="btn btn-ghost btn-sm" style={{color:"var(--bad)"}} onClick={()=>handleDeleteTopic(t)}>🗑️ Delete All</button>
                </div>
              </div>
            );
          })}
          {noTopicCount > 0 && (
            <div className="bank-topic-row">
              <span className="bank-topic-name">No topic ({noTopicCount})</span>
              <div style={{display:"flex", gap:8}}>
                <button className="btn btn-ghost btn-sm" onClick={()=>handleDownloadTopic("")}>⬇️ Download</button>
                <button className="btn btn-ghost btn-sm" style={{color:"var(--bad)"}} onClick={()=>handleDeleteTopic("")}>🗑️ Delete All</button>
              </div>
            </div>
          )}
        </div>
      )}

      {questions.length > 0 && (
        <div className="bank-topic-tools">
          <label className="field-label" style={{marginTop:0}}>Manage by question type</label>
          {QUESTION_TYPES.filter(t=>questions.some(q=>(q.type||"mcq")===t.id)).map(t=>{
            const count = questions.filter(q=>(q.type||"mcq")===t.id).length;
            return (
              <div key={t.id} className="bank-topic-row">
                <span className="bank-topic-name">{t.label} ({count})</span>
                <div style={{display:"flex", gap:8}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>handleDownloadType(t.id)}>⬇️ Download</button>
                  <button className="btn btn-ghost btn-sm" style={{color:"var(--bad)"}} onClick={()=>handleDeleteType(t.id)}>🗑️ Delete All</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {questions.map((q,i)=>{
        const t = q.type || "mcq";
        const typeLabel = t === "fill" ? "✍️ Fill in the Blank"
          : t === "tf" ? "✅ True / False"
          : t === "emoji" ? "😊 Happy / Sad"
          : t === "tama" ? "🇵🇭 Tama o Mali"
          : t === "match" ? "🔗 Matching"
          : t === "matchimg" ? "🖼️ Image Matching"
          : t === "dragdrop" ? "🧩 Drag and Drop"
          : t === "order" ? "📋 Ordering / Sequencing"
          : t === "label" ? "🖼️ Label the Parts"
          : t === "pattern" ? "🔢 Number Pattern"
          : "🔤 Multiple Choice";
        const isEditing = editingIndex === i;

        if(isEditing){
          const dt = draft.type || "mcq";
          return (
            <div key={i} className="bank-item bank-item-editing">
              <div className="bank-item-select" />
              <div className="bank-item-body">
                <div className="bank-item-type">{typeLabel}{" · ✏️ Editing"}</div>

                <label className="field-label" style={{marginTop:0}}>Question text</label>
                <textarea className="text-area" rows={2} value={draft.q} onChange={e=>updateDraft("q", e.target.value)} />

                {(dt === "tf" || dt === "tama" || dt === "emoji") && (
                  <React.Fragment>
                    <label className="field-label">Correct answer</label>
                    <div className="bank-edit-opts">
                      {draft.options.map((o,oi)=>(
                        <label key={oi} className="bank-edit-opt-row">
                          <input type="radio" name={"correct-"+i} checked={draft.correct===oi} onChange={()=>updateDraft("correct", oi)} />
                          <span>{o}</span>
                        </label>
                      ))}
                    </div>
                  </React.Fragment>
                )}

                {dt === "mcq" && (
                  <React.Fragment>
                    <label className="field-label">Choices (pick the correct one)</label>
                    <div className="bank-edit-opts">
                      {draft.options.map((o,oi)=>(
                        <div key={oi} className="bank-edit-opt-row">
                          <input type="radio" name={"correct-"+i} checked={draft.correct===oi} onChange={()=>updateDraft("correct", oi)} title="Mark as correct" />
                          <input className="text-input" value={o} onChange={e=>updateOption(oi, e.target.value)} placeholder={"Choice " + (oi+1)} />
                          {draft.options.length > 2 && (
                            <button type="button" className="btn btn-ghost btn-sm" onClick={()=>removeOption(oi)}>✕</button>
                          )}
                        </div>
                      ))}
                    </div>
                    <button type="button" className="btn btn-ghost btn-sm" onClick={addOption}>➕ Add Choice</button>
                  </React.Fragment>
                )}

                {dt === "fill" && (
                  <React.Fragment>
                    <label className="field-label">Answer</label>
                    <input className="text-input" value={draft.answer} onChange={e=>updateDraft("answer", e.target.value)} />
                  </React.Fragment>
                )}

                {(dt === "match" || dt === "matchimg") && (
                  <React.Fragment>
                    <label className="field-label">Pairs</label>
                    {dt === "matchimg" && <p className="fill-hint" style={{marginTop:0}}>"Left" is an image URL (like Label the Parts) — it's shown as a picture instead of text.</p>}
                    <div className="bank-edit-opts">
                      {draft.pairs.map((p,pi)=>(
                        <div key={pi} className="bank-edit-opt-row">
                          <input className="text-input" value={p.left} onChange={e=>updatePair(pi, "left", e.target.value)} placeholder={dt === "matchimg" ? "Image URL" : "Left"} />
                          <span>→</span>
                          <input className="text-input" value={p.right} onChange={e=>updatePair(pi, "right", e.target.value)} placeholder="Right" />
                          {draft.pairs.length > 2 && (
                            <button type="button" className="btn btn-ghost btn-sm" onClick={()=>removePair(pi)}>✕</button>
                          )}
                        </div>
                      ))}
                    </div>
                    <button type="button" className="btn btn-ghost btn-sm" onClick={addPair}>➕ Add Pair</button>
                  </React.Fragment>
                )}

                {dt === "dragdrop" && (
                  <React.Fragment>
                    <label className="field-label">Categories</label>
                    <div className="bank-edit-opts">
                      {draft.categories.map((c,ci)=>(
                        <div key={ci} className="bank-edit-opt-row">
                          <input className="text-input" value={c} onChange={e=>updateDDCategory(ci, e.target.value)} placeholder={"Category " + (ci+1)} />
                          {draft.categories.length > 2 && (
                            <button type="button" className="btn btn-ghost btn-sm" onClick={()=>removeDDCategory(ci)}>✕</button>
                          )}
                        </div>
                      ))}
                    </div>
                    <button type="button" className="btn btn-ghost btn-sm" onClick={addDDCategory}>➕ Add Category</button>

                    <label className="field-label">Items</label>
                    <div className="bank-edit-opts">
                      {draft.items.map((it,ii)=>(
                        <div key={ii} className="bank-edit-opt-row">
                          <input className="text-input" value={it.label} onChange={e=>updateDDItem(ii, "label", e.target.value)} placeholder="Item" />
                          <span>→</span>
                          <select className="text-input" value={it.category} onChange={e=>updateDDItem(ii, "category", e.target.value)}>
                            {draft.categories.map((c,ci)=>(<option key={ci} value={c}>{c}</option>))}
                          </select>
                          {draft.items.length > 2 && (
                            <button type="button" className="btn btn-ghost btn-sm" onClick={()=>removeDDItem(ii)}>✕</button>
                          )}
                        </div>
                      ))}
                    </div>
                    <button type="button" className="btn btn-ghost btn-sm" onClick={addDDItem}>➕ Add Item</button>
                  </React.Fragment>
                )}

                {dt === "order" && (
                  <React.Fragment>
                    <label className="field-label">Steps (in correct order)</label>
                    <div className="bank-edit-opts">
                      {draft.items.map((it,ii)=>(
                        <div key={ii} className="bank-edit-opt-row">
                          <span className="bank-edit-step-num">{ii+1}.</span>
                          <input className="text-input" value={it} onChange={e=>updateOrderItem(ii, e.target.value)} placeholder={"Step " + (ii+1)} />
                          {draft.items.length > 2 && (
                            <button type="button" className="btn btn-ghost btn-sm" onClick={()=>removeOrderItem(ii)}>✕</button>
                          )}
                        </div>
                      ))}
                    </div>
                    <button type="button" className="btn btn-ghost btn-sm" onClick={addOrderItem}>➕ Add Step</button>
                  </React.Fragment>
                )}

                {dt === "label" && (
                  <React.Fragment>
                    <label className="field-label">Image URL</label>
                    <input className="text-input" value={draft.image||""} onChange={e=>updateLabelImage(e.target.value)} placeholder="https://..." />
                    {String(draft.image||"").trim() ? (
                      <React.Fragment>
                        <p className="fill-hint">Click anywhere on the picture to drop a numbered pin, then type its label below.</p>
                        <div className="label-editor-wrap" onClick={handleLabelImageClick}>
                          <img src={draft.image} alt="" className="label-image" />
                          {(draft.points||[]).map((p,pi)=>(
                            <div key={pi} className="label-pin label-pin-edit" style={{left:p.x+"%", top:p.y+"%"}}>
                              <span className="label-pin-num">{pi+1}</span>
                            </div>
                          ))}
                        </div>
                      </React.Fragment>
                    ) : (
                      <p className="fill-hint">Paste an image URL above, then click the picture to drop pins.</p>
                    )}
                    <label className="field-label">Pin labels</label>
                    <div className="bank-edit-opts">
                      {(draft.points||[]).map((p,pi)=>(
                        <div key={pi} className="bank-edit-opt-row">
                          <span className="bank-edit-step-num">{pi+1}.</span>
                          <input className="text-input" value={p.label} onChange={e=>updateLabelPoint(pi, e.target.value)} placeholder={"Label for pin " + (pi+1)} />
                          <button type="button" className="btn btn-ghost btn-sm" onClick={()=>removeLabelPoint(pi)}>✕</button>
                        </div>
                      ))}
                      {(!draft.points || draft.points.length===0) && (
                        <p className="fill-hint" style={{margin:0}}>No pins yet — click the picture above to add one.</p>
                      )}
                    </div>
                  </React.Fragment>
                )}

                {dt === "pattern" && (
                  <React.Fragment>
                    <label className="field-label">Pattern (toggle each spot between a number and a blank)</label>
                    <div className="bank-edit-opts">
                      {(draft.items||[]).map((it,ii)=>(
                        <div key={ii} className="bank-edit-opt-row">
                          <button type="button" className="btn btn-ghost btn-sm" onClick={()=>togglePatternKind(ii)} title="Switch between number and blank">
                            {it.kind==="blank" ? "🔲 Blank" : "🔢 Number"}
                          </button>
                          {it.kind==="blank" ? (
                            <input className="text-input" value={it.answer||""} onChange={e=>updatePatternItem(ii, "answer", e.target.value)} placeholder="Correct answer" />
                          ) : (
                            <input className="text-input" value={it.value||""} onChange={e=>updatePatternItem(ii, "value", e.target.value)} placeholder="Number shown" />
                          )}
                          {(draft.items||[]).length > 1 && (
                            <button type="button" className="btn btn-ghost btn-sm" onClick={()=>removePatternItem(ii)}>✕</button>
                          )}
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex", gap:8}}>
                      <button type="button" className="btn btn-ghost btn-sm" onClick={()=>addPatternItem("num")}>➕ Add Number</button>
                      <button type="button" className="btn btn-ghost btn-sm" onClick={()=>addPatternItem("blank")}>➕ Add Blank</button>
                    </div>
                  </React.Fragment>
                )}

                <label className="field-label">Explanation (optional)</label>
                <textarea className="text-area" rows={2} value={draft.explain||""} onChange={e=>updateDraft("explain", e.target.value)} />

                <label className="field-label">Topic (optional)</label>
                <input className="text-input" list="topic-suggestions" value={draft.topic||""} onChange={e=>updateDraft("topic", e.target.value)} placeholder="e.g. Comparing" />

                <div className="bank-item-actions" style={{marginTop:12}}>
                  <button className="btn btn-primary btn-sm" style={{background:accent}} onClick={saveEdit}>💾 Save</button>
                  <button className="btn btn-ghost btn-sm" onClick={cancelEdit}>Cancel</button>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div key={i} className={"bank-item" + (selected.has(i) ? " bank-item-selected" : "")}>
            <label className="bank-item-select">
              <input type="checkbox" checked={selected.has(i)} onChange={()=>toggleSelect(i)} />
            </label>
            <div className="bank-item-body">
              <div className="bank-item-type">{typeLabel}{normTopic(q.topic) ? " · 🏷️ " + normTopic(q.topic) : ""}</div>
              <div className="bank-item-q">{i+1}. {q.q}</div>
              {t === "fill" && (
                <div className="bank-item-opts">
                  <span className="bank-opt bank-opt-correct">{q.answer}</span>
                </div>
              )}
              {(t === "match" || t === "matchimg") && (
                <div className="bank-item-opts">
                  {q.pairs.map((p,pi)=>(
                    <span key={pi} className="bank-opt bank-opt-correct">{t === "matchimg" ? "🖼️ " + p.left : p.left} → {p.right}</span>
                  ))}
                </div>
              )}
              {t === "dragdrop" && (
                <div className="bank-item-opts">
                  {q.items.map((it,ii)=>(
                    <span key={ii} className="bank-opt bank-opt-correct">{it.label} → {it.category}</span>
                  ))}
                </div>
              )}
              {t === "order" && (
                <div className="bank-item-opts">
                  <span className="bank-opt bank-opt-correct">{q.items.join(" → ")}</span>
                </div>
              )}
              {t === "label" && (
                <div className="bank-item-opts">
                  {(q.points||[]).map((p,pi)=>(
                    <span key={pi} className="bank-opt bank-opt-correct">{pi+1}. {p.label}</span>
                  ))}
                </div>
              )}
              {t === "pattern" && (
                <div className="bank-item-opts">
                  <span className="bank-opt bank-opt-correct">
                    {(q.items||[]).map(it=> it.kind==="blank" ? "[" + String(it.answer||"").split("|")[0].trim() + "]" : it.value).join(", ")}
                  </span>
                </div>
              )}
              {(t === "mcq" || t === "tf" || t === "tama" || t === "emoji") && (
                <div className="bank-item-opts">
                  {q.options.map((o,oi)=>(
                    <span key={oi} className={"bank-opt" + (oi===q.correct ? " bank-opt-correct":"")}>{o}</span>
                  ))}
                </div>
              )}
              <div className="bank-item-actions">
                <button className="btn btn-ghost btn-sm" onClick={()=>startEdit(i)}>✏️ Edit</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>handleDeleteOne(i)}>🗑️ Delete</button>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* =========================================================
   MAIN APP
   ========================================================= */

/* ---------------- GRADES SCREEN ----------------
   Defined at top level (NOT inside App) on purpose: App() previously
   redefined GradesScreen as a brand-new function on every render, so
   React saw a different component "type" each time and fully remounted
   it — which is what was kicking a parent out of a Final/Detailed score
   field (or the Share-card name field) after every single keystroke.
   Keeping it top-level means its identity never changes, so React just
   re-renders it in place like everything else. All the App-level state
   and setters it needs now come in as props from the <GradesScreen/>
   call site inside App(). */
  function GradesScreen({
    grades, gradeConfig, gradesOpenSubject, setGradesOpenSubject,
    gradesSelectedQuarter, setGradesSelectedQuarter, goDashboard,
    setGradeEntry, addGradeItem, removeGradeItem, updateGradeItem,
    adjustSubjectFinal, setSubjectWeight, setHonorThreshold, resetGradeConfig,
    clearGradeFinalOverride
  }){
    const openSubject = gradesOpenSubject, setOpenSubject = setGradesOpenSubject;
    const selectedQuarter = gradesSelectedQuarter, setSelectedQuarter = setGradesSelectedQuarter;
    const [showSettings, setShowSettings] = useState(false);

    // ---- Facebook share (shareable report-card image) ----
    const [shareStep, setShareStep] = useState(null); // null | "form" | "card"
    const [shareQuarterId, setShareQuarterId] = useState(GRADE_QUARTERS[GRADE_QUARTERS.length-1].id); // quarter id, or "final"
    const [shareName, setShareName] = useState("Charlie");
    const [shareBusy, setShareBusy] = useState(false);
    const shareCardRef = useRef(null);

    // Keep the share overlay pinned to what's actually on screen: on mobile,
    // a "position:fixed" overlay is measured against the full page height,
    // so if the Grades page was scrolled down when Share was tapped, the
    // overlay could open below the visible area. Snapping scroll to the top
    // and locking body scroll while the overlay is open fixes that.
    useEffect(()=>{
      if(!shareStep) return;
      const prevOverflow = document.body.style.overflow;
      window.scrollTo(0, 0);
      document.body.style.overflow = "hidden";
      return ()=>{ document.body.style.overflow = prevOverflow; };
    }, [shareStep]);

    const weightFor = sid => gradeConfig.weights[sid] || GRADE_WEIGHTS[sid];
    const subjectFinals = GRADED_SUBJECTS.map(s=>({s, final: subjectDisplayFinal(s.id, grades[s.id], weightFor(s.id))}));
    const withGrade = subjectFinals.filter(x=>x.final!=null);
    const generalAvg = withGrade.length ? withGrade.reduce((a,x)=>a+x.final,0)/withGrade.length : null;
    const honor = honorLabel(generalAvg, gradeConfig.honors);

    // Column averages across every subject, for the report-card footer row.
    const quarterAverages = GRADE_QUARTERS.map(q=>{
      const vals = GRADED_SUBJECTS.map(s=>computeQuarterGrade(s.id, (grades[s.id]||{})[q.id], weightFor(s.id))).filter(v=>v!=null);
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    });

    function toggleSubject(sid){
      Sound.nav();
      setOpenSubject(prev=> prev===sid ? null : sid);
    }
    function nudge(e, subjectId, delta){
      e.stopPropagation();
      Sound.tap();
      adjustSubjectFinal(subjectId, delta);
    }

    function openShareForm(){
      Sound.nav();
      setShareQuarterId(selectedQuarter);
      setShareStep("form");
    }
    function closeShare(){
      setShareStep(null);
      setShareBusy(false);
    }
    function goToShareCard(){
      Sound.tap();
      setShareStep("card");
    }

    // Data for whichever quarter was picked in the share form. "final" is a
    // special pseudo-quarter meaning "the whole school year" — it shows every
    // subject's final grade and the general average across all quarters.
    const isFinalShare = shareQuarterId === "final";
    const shareQIndex = GRADE_QUARTERS.findIndex(q=>q.id===shareQuarterId);
    const shareQuarterLabel = isFinalShare ? "Final Grades" : (GRADE_QUARTERS[shareQIndex] ? GRADE_QUARTERS[shareQIndex].label : "");
    const shareRows = isFinalShare
      ? subjectFinals.filter(x=>x.final!=null).map(({s, final})=>({s, grade: final}))
      : GRADED_SUBJECTS.map(s=>{
          const subjGrades = grades[s.id] || {};
          const g = computeQuarterGrade(s.id, subjGrades[shareQuarterId], weightFor(s.id));
          return {s, grade:g};
        }).filter(r=>r.grade!=null);
    const shareAvg = isFinalShare ? generalAvg : quarterAverages[shareQIndex];
    const shareHonor = honorLabel(shareAvg, gradeConfig.honors);
    const shareDisplayName = shareName.trim() || "Charlie";

    // Renders the on-screen card to an image, then hands it to the native
    // share sheet (which includes Facebook on most phones/tablets). Falls
    // back to downloading the PNG if native sharing isn't available.
    async function shareReportCard(){
      if(!shareCardRef.current || typeof html2canvas === "undefined") return;
      setShareBusy(true);
      try{
        const canvas = await html2canvas(shareCardRef.current, {backgroundColor:"#19348E", scale:2, useCORS:true});
        const blob = await new Promise(resolve=>canvas.toBlob(resolve, "image/png"));
        if(!blob){ setShareBusy(false); return; }
        const fileName = (shareName.trim() || "report-card") + "-" + shareQuarterLabel.toLowerCase().replace(/\s+/g,"-") + ".png";
        const file = new File([blob], fileName, {type:"image/png"});
        const shareData = {
          files:[file],
          title: shareDisplayName + "'s Report Card",
          text: shareDisplayName + "'s " + shareQuarterLabel + " report card — Sacred Heart Academy of Pasig"
        };
        if(navigator.share && navigator.canShare && navigator.canShare(shareData)){
          await navigator.share(shareData);
        } else {
          // No native share sheet (most desktop browsers) — download the
          // image instead so it can still be attached to a Facebook post.
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = fileName;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(url), 2000);
        }
      } catch(err){
        if(err && err.name !== "AbortError") console.error("Report card share failed:", err);
      }
      setShareBusy(false);
    }

    return (
      <React.Fragment>
        <div className="backbar">
          <button className="backbtn" onClick={goDashboard}>←</button>
          <div>
            <div className="qnum">Report Card</div>
            <h1 style={{margin:0, fontSize:"22px"}}>🎓 Grades</h1>
          </div>
          <button
            className="backbtn"
            style={{marginLeft:"auto"}}
            title="Grading settings"
            onClick={()=>{ Sound.nav(); setShowSettings(v=>!v); }}
          >⚙️</button>
        </div>

        {showSettings && (
          <div className="passport rc-passport" onClick={e=>e.stopPropagation()}>
            <div className="passport-title" style={{display:"flex", alignItems:"center", justifyContent:"space-between"}}>
              <span>Grading Settings</span>
              <button
                className="smeta"
                style={{background:"none", border:"none", cursor:"pointer", textDecoration:"underline"}}
                onClick={()=>{ Sound.tap(); resetGradeConfig(); }}
              >Reset to defaults</button>
            </div>

            <div className="field-label" style={{marginTop:6}}>Honor roll cutoffs (general average)</div>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:16}}>
              {[["highest","Highest Honors"],["high","High Honors"],["honors","With Honors"]].map(([key,label])=>(
                <div key={key}>
                  <label className="field-label">{label}</label>
                  <input
                    className="text-input"
                    type="number" min="0" max="100" inputMode="decimal"
                    value={gradeConfig.honors[key] ?? ""}
                    onChange={e=>setHonorThreshold(key, e.target.value===""? "" : Number(e.target.value))}
                  />
                </div>
              ))}
            </div>

            <div className="field-label">Transmutation weights per subject (Written Work / Performance Task / Quarterly Assessment)</div>
            <div style={{display:"grid", gap:10}}>
              {GRADED_SUBJECTS.map(s=>{
                const w = weightFor(s.id);
                return (
                  <div key={s.id} style={{display:"grid", gridTemplateColumns:"auto 1fr 1fr 1fr", gap:8, alignItems:"center"}}>
                    <div className="smeta" style={{whiteSpace:"nowrap"}}><SubjectIcon icon={s.icon}/> {s.shortName}</div>
                    {[["ww","WW"],["pt","PT"],["qa","QA"]].map(([key,label])=>(
                      <div key={key}>
                        <label className="field-label">{label} %</label>
                        <input
                          className="text-input"
                          type="number" min="0" max="100" inputMode="decimal"
                          value={Math.round((w[key]??0)*100)}
                          onChange={e=>{
                            const pct = e.target.value===""? "" : Number(e.target.value);
                            setSubjectWeight(s.id, key, pct===""? "" : pct/100);
                          }}
                        />
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
            <div className="smeta" style={{marginTop:8}}>WW + PT + QA should add up to 100% per subject.</div>
          </div>
        )}

        <div className="passport rc-passport">
          <div className="passport-title" style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>
            <span>Report Card — All Subjects</span>
            <button className="rc-share-btn" onClick={openShareForm}>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="white"><path d="M22 12.06C22 6.51 17.52 2 12 2S2 6.51 2 12.06C2 17.06 5.66 21.21 10.44 22v-7.02H7.9v-2.92h2.54V9.84c0-2.51 1.49-3.9 3.78-3.9 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.9h2.78l-.44 2.92h-2.34V22C18.34 21.21 22 17.06 22 12.06z"/></svg>
              Share
            </button>
          </div>
          <div className="rc-table" style={{margin:0}}>
            <div className="rc-row rc-head">

        <div className="section-title" style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>

                      <div key={q.id} className="grade-qbox">
                        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10, flexWrap:"wrap", gap:8}}>

                            <button

                            <button
                              className={"type-tab" + (mode==="detailed" ? " active":"")}
                              style={{padding:"4px 10px", fontSize:"12px"}}

                            >Detailed</button>
                            <div className="smeta" style={{marginLeft:6, color:s.color, fontSize:"16px"}}>{qGrade!=null ? qGrade : "—"}</div>
                          </div>
                        </div>

                        {mode==="final" ? (
                          <div style={{display:"grid", gap:10}}>
                            {[["ww","Written Work", w.ww],["pt","Performance Task", w.pt],["qa","Quarterly Assessment", w.qa]].map(([key,label,weight])=>{
                              // Auto-fills from the Detailed items' computed average when no
                              // manual value has been typed here yet, so switching to Final
                              // mode never hides work already entered in Detailed mode. Typing
                              // in the box (or clicking "Reset to auto") overrides/clears it.
                              const manualVal = entry[key+"Final"];
                              const hasManual = manualVal !== "" && manualVal != null;
                              const legacyVal = entry[key];
                              const hasLegacy = !hasManual && legacyVal!=null && legacyVal!=="" && !Array.isArray(legacyVal);
                              const autoPct = detailedComponentPct(entry, key);
                              const displayVal = hasManual ? manualVal : (hasLegacy ? legacyVal : (autoPct!=null ? Math.round(autoPct*10)/10 : ""));

                                  {isAuto ? (

                                    <div className="smeta" style={{marginTop:4, cursor:"pointer", textDecoration:"underline"}}
                                      onClick={()=>clearGradeFinalOverride(s.id, q.id, key)}>
                                      ↺ Reset to auto (from Detailed items)
                                    </div>
                                  ) : null}
                                </div>
                              );
                            })}
                          </div>
                        ) : (
                          <div style={{display:"grid", gap:14}}>
                            {[["ww","Written Work", w.ww],["pt","Performance Task", w.pt],["qa","Quarterly Assessment", w.qa]].map(([key,label,weight])=>{
                              const items = entry[key] || [];
                              return (
                                <div key={key}>
                                  <label className="field-label">{label} — {Math.round(weight*100)}% of Final Grade</label>
                                  {items.length===0 && <div className="smeta" style={{marginBottom:6}}>No items yet.</div>}
                                  {items.map((it,idx)=>(
                                    <div key={idx} className="grade-comp-item">
                                      <div style={{flex:1}}>
                                        <label className="field-label">{label} #{idx+1} Score</label>
                                        <input className="text-input" type="number" min="0" inputMode="decimal"
                                          value={it.score ?? ""}

                                      <div style={{flex:1}}>
                                        <label className="field-label">out of</label>
                                        <input className="text-input" type="number" min="0" inputMode="decimal"

                                          onChange={e=>updateGradeItem(s.id, q.id, key, idx, "total", e.target.value)}

                                      </div>

                                  <button className="grade-add-btn" onClick={()=>addGradeItem(s.id, q.id, key)}>+ Add {label} #{items.length+1}</button>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}

        <div className="footer-note">SACRED HEART ACADEMY OF PASIG · GRADE SCHOOL DEPARTMENT</div>

        {shareStep==="form" && (

                <button
